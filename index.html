<script>/* bio2/c34.js */
/* 第3-4章 */
const CH34=[
{id:'3',t:'细胞的基本结构',secs:[
{id:'3-1',t:'细胞膜的结构和功能',
 goal:'理解细胞膜作为“系统的边界”有哪些功能；跟着科学家的思路重走一遍探索膜结构的历程，弄清每个实验推出了什么结论；掌握流动镶嵌模型，并能用它解释膜的特性。',
 focus:[[3,'流动镶嵌模型的内容'],[3,'结构特点（流动性）与功能特性（选择透过性）'],[3,'细胞膜的三大功能及信息交流的三种方式'],[2,'细胞膜探索历程中各实验的推理'],[2,'人鼠细胞融合实验'],[1,'台盼蓝染色鉴别死活细胞']],
 models:['membrane','fusion'],
 pts:[
 {t:'细胞膜的三大功能',lv:3,k:['分隔','控制物质进出','信息交流'],
  core:'① <b>将细胞与外界环境分隔开</b>，保障细胞内部环境的相对稳定；② <b>控制物质进出细胞</b>；③ <b>进行细胞间的信息交流</b>。',
  why:`<b>① 分隔：</b>在生命起源过程中，膜的出现把生命物质与外界环境分隔开，产生了原始的细胞，成为相对独立的系统。这是“系统”必须有“边界”的体现。
<b>② 控制物质进出：</b>细胞膜像海关或边防检查站。需要的营养物质可以进入；不需要的不容易进入；抗体、激素等可以分泌出去，代谢废物可以排出；细胞内有用的成分不会轻易流失。
<b>但这种控制是相对的</b>：环境中一些有害物质可能进入，有些病毒、病菌也能侵入细胞使人患病。
<b>台盼蓝染色的道理：</b>活细胞的细胞膜能控制台盼蓝不进入，所以不着色；死细胞的细胞膜失去控制作用，台盼蓝进入，细胞被染成蓝色。所以可以用台盼蓝鉴别动物细胞的死活。
<b>③ 信息交流的三种方式：</b>
<table class="tb"><tr><th>方式</th><th>过程</th><th>例子</th></tr>
<tr><td>化学物质间接传递</td><td>内分泌细胞分泌激素 → 随血液到达全身 → 与靶细胞膜表面的<b>受体</b>结合</td><td>胰岛素作用于肝细胞</td></tr>
<tr><td>细胞膜直接接触</td><td>相邻两个细胞的细胞膜接触，信息从一个细胞传给另一个</td><td><b>精子和卵细胞</b>的识别和结合</td></tr>
<tr><td>形成通道</td><td>相邻细胞之间形成通道，携带信息的物质通过通道进入另一个细胞</td><td>高等植物细胞间的<b>胞间连丝</b></td></tr></table>
细胞间的信息交流<b>大多与细胞膜的结构有关</b>（受体多是糖蛋白），但胞间连丝这种方式不依赖膜上的受体。`,
  exam:'“细胞膜是一道屏障，只有细胞需要的物质才能进入”（错，控制是相对的）。“细胞间的信息交流都依赖于细胞膜上的受体”（错，胞间连丝不需要；另外有些受体在细胞内，如性激素的受体）。'},
 {t:'探索细胞膜成分：从推理到提取',lv:2,k:['欧文顿','磷脂','胆固醇','戈特和格伦德尔','丹尼利和戴维森'],
  core:'细胞膜主要由<b>脂质和蛋白质</b>组成，还有少量糖类。脂质约占 50%，蛋白质约占 40%，糖类占 2%～10%。脂质中<b>磷脂最丰富</b>，还有少量胆固醇。',
  why:`把这段历史看成一串“观察 → 推理 → 新证据”的链条：
<table class="tb"><tr><th>时间与人物</th><th>做了什么</th><th>推出什么</th></tr>
<tr><td>1895 欧文顿</td><td>用 500 多种物质对植物细胞做上万次通透性实验，发现<b>溶于脂质的物质更容易穿过细胞膜</b></td><td>细胞膜中有<b>脂质</b>（这是推理，不是提取检测）</td></tr>
<tr><td>后续化学分析</td><td>用哺乳动物红细胞制备纯净细胞膜进行分析</td><td>脂质是<b>磷脂和胆固醇</b>，磷脂最多</td></tr>
<tr><td>1925 戈特、格伦德尔</td><td>用丙酮从人红细胞中提取脂质，在<b>空气—水界面</b>铺成单分子层，面积恰为红细胞表面积的<b>2 倍</b></td><td>磷脂分子排列为<b>连续的两层</b></td></tr>
<tr><td>1935 丹尼利、戴维森</td><td>细胞的表面张力明显<b>低于</b>油—水界面的表面张力（已知油滴表面吸附蛋白质后表面张力会降低）</td><td>细胞膜除脂质外可能还附有<b>蛋白质</b></td></tr></table>
<b>为什么选人的红细胞？</b>哺乳动物成熟红细胞没有细胞核和众多细胞器，提取到的脂质全部来自细胞膜，面积对比才有意义。
<b>为什么磷脂在空气—水界面铺成单层？</b>磷脂头部亲水，伸入水中；尾部疏水，朝向空气。
<b>为什么磷脂在水中会自发形成双分子层？</b>两层磷脂的疏水尾部相对藏在中间，亲水头部朝向两侧的水，这是能量最低、最稳定的排列。细胞内外都是水环境，所以膜必然是双层。
<b>如果放在水—苯混合溶剂中呢？</b>磷脂会排列在水和苯的界面上，形成单层：头部朝水，尾部朝苯。`,
  exam:'信息给予题：“红细胞的脂质铺成单层后面积是表面积的 2 倍，说明什么”；“如果用鸡的红细胞做这个实验，面积会大于还是等于 2 倍”——大于 2 倍，因为鸡红细胞有细胞核膜和细胞器膜。'},
 {t:'探索细胞膜结构：从静态到流动',lv:2,k:['罗伯特森','暗—亮—暗','人鼠细胞融合','辛格和尼科尔森'],
  core:'1959 年罗伯特森提出“<b>蛋白质—脂质—蛋白质</b>”三层静态结构模型；1970 年人鼠细胞融合实验证明细胞膜具有<b>流动性</b>；1972 年辛格和尼科尔森提出<b>流动镶嵌模型</b>，为大多数人所接受。',
  why:`<b>罗伯特森模型的依据：</b>电镜下看到细胞膜清晰的“暗—亮—暗”三层结构，他认为中间亮层是脂质，两边暗层是蛋白质，把膜描述为<b>静态的统一结构</b>。
<b>为什么后来被质疑？</b>如果膜是静态的，细胞的生长（膜面积要增大）、变形虫的变形运动、细胞分裂等现象都无法解释，膜的复杂功能也难以实现。
<b>人鼠细胞融合实验（1970）：</b>
<ol><li>用<b>绿色</b>荧光染料标记小鼠细胞表面的<b>蛋白质</b>，用<b>红色</b>荧光染料标记人细胞表面的蛋白质；</li>
<li>两种细胞融合，刚融合时一半绿一半红；</li>
<li>在 <b>37 ℃</b> 下经过 <b>40 min</b>，两种颜色均匀分布。</li></ol>
结论：细胞膜（上的蛋白质）具有<b>流动性</b>。
<b>拓展：</b>如果把温度降到很低（如 0 ℃ 左右），两种荧光混合所需时间大大延长甚至不混合，说明流动性受温度影响。可以在本节的模型中拖动温度试一试。
<b>科学方法——提出假说：</b>科学家先根据已有知识提出假说，再用新的观察和实验检验、修正。一种假说最终被接受还是被否定，取决于它能否与不断得到的观察和实验结果吻合。`,
  exam:'“人鼠细胞融合实验中标记的是什么”——膜上的蛋白质（不是磷脂）。“该实验说明什么”——细胞膜具有流动性。也常考“该实验的温度为什么是 37 ℃”。'},
 {t:'流动镶嵌模型的基本内容',lv:3,k:['磷脂双分子层','基本支架','镶','嵌','贯穿','糖被'],
  core:'细胞膜主要由磷脂分子和蛋白质分子构成。<b>磷脂双分子层是膜的基本支架</b>；蛋白质分子有的<b>镶</b>在磷脂双分子层表面，有的部分或全部<b>嵌入</b>，有的<b>贯穿</b>整个磷脂双分子层；磷脂分子可以侧向自由移动，膜中的蛋白质<b>大多</b>也能运动；细胞膜外表面有<b>糖被</b>。',
  why:`<b>“基本支架”起什么作用？</b>磷脂双分子层内部是疏水的尾部，<b>水溶性分子或离子不能自由通过</b>，因此具有<b>屏障作用</b>。脂溶性物质（如甘油、乙醇）却容易通过——这正好解释了欧文顿的发现。
<b>既然膜内部疏水，水为什么能进出细胞？</b>一部分水分子可以从磷脂分子的间隙中自由扩散通过；更多的水借助<b>水通道蛋白</b>进出（见第 4 章）。
<b>蛋白质有什么用？</b>膜蛋白在物质运输等方面具有重要作用。<b>功能越复杂的细胞膜，蛋白质的种类与数量就越多</b>。例如线粒体内膜功能复杂，蛋白质含量就很高。
<b>“流动”体现在哪里？</b>磷脂分子可以<b>侧向自由移动</b>，膜中的蛋白质<b>大多</b>也能运动（注意是“大多”，不是全部）。流动性对细胞完成物质运输、生长、分裂、运动等功能都非常重要。
<b>糖被：</b>细胞膜外表面的糖类分子，与蛋白质结合形成<b>糖蛋白</b>，或与脂质结合形成<b>糖脂</b>，这些糖类分子叫作糖被。糖被与细胞表面的<b>识别</b>、细胞间的<b>信息传递</b>等功能密切相关。<b>糖被只分布在膜的外侧</b>，所以可以用它判断细胞膜的内外。
<b>脂质体的应用：</b>由磷脂分子构成的小球，可以作为药物载体。<b>水溶性</b>药物包在双分子层围成的内部（水环境），<b>脂溶性</b>药物包在两层磷脂分子之间（疏水尾部区域）。脂质体到达细胞后，与细胞膜融合，把药物送进细胞，这也利用了膜的流动性。`,
  exam:'“构成细胞膜的磷脂分子具有流动性，而蛋白质是固定不动的”（错）；“向细胞内注射物质后，细胞膜上会留下一个空洞”（错，膜有流动性，会自动封闭）。识图题：标出磷脂双分子层、蛋白质、糖蛋白，判断膜的内外侧。'},
 {t:'结构特点与功能特性',lv:3,k:['流动性','选择透过性'],
  core:'细胞膜的<b>结构特点</b>：具有<b>一定的流动性</b>。<b>功能特性</b>：<b>选择透过性</b>。',
  why:`<b>两者的关系：</b>结构决定功能。流动性是选择透过性的<b>基础</b>——转运蛋白要改变构象、膜要变形，都依赖膜的流动。
<b>体现流动性的实例：</b>人鼠细胞融合、变形虫运动、白细胞吞噬病菌（胞吞）、分泌蛋白分泌（胞吐）、细胞分裂时细胞膜缢裂、质壁分离与复原（原生质层收缩和膨胀）、精卵融合。
<b>体现选择透过性的实例：</b>台盼蓝不能进入活细胞、细胞主动吸收 K⁺ 而排出 Na⁺、根细胞对不同离子吸收量不同。
<b>窗纱类比的局限：</b>有人把细胞膜比作窗纱，能挡住昆虫，让空气通过。合理之处：都能让一些物质通过、阻挡另一些物质。不妥之处：窗纱是静态的、靠孔径大小筛选；细胞膜是动态的、有流动性，靠转运蛋白的种类和数量“主动选择”，还能逆浓度梯度运输。`,
  exam:'判断某现象体现的是流动性还是选择透过性，是高频题。“白细胞吞噬病菌说明细胞膜具有”——一定的流动性。'}],
 traps:['“细胞膜上的蛋白质都是可以运动的”错：是大多数。','“糖蛋白分布在细胞膜两侧”错：只在外侧。','“欧文顿通过提取检测发现了膜中有脂质”错：他是通过现象推理得出的。','“罗伯特森模型认为膜是动态的”错：是静态的。','“细胞膜的流动性是功能特性”错：是结构特点。']},

{id:'3-2',t:'细胞器之间的分工合作',
 goal:'认识每种细胞器的结构和功能，并能按“膜层数、分布、是否含核酸、是否含色素、能否产生水或 ATP”等角度对细胞器归类；能完整描述分泌蛋白的合成和运输途径；理解生物膜系统的概念和作用。',
 focus:[[3,'各种细胞器的结构与功能'],[3,'分泌蛋白的合成与运输过程（同位素标记法）'],[3,'细胞器的多角度归类'],[2,'生物膜系统的组成与功能'],[2,'动植物细胞结构比较'],[2,'观察叶绿体和细胞质流动实验'],[1,'差速离心法；细胞骨架']],
 models:['cell3d','cell','secrete'],
 pts:[
 {t:'差速离心法与细胞质基质',lv:1,k:['差速离心法','细胞质基质'],
  core:'分离细胞器常用<b>差速离心法</b>：破坏细胞膜形成匀浆，采取<b>逐渐提高离心速率</b>的方法分离不同大小的颗粒。细胞质中呈溶胶状的部分叫<b>细胞质基质</b>，细胞器分布在其中。',
  why:`<b>原理：</b>颗粒越大，越容易沉降。先用低转速，让最大的颗粒（如细胞核）沉到管底；收集上清液，提高转速，让较小的颗粒（如线粒体、叶绿体）沉降；再提高转速，分离更小的颗粒（如核糖体）。
<b>对比：</b>DNA 半保留复制实验中用的是“密度梯度离心”，按密度分离，不要混淆。`,
  exam:'“分离细胞器的方法”——差速离心法。'},
 {t:'双层膜细胞器：线粒体与叶绿体',lv:3,k:['线粒体','嵴','动力车间','叶绿体','类囊体','基粒','养料制造车间'],
  core:'<b>线粒体</b>是细胞进行<b>有氧呼吸的主要场所</b>，是细胞的“<b>动力车间</b>”，细胞生命活动所需能量约 <b>95%</b> 来自线粒体。<b>叶绿体</b>是绿色植物能进行光合作用的细胞含有的细胞器，是“<b>养料制造车间</b>”和“<b>能量转换站</b>”。',
  why:`<table class="tb"><tr><th></th><th>线粒体</th><th>叶绿体</th></tr>
<tr><td>膜</td><td>双层膜，<b>内膜向内折叠形成嵴</b>，大大增加内膜面积</td><td>双层膜，内部有许多<b>基粒</b>，每个基粒由<b>类囊体</b>堆叠而成</td></tr>
<tr><td>基质</td><td>含与有氧呼吸有关的酶</td><td>含与暗反应有关的酶</td></tr>
<tr><td>酶的分布</td><td>内膜上和基质中</td><td>类囊体膜上和基质中</td></tr>
<tr><td>色素</td><td>无</td><td>有，分布在<b>类囊体薄膜</b>上</td></tr>
<tr><td>核酸</td><td colspan="2">都含少量 DNA 和 RNA，都有核糖体（能合成部分自身蛋白质，“半自主”）</td></tr>
<tr><td>分布</td><td>动植物细胞（代谢旺盛处多，如心肌细胞多于腹肌细胞）</td><td>植物叶肉细胞、幼茎皮层细胞等；<b>根细胞没有</b></td></tr></table>
<b>结构与功能相适应：</b>嵴增大了内膜面积，为有氧呼吸第三阶段的酶提供了附着位点；类囊体堆叠成基粒，1 g 菠菜叶片中类囊体总面积约 60 m²，极大扩展了受光面积。
<b>线粒体起源的内共生假说：</b>线粒体内有与细菌相似的环状 DNA、能像细菌一样分裂增殖，支持“线粒体由被吞噬的需氧细菌演化而来”的观点。`,
  exam:'“成人心肌细胞中数量显著多于腹肌细胞的细胞器”——线粒体（心肌不停收缩，耗能多）。“含有 DNA 的细胞器”——线粒体、叶绿体（核糖体含 RNA 不含 DNA）。'},
 {t:'单层膜细胞器：内质网、高尔基体、溶酶体、液泡',lv:3,k:['粗面内质网','光面内质网','高尔基体','溶酶体','液泡','细胞液'],
  core:'<b>内质网</b>：蛋白质等大分子物质的<b>合成、加工场所和运输通道</b>。<b>高尔基体</b>：对来自内质网的蛋白质进行<b>加工、分类和包装</b>的“车间”及“发送站”。<b>溶酶体</b>：“<b>消化车间</b>”，内含多种<b>水解酶</b>。<b>液泡</b>：内有<b>细胞液</b>，调节植物细胞内的环境，使植物细胞保持坚挺。',
  why:`<b>内质网：</b>由膜围成的管状、泡状或扁平囊状结构连接成一个连续的、内腔相通的膜性管道系统。
<ul><li><b>粗面内质网</b>：附着有核糖体，主要参与<b>分泌蛋白</b>等的合成和加工。分泌功能强的细胞（如胰腺腺泡细胞、浆细胞）粗面内质网发达。</li>
<li><b>光面内质网</b>：不含核糖体，是<b>脂质合成</b>的场所（如性腺细胞合成性激素）。</li>
<li>内质网膜向内与<b>核膜外膜</b>相连，向外可与<b>细胞膜</b>相连，是细胞内膜面积最大的细胞器。</li></ul>
<b>高尔基体：</b>在分泌蛋白运输中起<b>交通枢纽</b>作用。在植物细胞中还与<b>细胞壁的形成</b>有关（有丝分裂末期形成细胞板）。动植物细胞都有，但功能不完全相同。
<b>溶酶体：</b>主要分布在动物细胞中。能分解<b>衰老、损伤的细胞器</b>，吞噬并杀死侵入细胞的<b>病毒或细菌</b>。
<ul><li>水解酶是在<b>核糖体</b>上合成、经内质网和高尔基体加工后由高尔基体“出芽”形成溶酶体。</li>
<li><b>溶酶体膜为什么不被自己的水解酶分解？</b>可能的解释：膜蛋白高度糖基化，水解酶难以作用；溶酶体内是酸性环境（pH 约 5），而膜外细胞质基质 pH 约 7.2，即使少量酶泄漏到细胞质基质中也会因 pH 不适宜而失活。</li>
<li>细胞自噬、胞吞形成的囊泡都要靠溶酶体降解。</li></ul>
<b>液泡：</b>主要存在于植物细胞中。细胞液含糖类、无机盐、<b>色素（如花青素）</b>和蛋白质等。充盈的液泡使细胞保持坚挺，与渗透吸水密切相关。花瓣、果实的颜色多来自液泡中的色素，而叶片的绿色来自叶绿体。`,
  exam:'“唾液腺细胞中参与合成并分泌唾液淀粉酶的细胞器”——核糖体、内质网、高尔基体、线粒体（注意不能选中心体、叶绿体）。'},
 {t:'无膜细胞器：核糖体与中心体',lv:3,k:['核糖体','生产蛋白质的机器','中心体','中心粒'],
  core:'<b>核糖体</b>：“<b>生产蛋白质的机器</b>”，有的附着在内质网上，有的游离在细胞质基质中。<b>中心体</b>：分布在<b>动物与低等植物</b>细胞中，由<b>两个互相垂直排列的中心粒</b>及周围物质组成，与细胞的<b>有丝分裂</b>有关。',
  why:`<b>核糖体：</b>由 RNA（rRNA）和蛋白质组成，不含 DNA。原核细胞和真核细胞都有，是<b>唯一</b>一种原核细胞也有的细胞器。
<b>游离核糖体 vs 附着核糖体：</b>一般来说，游离核糖体合成的蛋白质多供<b>细胞自身使用</b>（如呼吸酶、血红蛋白）；附着在内质网上的核糖体合成的蛋白质能够<b>分泌到细胞外</b>（如消化酶、抗体）或成为膜蛋白、溶酶体酶。其实分泌蛋白的合成也是先从游离核糖体开始，合成一段信号肽后再与核糖体一起转移到内质网上。
<b>中心体：</b>在有丝分裂间期倍增，前期移向细胞两极，发出星射线形成纺锤体。高等植物细胞<b>没有</b>中心体，由细胞两极直接发出纺锤丝。
<p class="warn">“有中心体的一定是动物细胞”是错的：低等植物（如衣藻）也有中心体。判断高等植物和动物，要看有无细胞壁、叶绿体、大液泡，以及有无中心体。</p>`,
  exam:'“中心体和核糖体与蛋白质的合成有关”（错，中心体与有丝分裂有关）。识图题中给出一张“植物细胞”却画了中心体，要能指出错误（高等植物无中心体）。'},
 {t:'细胞器的多角度归类',lv:3,k:['膜层数','含核酸','含色素','产生水','产生ATP'],
  core:'从<b>膜的层数、分布、成分、功能</b>等不同角度对细胞器归类，是做综合题的基本功。',
  why:`<table class="tb"><tr><th>归类角度</th><th>细胞器</th></tr>
<tr><td>双层膜</td><td>线粒体、叶绿体（细胞核也是双层膜，但不是细胞器）</td></tr>
<tr><td>单层膜</td><td>内质网、高尔基体、溶酶体、液泡</td></tr>
<tr><td>无膜</td><td>核糖体、中心体</td></tr>
<tr><td>含 DNA</td><td>线粒体、叶绿体</td></tr>
<tr><td>含 RNA</td><td>线粒体、叶绿体、核糖体</td></tr>
<tr><td>含色素</td><td>叶绿体（光合色素）、液泡（花青素等，不能用于光合作用）</td></tr>
<tr><td>能产生 ATP</td><td>线粒体、叶绿体（还有细胞质基质，但它不是细胞器）</td></tr>
<tr><td>能产生水</td><td>线粒体（有氧呼吸第三阶段）、核糖体（脱水缩合）、叶绿体（暗反应）、高尔基体（合成纤维素）</td></tr>
<tr><td>能发生碱基互补配对</td><td>线粒体、叶绿体、核糖体</td></tr>
<tr><td>与能量转换有关</td><td>线粒体、叶绿体</td></tr>
<tr><td>原核细胞也有</td><td>核糖体</td></tr>
<tr><td>高等植物特有</td><td>叶绿体、大液泡（还有细胞壁，不是细胞器）</td></tr>
<tr><td>动物和低等植物特有</td><td>中心体</td></tr></table>
<b>水稻叶肉细胞和人口腔上皮细胞都有的细胞器：</b>高尔基体、线粒体、内质网、核糖体、溶酶体。`,
  exam:'这类表格内容常出成“下列细胞器中，既有 X 又有 Y 的是”的组合选择题，记住表格就能秒答。'},
 {t:'细胞骨架',lv:1,k:['蛋白质纤维','网架结构'],
  core:'<b>细胞骨架</b>是由<b>蛋白质纤维</b>组成的网架结构，维持着细胞的形态，锚定并支撑着许多细胞器，与细胞运动、分裂、分化以及物质运输、能量转化、信息传递等生命活动密切相关。',
  why:'细胞器并不是漂浮在细胞质中的，而是被细胞骨架“挂”在一定位置上。囊泡沿着细胞骨架被运输到目的地，就像货车沿着轨道行驶。<b>注意成分是蛋白质</b>，不是纤维素或多糖。',
  exam:'“细胞骨架——多糖”（错，是蛋白质）。'},
 {t:'实验：用高倍显微镜观察叶绿体和细胞质的流动',lv:2,k:['藓类叶','黑藻','叶绿体','胞质环流'],
  core:'叶绿体散布于细胞质中，呈<b>绿色、扁平的椭球或球形</b>。观察细胞质的流动，可用细胞质基质中<b>叶绿体的运动作为标志</b>。',
  why:`<b>材料选择及原因：</b>
<ul><li><b>藓类的叶</b>：叶片只有<b>一层细胞</b>，不用切片，可直接制成装片观察。</li>
<li><b>菠菜叶稍带些叶肉的下表皮</b>：表皮细胞不含叶绿体，要带上叶肉细胞；靠近下表皮的叶肉细胞（海绵组织）排列疏松，叶绿体大而少，便于观察。</li>
<li><b>黑藻幼嫩的小叶</b>：叶片薄、叶绿体大，适合观察细胞质流动。黑藻事先要放在<b>光照、室温</b>条件下培养，使其代谢旺盛、流动明显。</li></ul>
<b>操作要点：</b>临时装片中的叶片要<b>随时保持有水状态</b>，否则细胞失水，叶绿体会变形甚至细胞死亡，细胞质也就不流动了。先低倍镜找到，再高倍镜观察。
<b>为什么不能用根尖细胞？</b>根细胞没有叶绿体。
<b>叶绿体的分布与功能相适应：</b>光照强时，叶绿体以较小的侧面朝向光源，避免被强光灼伤；光照弱时，以较大的面朝向光源，以便吸收更多光能。
<b>细胞质流动的意义：</b>为细胞内物质运输创造条件，从而保障细胞生命活动的正常进行。流动方向在视野中和实际中是一样的（倒像旋转 180°，环流方向不变）。`,
  exam:'材料选择题与“保持有水状态”的原因。'},
 {t:'分泌蛋白的合成和运输',lv:3,k:['³H标记亮氨酸','同位素标记法','囊泡','胞吐','线粒体供能'],
  core:'<span class="chain">游离核糖体上开始合成肽链 → 与核糖体一起转移到<b>粗面内质网</b>上继续合成，进入内质网腔加工、折叠 → 内质网“出芽”形成<b>囊泡</b> → 与<b>高尔基体</b>膜融合，进一步修饰加工 → 高尔基体形成<b>囊泡</b> → 与<b>细胞膜</b>融合，<b>胞吐</b>到细胞外</span>整个过程需要的能量主要来自<b>线粒体</b>。',
  why:`<b>分泌蛋白</b>：在细胞内合成后，分泌到细胞外起作用的蛋白质，如<b>消化酶、抗体、一部分激素</b>（胰岛素等）。呼吸酶、血红蛋白、载体蛋白不是分泌蛋白。
<b>经典实验（帕拉德等）：</b>把豚鼠的<b>胰腺腺泡细胞</b>放入含 <b>³H 标记的亮氨酸</b>的培养液中培养，追踪放射性：
<table class="tb"><tr><th>时间</th><th>放射性出现在</th></tr><tr><td>3 min</td><td>附着有核糖体的内质网</td></tr><tr><td>17 min</td><td>高尔基体</td></tr><tr><td>117 min</td><td>靠近细胞膜内侧的囊泡，以及释放到细胞外的分泌物中</td></tr></table>
<b>为什么选亮氨酸？</b>它是合成蛋白质的原料，被标记后会进入新合成的蛋白质，从而“示踪”蛋白质的去向。
<b>为什么选胰腺腺泡细胞？</b>它大量分泌消化酶，分泌蛋白合成旺盛，现象明显。
<b>同位素标记法：</b>同一元素中质子数相同、中子数不同的原子互为同位素。用物理性质特殊的同位素标记化学反应中原子的去向。放射性同位素：¹⁴C、³²P、³H、³⁵S；稳定同位素：¹⁵N、¹⁸O。
<b>膜面积变化：</b>内质网<b>减少</b>（出芽形成囊泡），高尔基体<b>基本不变</b>（先接收后发出），细胞膜<b>增大</b>（囊泡融入）。这一过程说明生物膜可以相互转化，体现了膜的流动性。
<b>穿过几层膜？</b>分泌蛋白从核糖体到细胞外，全程在囊泡中运输，通过膜融合完成，<b>穿过的膜层数为 0</b>。`,
  exam:'超高频！流程填空、放射性出现先后顺序、膜面积变化柱状图、“参与的细胞器”和“参与的具膜细胞器”（后者不含核糖体）、“参与的细胞结构”（还要加上细胞膜）。'},
 {t:'生物膜系统',lv:3,k:['细胞膜','核膜','细胞器膜','区室化'],
  core:'细胞器膜和细胞膜、核膜等结构，共同构成细胞的<b>生物膜系统</b>。这些生物膜的组成成分和结构很相似，在结构和功能上紧密联系。',
  why:`<b>生物膜系统的三大作用：</b>
<ol><li><b>细胞膜</b>不仅使细胞具有一个相对稳定的内部环境，同时在细胞与外部环境进行<b>物质运输、能量转化和信息传递</b>的过程中起着决定性作用。</li>
<li>许多重要的化学反应需要酶的参与，<b>广阔的膜面积为多种酶提供了附着位点</b>。</li>
<li>细胞内的生物膜把各种细胞器<b>分隔开</b>，如同一个个小的区室，使细胞内能够<b>同时进行多种化学反应，而不会互相干扰</b>，保证了细胞生命活动高效、有序地进行。</li></ol>
<b>组成要点：</b>
<ul><li>生物膜系统是<b>细胞内</b>膜结构的统称，<b>口腔黏膜、小肠黏膜、视网膜</b>等不属于生物膜（它们是组织）。</li>
<li>核糖体、中心体无膜，不属于生物膜系统。</li>
<li><b>原核细胞</b>只有细胞膜，<b>没有生物膜系统</b>。</li>
<li>各种生物膜成分和结构“相似”而不是“完全相同”，例如线粒体内膜蛋白质含量特别高。</li></ul>
<b>联系：</b>内质网膜内连核膜、外连细胞膜（直接联系）；内质网、高尔基体、细胞膜之间通过囊泡相互转化（间接联系）。
<b>应用：</b>血液透析膜（人工肾）模拟生物膜的选择透过性，把病人血液中的代谢废物透析掉；也可模拟细胞膜的功能对海水进行淡化。`,
  exam:'“生物膜系统由具膜结构的细胞器构成”（错，还有细胞膜和核膜）；“各种生物膜的化学组成与结构均相同”（错，是相似）。'},
 {t:'动物细胞与植物细胞的比较',lv:2,k:['细胞壁','叶绿体','液泡','中心体'],
  core:'高等植物细胞特有：<b>细胞壁、叶绿体、液泡</b>；动物细胞特有：<b>中心体</b>（低等植物也有）。',
  why:`<b>植物细胞壁：</b>位于细胞膜外，主要由<b>纤维素和果胶</b>构成，对细胞起<b>支持与保护</b>作用。它是<b>全透性</b>的，不是系统的边界（边界是细胞膜）。去除植物细胞壁而不损伤内部结构，可用<b>纤维素酶和果胶酶</b>。
<b>不是所有植物细胞都有叶绿体和大液泡：</b>根尖细胞无叶绿体，根尖分生区细胞没有大液泡。
<b>识图技巧：</b>看到细胞壁 + 叶绿体 + 大液泡 + 无中心体 → 高等植物；有细胞壁 + 中心体 → 低等植物；无细胞壁 + 中心体 → 动物。`,
  exam:'教材习题“找出图中的错误”：给一张画了中心体的高等植物细胞图，或者把核糖体画到了高尔基体上。'}],
 traps:['“所有植物细胞都有叶绿体”错：根细胞没有。','“生物膜系统包括口腔黏膜”错。','“核糖体是单层膜细胞器”错：无膜。','“分泌蛋白合成过程中穿过了 7 层膜”错：通过囊泡运输，0 层。','“游离核糖体合成分泌蛋白”错：分泌蛋白主要由附着在内质网上的核糖体合成。','“溶酶体的水解酶在溶酶体内合成”错：在核糖体上合成。']},

{id:'3-3',t:'细胞核的结构和功能',
 goal:'能通过分析四个经典实验，推导出细胞核的功能；能说出细胞核各部分的结构和功能，并解释为什么细胞核能成为“控制中心”；了解模型的种类。',
 focus:[[3,'细胞核的功能：遗传信息库，代谢和遗传的控制中心'],[3,'细胞核的结构：核膜、核孔、核仁、染色质'],[2,'四个经典实验及结论'],[2,'染色质与染色体的关系'],[2,'物理模型、概念模型、数学模型']],
 models:['nucleus','acetab'],
 pts:[
 {t:'细胞核功能的实验证据',lv:2,k:['美西螈','蝾螈','变形虫','伞藻','克隆牛'],
  core:'大量事实表明，<b>细胞核控制着细胞的代谢和遗传</b>。',
  why:`<table class="tb"><tr><th>实验</th><th>做法</th><th>结果</th><th>结论</th></tr>
<tr><td>美西螈核移植</td><td>黑色美西螈胚胎细胞的核 → 白色美西螈去核卵细胞</td><td>发育成的全部是<b>黑色</b></td><td>美西螈体色（黑色素的合成）由<b>细胞核</b>控制</td></tr>
<tr><td>蝾螈受精卵横缢</td><td>用头发把受精卵横缢成有核和无核两半，中间只有很少细胞质相连</td><td>有核的一半能分裂；无核的一半停止分裂。有核一半分裂到 16～32 个细胞时挤一个核到无核一半，它也开始分裂，最后都发育成正常胚胎（原无核的一半发育得慢一些）</td><td>细胞的<b>分裂、分化</b>离不开细胞核</td></tr>
<tr><td>变形虫切割</td><td>切成有核、无核两半</td><td>无核的一半能消化已吞噬的食物，但不能摄食、对刺激无反应，高尔基体、内质网退化；有核的一半照样摄食、有反应、能生长分裂。把有核一半的核钩出，它就像无核一半；及时植入同种变形虫的核，生命活动又恢复</td><td>细胞核控制着细胞的<b>代谢</b>（生命活动）</td></tr>
<tr><td>伞藻嫁接与核移植</td><td>伞藻由“帽”、柄、假根三部分构成，细胞核在假根中。把菊花形帽伞藻的柄嫁接到伞形帽伞藻的假根上，或移植细胞核</td><td>长出的帽与<b>假根（细胞核）</b>一方相同</td><td>伞藻的形态结构主要取决于<b>细胞核</b></td></tr></table>
<b>实验设计的思维：</b>这些实验都运用了“<b>减法原理</b>”（去核）和“<b>加法原理</b>”（再植入核）进行对照。变形虫实验中，“去核后再植核恢复生命活动”是最有说服力的一组，因为它排除了“切割损伤”的影响。
<b>伞藻嫁接实验为什么还要做核移植？</b>嫁接实验中假根里除了细胞核还有少量细胞质，不能完全排除细胞质的影响；核移植实验只移入细胞核，结论更可靠。
<b>克隆牛：</b>从母牛乙体细胞取核，注入母牛甲去核卵细胞，胚胎移植到母牛丙子宫内，生出的小牛几乎与母牛乙一样。说明遗传性状主要由细胞核决定。但不是 100% 一样，因为卵细胞的细胞质（线粒体 DNA）来自母牛甲，环境也有影响。`,
  exam:'实验分析题：给出实验，问能得出什么结论。注意结论的表述要准确：“细胞核控制细胞的代谢和遗传”，不能说“细胞核是代谢的中心”。也会让你补充对照组。'},
 {t:'细胞核的结构',lv:3,k:['核膜','核孔','核仁','染色质','碱性染料'],
  core:'<b>核膜</b>：<b>双层膜</b>，把核内物质与细胞质分开。<b>核孔</b>：实现<b>核质之间频繁的物质交换和信息交流</b>。<b>核仁</b>：与<b>某种 RNA 的合成以及核糖体的形成</b>有关。<b>染色质</b>：主要由 <b>DNA 和蛋白质</b>组成，DNA 是遗传信息的载体。',
  why:`<b>核膜：</b>双层膜，外膜上常附有核糖体，并与内质网膜相连。核膜使核内的 DNA 复制、转录与细胞质中的翻译在空间上分开，互不干扰。
<b>核孔：</b>是大分子物质进出细胞核的通道，具有<b>选择性</b>。
<ul><li><b>出核</b>：mRNA、tRNA、rRNA 等（细胞核中合成的 RNA 要到细胞质中工作）；</li>
<li><b>入核</b>：DNA 聚合酶、RNA 聚合酶、组成染色体的蛋白质等（在细胞质的核糖体上合成，到核内工作）；</li>
<li><b>DNA 不能出核</b>。</li>
<li>代谢旺盛的细胞（如胰岛 B 细胞）核孔数目多，核仁大。</li>
<li>“控制细胞器进行物质合成、能量转化等的指令，主要通过核孔从细胞核送到细胞质”——对，这些指令就是 mRNA。</li></ul>
<b>核仁：</b>与 rRNA 合成和核糖体形成有关。有丝分裂前期消失，末期重新出现。<b>原核细胞没有核仁</b>，但有核糖体，所以“核糖体的形成一定与核仁有关”只适用于真核细胞。
<b>染色质：</b>极细的丝状物，因<b>容易被碱性染料（甲紫溶液、醋酸洋红液）染成深色</b>而得名。是细胞核内<b>行使遗传功能</b>的结构。`,
  exam:'“细胞核内行使遗传功能的结构”——染色质。“核孔可以让 DNA 自由进出”（错）。'},
 {t:'染色质与染色体',lv:3,k:['染色质','染色体','螺旋化','解螺旋'],
  core:'染色质和染色体是<b>同一物质在细胞不同时期的两种存在状态</b>。',
  why:`<span class="chain">分裂间期：细长的染色质丝 →（分裂期，高度螺旋化，缩短变粗）→ 圆柱状或杆状的染色体 →（分裂即将结束，解螺旋）→ 染色质</span>
<b>为什么要“变来变去”？</b>
<ul><li>分裂间期呈<b>染色质</b>状态：DNA 舒展开，便于 DNA 复制和转录（遗传信息的表达）。</li>
<li>分裂期呈<b>染色体</b>状态：高度螺旋化、缩短变粗，便于在纺锤丝牵引下移动并<b>平均分配</b>到两个子细胞中，不容易缠绕、断裂。</li></ul>
这两种状态的转换是结构与功能相适应的典型例子。
<b>成分：</b>主要是 DNA 和蛋白质（还有少量 RNA）。“染色体——DNA”这种对应关系也是对的（主要成分之一）。`,
  exam:'“组成染色体的主要物质”——蛋白质和 DNA。“染色质与染色体是两种不同的物质”（错）。'},
 {t:'细胞核为什么是“控制中心”',lv:3,k:['遗传信息库','代谢和遗传的控制中心','蓝图'],
  core:'细胞核是<b>遗传信息库</b>，是细胞<b>代谢和遗传的控制中心</b>。',
  why:`<b>逻辑链：</b>DNA 储存着遗传信息 → 遗传信息就像细胞生命活动的“<b>蓝图</b>” → 细胞依据蓝图进行物质合成、能量转化和信息交流，完成生长、发育、衰老和凋亡 → 蓝图储藏在细胞核里 → 所以细胞核控制细胞代谢。
同时，细胞分裂时 DNA 携带的遗传信息从亲代细胞传给子代细胞，保证了亲子代在遗传上的稳定性 → 所以细胞核控制遗传。
<b>容易混淆的表述：</b>
<ul><li>✅ 细胞核是代谢的<b>控制中心</b>；❌ 细胞核是代谢的<b>中心</b>（代谢的主要场所是细胞质基质）。</li>
<li>❌ 细胞核位于细胞正中央（不一定，如成熟植物细胞的核被大液泡挤到一边），这也不能作为“控制中心”的论据。</li></ul>
<b>细胞作为系统的三要素：</b>有边界（细胞膜）、有分工合作的组分（细胞器）、有控制中心（细胞核）。
<b>同一生物体内所有细胞的“蓝图”都一样吗？</b>一样（来自同一个受精卵），但细胞形态、功能不同，是因为不同细胞“读取”蓝图的部分不同——基因选择性表达（第 6 章）。`,
  exam:'“不能作为细胞核是控制中心论据的是”——细胞核位于细胞的正中央。'},
 {t:'建构模型',lv:2,k:['物理模型','概念模型','数学模型'],
  core:'模型是人们为了某种特定目的而对认识对象所作的一种<b>简化的概括性描述</b>。形式包括<b>物理模型、概念模型、数学模型</b>等。',
  why:`<table class="tb"><tr><th>类型</th><th>特点</th><th>例子</th></tr>
<tr><td>物理模型</td><td>以<b>实物或图画</b>形式直观表达认识对象的特征</td><td>DNA 双螺旋结构模型、真核细胞三维结构模型、细胞膜流动镶嵌模型示意图</td></tr>
<tr><td>概念模型</td><td>用文字、箭头、符号表示概念之间的关系</td><td>概念图、分泌蛋白运输流程图、光合作用过程图解</td></tr>
<tr><td>数学模型</td><td>用公式、曲线、表格表达</td><td>种群增长曲线、酶活性曲线、肽键数计算公式</td></tr></table>
<b>制作细胞模型时，科学性第一</b>，其次才是美观。真实细胞颜色并不鲜艳，模型中可以用不同颜色区分不同结构。
<p class="warn">照片、显微镜下拍摄的图片是对实物的直接记录，<b>不是模型</b>。本网站中的交互模型属于物理模型。</p>`,
  exam:'判断某种表达属于哪类模型；“电镜照片属于物理模型”（错）。'}],
 traps:['“细胞核是细胞代谢的中心”错：是控制中心。','“所有真核细胞都有细胞核”错：哺乳动物成熟红细胞、高等植物成熟筛管细胞没有。','“核膜是单层膜”错：双层。','“核仁是遗传物质的储存场所”错：遗传物质主要在染色质上。','“伞藻嫁接实验能完全排除细胞质的影响”错：还需要核移植实验。']}
]},

{id:'4',t:'细胞的物质输入和输出',secs:[
{id:'4-1',t:'被动运输',
 goal:'理解渗透作用的原理和条件；能用渗透原理解释动物细胞和植物细胞的吸水失水；完整掌握质壁分离及复原实验；能比较自由扩散和协助扩散，区分载体蛋白和通道蛋白。',
 focus:[[3,'质壁分离与复原实验（原理、材料、现象、拓展应用）'],[3,'原生质层的组成；渗透作用的条件'],[3,'自由扩散与协助扩散的比较及实例'],[2,'载体蛋白与通道蛋白的区别'],[2,'渗透装置液面变化分析'],[2,'KNO₃、尿素、甘油溶液中的自动复原']],
 models:['osmosis','transport'],
 pts:[
 {t:'渗透作用',lv:3,k:['半透膜','浓度差','渗透装置'],
  core:'水分子（或其他溶剂分子）<b>通过半透膜的扩散</b>，称为<b>渗透作用</b>。发生渗透作用的条件：① 具有<b>半透膜</b>；② 半透膜两侧的溶液存在<b>浓度差</b>。渗透方向：水分子从<b>水的相对含量高</b>的一侧（低浓度溶液）向<b>水的相对含量低</b>的一侧（高浓度溶液）渗透。',
  why:`<b>经典渗透装置：</b>长颈漏斗口外密封一层玻璃纸（半透膜，水能透过，蔗糖不能），漏斗内装蔗糖溶液，浸入清水中，一段时间后漏斗管内液面上升。
<b>为什么液面会上升？</b>单位时间内由清水进入漏斗的水分子数，多于由漏斗进入清水的水分子数。注意：水分子是<b>双向</b>移动的，只是净流向是进入漏斗。
<b>液面会无限升高吗？</b>不会。液面升高后，漏斗内液柱产生的<b>静水压</b>越来越大，会把水往外压。当液柱压力与浓度差造成的“吸水力”相等时，进出漏斗的水分子数相等，液面停止上升。此时<b>漏斗内溶液浓度仍然高于烧杯中</b>（浓度差没有消失，只是被压力抵消了）。
<b>变式：</b>
<ul><li>用纱布代替玻璃纸：纱布孔隙大，蔗糖分子也能通过，不是半透膜，液面不会上升。</li>
<li>烧杯中也是同样浓度的蔗糖溶液：没有浓度差，液面不变。</li>
<li>如果半透膜允许葡萄糖通过，漏斗内装葡萄糖溶液：液面先升后降，最终两侧相平。</li>
<li><b>“浓度”指的是物质的量浓度</b>（单位体积内溶质分子数），而不是质量浓度。质量分数相同的葡萄糖溶液和蔗糖溶液，葡萄糖溶液的物质的量浓度更大，水会向葡萄糖溶液一侧渗透。</li></ul>`,
  exam:'渗透装置题型几乎必考：判断液面变化、最终浓度关系、更换半透膜或溶液后的变化。'},
 {t:'动物细胞的吸水和失水',lv:2,k:['红细胞','细胞膜','生理盐水'],
  core:'动物细胞的<b>细胞膜</b>相当于一层半透膜。外界溶液浓度<b>低于</b>细胞质浓度时，细胞<b>吸水膨胀</b>；<b>高于</b>时，细胞<b>失水皱缩</b>；<b>相同</b>时，细胞形态不变。',
  why:`以哺乳动物红细胞放入不同浓度 NaCl 溶液为例：
<ul><li>红细胞内的<b>血红蛋白</b>等有机物不能透过细胞膜，相当于渗透装置中的<b>蔗糖分子</b>；细胞膜相当于<b>半透膜</b>。</li>
<li>在低浓度溶液中，红细胞不一定会涨破：吸水是否涨破取决于浓度差有多大，浓度差小时只膨胀；放入清水中才会涨破。</li>
<li>临床输液用<b>生理盐水</b>（0.9% NaCl），因为它的浓度与人体细胞所处液体环境相当，红细胞能维持正常形态。</li></ul>
<b>淡水原生动物的伸缩泡：</b>草履虫生活在淡水中，细胞内浓度高于外界，水不断渗入，要靠伸缩泡把多余的水排出，防止涨破。放入蒸馏水中，伸缩泡收缩频率<b>加快</b>；放入海水中，伸缩泡收缩<b>减慢甚至停止</b>（细胞失水）。`,
  exam:'“红细胞吸水或失水取决于什么”——细胞内外溶液的浓度差。'},
 {t:'植物细胞的吸水和失水：原生质层',lv:3,k:['原生质层','细胞液','细胞壁全透性'],
  core:'成熟植物细胞中，<b>细胞膜和液泡膜以及两层膜之间的细胞质</b>称为<b>原生质层</b>，相当于一层半透膜。<b>细胞壁是全透性的</b>，伸缩性比原生质层小。植物细胞内的液体环境主要指<b>液泡中的细胞液</b>。',
  why:`<b>为什么说“主要指细胞液”？</b>成熟植物细胞的中央液泡占据了细胞的大部分空间，把细胞质挤成一薄层，所以“水进出细胞”主要是水经过原生质层进出液泡。
<b>原生质层 vs 原生质体：</b>
<ul><li>原生质层 = 细胞膜 + 液泡膜 + 两膜之间的细胞质（<b>不含细胞核和细胞液</b>）；只有成熟的有大液泡的植物细胞才有。</li>
<li>原生质体 = 去掉细胞壁后剩下的部分（包括细胞核和液泡）。</li></ul>
<b>生活中的实例：</b>萎蔫的菜叶泡在清水中会变硬挺（吸水）；白菜剁碎做馅加盐后渗出水分（失水）；施肥过多造成“烧苗”（土壤溶液浓度过高，根细胞失水）；腌制果脯时，细胞因失水过多<b>死亡</b>，原生质层失去选择透过性，糖分才大量进入使果脯变甜（不是主动运输）。`,
  exam:'“细胞膜和液泡膜都相当于半透膜”（对，但要注意植物细胞起半透膜作用的是整个原生质层）。“果脯变甜是细胞主动运输吸收糖分的结果”（错）。'},
 {t:'实验：探究植物细胞的吸水和失水',lv:3,k:['紫色洋葱鳞片叶外表皮','0.3 g/mL蔗糖溶液','引流法','自身前后对照'],
  core:'在 <b>0.3 g/mL 蔗糖溶液</b>中，紫色洋葱鳞片叶外表皮细胞的中央液泡<b>逐渐变小、颜色变深</b>，原生质层与细胞壁逐渐分离（<b>质壁分离</b>）；再滴加<b>清水</b>，液泡逐渐变大、颜色变浅，原生质层恢复原位（<b>质壁分离复原</b>）。',
  why:`<b>原理：</b>原生质层相当于半透膜，细胞液与外界溶液存在浓度差；原生质层比细胞壁的伸缩性大。当外界溶液浓度 ＞ 细胞液浓度时，细胞失水，原生质层收缩得比细胞壁多，两者分离。
<b>步骤与每一步的目的：</b>
<ol><li>撕取紫色洋葱鳞片叶<b>外表皮</b>，制成临时装片；</li>
<li>低倍镜观察：记录中央液泡大小、原生质层位置（<b>作为对照</b>）；</li>
<li>一侧滴加蔗糖溶液，另一侧用吸水纸吸引，重复几次（<b>引流法</b>，使表皮浸润在蔗糖溶液中，不用拿下盖玻片）；</li>
<li>低倍镜观察质壁分离；</li>
<li>一侧滴加清水，另一侧吸引，重复几次；</li>
<li>低倍镜观察复原。</li></ol>
本实验在<b>同一装片上前后对照</b>（自身对照），不需要另设对照组。全程只用<b>低倍镜</b>就能看清。
<b>为什么选紫色洋葱外表皮？</b>① 有紫色的<b>中央大液泡</b>，便于观察液泡大小变化；② 是成熟的植物细胞；③ 表皮只有一层细胞，容易撕取。内表皮无色，也能发生质壁分离，但不易观察（可在蔗糖溶液中加红墨水，此时细胞壁与原生质层之间是红色，因为细胞壁全透）。
<b>细胞壁与原生质层之间充满的是什么？</b>外界溶液（蔗糖溶液），因为细胞壁是全透性的。
<b>拓展与变式：</b>
<table class="tb"><tr><th>情况</th><th>现象</th><th>原因</th></tr>
<tr><td>0.5 g/mL 蔗糖溶液</td><td>质壁分离明显，但滴清水后<b>不能复原</b></td><td>失水过多，细胞死亡</td></tr>
<tr><td>适宜浓度 KNO₃、尿素、甘油、乙二醇溶液</td><td>先质壁分离，随后<b>自动复原</b></td><td>K⁺、NO₃⁻（主动运输）、尿素、甘油、乙二醇（自由扩散）进入细胞，细胞液浓度升高，细胞吸水</td></tr>
<tr><td>盐酸、酒精、醋酸溶液</td><td>不发生质壁分离</td><td>细胞被杀死，原生质层失去选择透过性</td></tr>
<tr><td>根尖分生区细胞、动物细胞</td><td>不发生</td><td>无大液泡 / 无细胞壁</td></tr></table>
<b>质壁分离实验的应用：</b>① 判断成熟植物细胞的死活；② 测定细胞液浓度范围（用一系列浓度梯度的蔗糖溶液处理，细胞液浓度介于“刚好不发生质壁分离”和“刚好发生质壁分离”的两个浓度之间）；③ 比较不同植物细胞液浓度；④ 证明原生质层比细胞壁伸缩性大。<b>不能</b>证明水分子是通过通道蛋白进入细胞的。`,
  exam:'超高频实验。常考材料选择原因、引流法、“2 mol/L 乙二醇 vs 蔗糖”原生质体体积变化曲线（乙二醇组先下降后回升；蔗糖组下降后保持）、测细胞液浓度的实验思路。'},
 {t:'被动运输：自由扩散',lv:3,k:['自由扩散','简单扩散','O₂','CO₂','甘油','乙醇'],
  core:'物质以扩散方式进出细胞，<b>不需要消耗细胞内化学反应所释放的能量</b>，这种方式称为<b>被动运输</b>，分为自由扩散和协助扩散。物质通过<b>简单的扩散作用</b>进出细胞的方式叫<b>自由扩散</b>（简单扩散）。',
  why:`<b>哪些物质能自由扩散？</b>
<ul><li><b>气体小分子</b>：O₂、CO₂、N₂。例如肺泡内 O₂ 浓度大于肺泡细胞内，O₂ 便扩散进入；细胞呼吸使 CO₂ 浓度升高，CO₂ 便扩散出去。</li>
<li><b>脂溶性小分子</b>：甘油、乙醇、苯、脂肪酸、性激素等。</li>
<li>部分水分子。</li></ul>
<b>为什么甘油、乙醇能自由扩散？</b>它们是脂溶性的小分子，能溶解在磷脂双分子层的疏水区中穿过去。这正是欧文顿“溶于脂质的物质容易穿过细胞膜”的原因。
<b>速率影响因素：</b>只取决于膜两侧的<b>浓度差</b>（和温度等）。浓度差越大，速率越快，二者成正比，曲线是一条过原点的直线。`,
  exam:'“相对分子质量小的物质或离子都可以通过自由扩散进入细胞”（错，离子带电荷，不能自由穿过磷脂双分子层）。'},
 {t:'被动运输：协助扩散；载体蛋白与通道蛋白',lv:3,k:['转运蛋白','载体蛋白','通道蛋白','水通道蛋白','构象改变'],
  core:'借助膜上的<b>转运蛋白</b>进出细胞的物质扩散方式，叫作<b>协助扩散</b>（易化扩散）。转运蛋白分为<b>载体蛋白</b>和<b>通道蛋白</b>两种类型。',
  why:`<b>载体蛋白 vs 通道蛋白：</b>
<table class="tb"><tr><th></th><th>载体蛋白</th><th>通道蛋白</th></tr>
<tr><td>选择方式</td><td>只容许与自身<b>结合部位相适应</b>的分子或离子通过</td><td>只容许与自身通道的<b>直径和形状相适配、大小和电荷相适宜</b>的分子或离子通过</td></tr>
<tr><td>是否结合</td><td><b>需要</b>与被转运物质结合</td><td><b>不需要</b>结合</td></tr>
<tr><td>构象</td><td>每次转运时都会发生<b>自身构象的改变</b></td><td>不需要改变构象（开放或关闭）</td></tr>
<tr><td>参与方式</td><td>协助扩散、<b>主动运输</b></td><td>只参与协助扩散</td></tr>
<tr><td>速度</td><td>较慢</td><td>很快</td></tr></table>
<b>协助扩散实例：</b>葡萄糖进入<b>红细胞</b>（载体蛋白）；水分子借助<b>水通道蛋白</b>进出细胞；K⁺ 通过<b>钾离子通道</b>流出神经细胞；Na⁺ 通过钠离子通道内流。
<b>水到底怎么进出细胞？</b>过去认为水都是自由扩散；后来发现水分子<b>更多的是借助水通道蛋白以协助扩散</b>方式进出细胞的。所以说“水分子进入细胞是通过自由扩散方式进行的”不全面。
<b>速率影响因素：</b>浓度差 + <b>转运蛋白的数量</b>。浓度差增大到一定程度后，转运蛋白都在工作，速率达到饱和，曲线变平。
<b>科学史：</b>1988 年阿格雷分离出水通道蛋白；1998 年麦金农解析了钾离子通道的立体结构，两人同获 2003 年诺贝尔化学奖。人类细胞中已发现 13 种水通道蛋白，肾小管重吸收水就依赖水通道蛋白。很多药物（如钙通道阻滞剂类降压药）就是针对通道蛋白研发的。`,
  exam:'“载体蛋白和通道蛋白在转运分子和离子时，其作用机制是一样的”（错）。曲线题：根据速率随浓度变化的曲线判断运输方式。'}],
 traps:['“渗透平衡时漏斗内外浓度相等”错：漏斗内仍更高。','“质壁分离中的‘质’是细胞质”错：是原生质层。','“细胞壁是选择透过性的”错：是全透性。','“质壁分离实验需要用高倍镜”错：低倍镜即可。','“水分子只能通过自由扩散进出细胞”错：更多通过水通道蛋白。','“被动运输都不需要转运蛋白”错：协助扩散需要。']},

{id:'4-2',t:'主动运输与胞吞、胞吐',
 goal:'掌握主动运输的特点、实例、影响因素和意义；理解载体蛋白在 ATP 驱动下改变构象的过程；掌握胞吞、胞吐的过程和特点；能综合比较各种物质运输方式，并根据曲线、图示判断运输方式。',
 focus:[[3,'主动运输的特点、实例及意义'],[3,'各种运输方式的综合比较与判断'],[3,'影响运输速率的因素及曲线'],[2,'胞吞、胞吐的过程与特点'],[2,'选择透过性的结构基础']],
 models:['transport','endo'],
 pts:[
 {t:'主动运输',lv:3,k:['逆浓度梯度','载体蛋白','能量','构象改变'],
  core:'物质<b>逆浓度梯度</b>进行跨膜运输，需要<b>载体蛋白</b>的协助，同时还需要<b>消耗细胞内化学反应所释放的能量</b>，这种方式叫作<b>主动运输</b>。',
  why:`<b>过程：</b>
<ol><li>离子或分子先与膜上载体蛋白的<b>特定部位结合</b>；</li>
<li>在细胞内化学反应释放的能量（主要来自 ATP 水解）推动下，载体蛋白的<b>空间结构发生变化</b>，把物质转运到膜的另一侧并释放出来；</li>
<li>载体蛋白随后恢复原状，又可以去转运同种物质的其他离子或分子。</li></ol>
<b>为什么一种载体蛋白只运一种或一类物质？</b>不同离子或分子大小和性质不同，不同蛋白质的空间结构差别也很大，结合部位只能与特定物质相适应。这就是载体的<b>专一性</b>。
<b>实例（注意数据）：</b>
<ul><li>甲状腺滤泡上皮细胞内碘浓度比血液中高 <b>20～25 倍</b>，仍能吸收碘；</li>
<li>人红细胞中 K⁺ 浓度比血浆高 <b>30 倍</b>；</li>
<li>轮藻细胞中 K⁺ 浓度比周围水环境高 <b>63 倍</b>；</li>
<li>小肠上皮细胞吸收葡萄糖、氨基酸、无机盐离子；</li>
<li>植物根细胞吸收矿质元素离子。</li></ul>
<b>意义：</b>主动运输普遍存在于动植物和微生物细胞中，通过主动运输来<b>选择吸收所需要的物质，排出代谢废物和对细胞有害的物质</b>，从而保证细胞和个体生命活动的需要。
<b>与疾病的联系：</b>囊性纤维化的一个主要原因是支气管上皮细胞表面转运氯离子的载体蛋白功能异常，导致黏液增多、细菌感染。`,
  exam:'根据细胞内外离子浓度柱状图判断：细胞内浓度高而仍在吸收的离子（如 K⁺、Mg²⁺）是主动运输进入；细胞外浓度高而仍在排出的（如 Na⁺、Cl⁻）是主动运输排出。'},
 {t:'影响物质运输速率的因素与曲线',lv:3,k:['浓度差','载体数量','O₂浓度','温度','呼吸抑制剂'],
  core:'<b>自由扩散</b>：只受浓度差影响。<b>协助扩散</b>：受浓度差和转运蛋白数量影响。<b>主动运输</b>：受<b>载体蛋白数量</b>和<b>能量供应</b>影响，凡是影响细胞呼吸的因素（O₂ 浓度、温度、呼吸抑制剂）都会影响主动运输。',
  why:`<b>三种典型曲线：</b>
<table class="tb"><tr><th>横坐标</th><th>自由扩散</th><th>协助扩散</th><th>主动运输</th></tr>
<tr><td>物质浓度（浓度差）</td><td>过原点的直线</td><td>先升后平（转运蛋白饱和）</td><td>先升后平（载体饱和或能量限制）</td></tr>
<tr><td>O₂ 浓度</td><td>水平线（与 O₂ 无关）</td><td>水平线</td><td><b>不从原点出发</b>（O₂ 为 0 时无氧呼吸仍可提供少量能量），先升后平（载体数量限制）</td></tr></table>
<b>温度为什么影响所有运输方式？</b>温度影响分子运动速率和膜的流动性；对于主动运输，还影响与细胞呼吸有关的酶的活性。
<b>判断技巧：</b>
<ul><li>加呼吸抑制剂（或降低 O₂）后速率下降 → 需要能量 → 主动运输或胞吞胞吐；</li>
<li>加蛋白质变性剂、蛋白酶后速率下降 → 需要转运蛋白；</li>
<li>动物一氧化碳中毒 → 血红蛋白运氧能力下降 → 有氧呼吸减弱 → 离子泵等主动运输速率降低。</li></ul>`,
  exam:'曲线判断题和实验设计题。例如“设计实验证明柽柳根吸收无机盐是主动运输还是被动运输”：设置两组，一组正常呼吸，一组加呼吸抑制剂（或隔绝氧气），比较对无机盐的吸收速率。'},
 {t:'胞吞与胞吐',lv:2,k:['胞吞','胞吐','囊泡','膜的流动性'],
  core:'<b>胞吞</b>：大分子先与膜上的蛋白质结合，引起这部分细胞膜<b>内陷形成小囊</b>，包围着大分子，然后小囊从细胞膜上分离下来，形成<b>囊泡</b>，进入细胞内部。<b>胞吐</b>：需要外排的大分子先在细胞内形成囊泡，囊泡移动到细胞膜处，<b>与细胞膜融合</b>，将大分子排出细胞。胞吞、胞吐也需要<b>消耗细胞呼吸所释放的能量</b>。',
  why:`<b>为什么大分子要胞吞胞吐？</b>转运蛋白能帮助离子和小分子通过细胞膜，但对蛋白质、多糖这样的生物大分子<b>无能为力</b>。
<b>特点：</b>
<ul><li>运输大分子或颗粒物（但有些小分子如神经递质也通过胞吐释放）；</li>
<li><b>需要能量</b>；</li>
<li><b>不需要转运蛋白</b>，但需要膜上<b>蛋白质参与识别</b>（大分子先与膜蛋白结合）；</li>
<li>依赖细胞膜的<b>流动性</b>；</li>
<li>物质不穿过细胞膜，<b>穿过 0 层膜</b>。</li></ul>
<b>实例：</b>变形虫摄取单细胞生物等食物（胞吞），排出食物残渣（胞吐）；白细胞吞噬病菌；乳腺细胞分泌乳蛋白、内分泌腺分泌蛋白质类激素、消化腺分泌消化酶（胞吐）；胃蛋白酶原运出细胞（胞吐）。
胞吞形成的囊泡在细胞内可以被<b>溶酶体</b>降解。
<b>痢疾内变形虫：</b>通过胞吐分泌蛋白分解酶溶解人的肠壁组织，再通过胞吞“吃掉”肠壁细胞，引发阿米巴痢疾。预防关键是注意饮食卫生。`,
  exam:'“大分子有机物要通过转运蛋白的作用才能进入细胞内，并且要消耗能量”（错，大分子靠胞吞，不需要转运蛋白）。'},
 {t:'物质运输方式综合比较',lv:3,k:['被动运输','主动运输','胞吞胞吐','选择透过性'],
  core:'细胞膜上<b>转运蛋白的种类和数量</b>，或转运蛋白<b>空间结构的变化</b>，对许多物质的跨膜运输起着决定性作用，这也是细胞膜具有<b>选择透过性的结构基础</b>。',
  why:`<div class="tbw"><table class="tb"><tr><th>方式</th><th>方向</th><th>转运蛋白</th><th>能量</th><th>实例</th></tr>
<tr><td>自由扩散</td><td>高 → 低</td><td>不需要</td><td>不需要</td><td>O₂、CO₂、甘油、乙醇、苯、部分水</td></tr>
<tr><td>协助扩散</td><td>高 → 低</td><td>载体或通道蛋白</td><td>不需要</td><td>葡萄糖进红细胞；水通道；K⁺ 通道</td></tr>
<tr><td>主动运输</td><td><b>低 → 高</b></td><td><b>载体蛋白</b></td><td><b>需要</b></td><td>小肠吸收葡萄糖、氨基酸、无机盐；根吸收矿质离子；甲状腺吸碘</td></tr>
<tr><td>胞吞、胞吐</td><td>膜外↔膜内</td><td>不需要（需膜蛋白识别）</td><td><b>需要</b></td><td>白细胞吞噬病菌；分泌蛋白分泌</td></tr></table></div>
<b>判断口诀：</b>
<ul><li>先看是不是大分子 → 是：胞吞胞吐；</li>
<li>再看是否逆浓度 → 逆浓度：主动运输；</li>
<li>顺浓度时看是否需要转运蛋白 → 需要：协助扩散；不需要：自由扩散。</li></ul>
<b>同一物质，不同细胞、不同方式：</b>葡萄糖进红细胞是协助扩散，进小肠上皮细胞是主动运输；K⁺ 进入细胞常是主动运输，流出神经细胞是协助扩散；Na⁺ 流入神经细胞是协助扩散，排出是主动运输。
<b>章末总结：</b>细胞膜其实与半透膜是有区别的。除水以外，还有许多离子或分子也能通过细胞膜，只是通过的速率和方式不同。细胞膜是<b>选择透过性膜</b>，是活的、可调节的。`,
  exam:'“被动运输都是顺浓度梯度进行的，既不消耗能量，也不需要借助转运蛋白”（错）；“物质逆浓度梯度跨膜运输时，既要消耗能量，也需要借助载体蛋白”（对）。'}],
 traps:['“需要载体蛋白的一定是主动运输”错：协助扩散也可以用载体蛋白。','“消耗能量的一定是主动运输”错：胞吞胞吐也消耗能量。','“O₂ 浓度为 0 时主动运输速率为 0”错：无氧呼吸可供少量能量。','“胞吞胞吐需要载体蛋白”错。','“胞吐只运输大分子”不严谨：神经递质等小分子也可通过胞吐释放。']}
]}];

</script>
<script>/* bio2/c56.js */
/* 第5-6章 */
const CH56=[
{id:'5',t:'细胞的能量供应和利用',secs:[
{id:'5-1',t:'降低化学反应活化能的酶',
 goal:'理解“活化能”是什么、酶为什么能加快反应；会分析“比较过氧化氢在不同条件下的分解”实验中的各种变量；了解人们认识酶本质的曲折过程；掌握酶的三个特性，会设计、评价探究酶特性的实验，读懂各种酶促反应曲线。',
 focus:[[3,'酶的作用原理：降低活化能'],[3,'酶的特性（高效性、专一性、作用条件较温和）'],[3,'探究温度、pH 对酶活性影响的实验设计（材料与试剂的选择）'],[3,'酶促反应曲线分析'],[2,'自变量、因变量、无关变量；对照实验'],[2,'酶本质的探索历程'],[2,'酶的概念']],
 models:['enzyme','enzymeExp'],
 pts:[
 {t:'细胞代谢与活化能',lv:3,k:['细胞代谢','活化能','催化剂'],
  core:'细胞中每时每刻都进行着许多化学反应，统称为<b>细胞代谢</b>。分子从常态转变为容易发生化学反应的活跃状态所需要的能量称为<b>活化能</b>。酶和无机催化剂都能<b>降低化学反应的活化能</b>，而且<b>酶降低活化能的作用更显著</b>。',
  why:`<b>翻山的比喻：</b>把化学反应比作驾车翻越一座高山。“加热”相当于给汽车加大油门（给分子提供能量，让更多分子能“爬上山顶”）；用催化剂相当于帮司机找到<b>穿山的隧道</b>（降低需要翻越的高度）。酶找到的隧道比无机催化剂的更低。
<b>细胞为什么不能靠加热？</b>细胞内温度基本恒定，加热会使蛋白质等变性，细胞无法承受。正是因为有酶，细胞代谢才能在<b>温和条件下快速有序</b>地进行。
<b>读图要点（能量—反应过程图）：</b>
<ul><li>纵坐标：能量；横坐标：反应过程。</li>
<li>活化能 = 曲线最高点（活化态）与<b>初态（反应物）</b>的能量差。</li>
<li>有酶、无机催化剂、无催化剂三条曲线的<b>起点和终点相同</b>：催化剂不改变反应物和产物的能量，也就<b>不改变反应释放（或吸收）的总能量和反应的平衡点</b>，只是改变了“山峰”的高度。</li></ul>`,
  exam:'“酶能为反应物提供能量”（错）；识图题：在能量图上标出酶降低的活化能（无催化剂峰顶与有酶峰顶的差）。'},
 {t:'实验：比较过氧化氢在不同条件下的分解',lv:3,k:['肝脏研磨液','FeCl₃','卫生香','自变量','因变量','无关变量','空白对照'],
  core:'4 支试管各加 2 mL 体积分数 3% 的 H₂O₂：1 号常温（对照）、2 号 90 ℃ 水浴、3 号加 2 滴 3.5% FeCl₃、4 号加 2 滴 20% 新鲜肝脏研磨液。结果：<b>4 号产生气泡最多最快</b>，带火星（点燃后）的卫生香复燃最猛烈。',
  why:`<b>每组对比说明什么：</b>
<table class="tb"><tr><th>比较</th><th>说明</th></tr>
<tr><td>2 号 vs 1 号</td><td>加热能促进 H₂O₂ 分解（提供能量）</td></tr>
<tr><td>3 号、4 号 vs 1 号</td><td>Fe³⁺ 和过氧化氢酶都能催化 H₂O₂ 分解（未加热也有大量气泡）</td></tr>
<tr><td>4 号 vs 3 号</td><td>酶的催化效率比无机催化剂高——<b>高效性</b></td></tr></table>
<b>一个惊人的数据：</b>每滴 3.5% FeCl₃ 溶液中的 Fe³⁺ 数，大约是每滴 20% 肝脏研磨液中过氧化氢酶分子数的 <b>25 万倍</b>。数量差这么多，酶却更快，这才真正体现了高效性。
<b>为什么肝脏要新鲜？</b>不新鲜的肝脏中，过氧化氢酶可能被微生物分解或失活。
<b>为什么要研磨？</b>使细胞破碎，酶释放出来，增大与 H₂O₂ 的接触面积。
<b>变量概念：</b>
<ul><li><b>自变量</b>：人为控制的、对实验对象进行处理的因素（温度、催化剂种类）；</li>
<li><b>因变量</b>：因自变量改变而变化的变量（H₂O₂ 分解速率，用气泡产生速率或卫生香复燃程度表示）；</li>
<li><b>无关变量</b>：自变量以外对结果有影响的可变因素（H₂O₂ 的浓度和体积、反应时间、滴加的量），要<b>相同且适宜</b>。</li></ul>
<b>对照实验：</b>除自变量外其余因素都保持一致。1 号试管是<b>对照组</b>，而且是<b>空白对照</b>（未作任何处理），用来排除 H₂O₂ 自然分解的干扰；2、3、4 号是实验组。
<b>增设 5 号（煮沸的肝脏研磨液）、6 号（蒸馏水）的目的：</b>5 号证明高温使酶失活；6 号排除“加入液体本身”对结果的影响。`,
  exam:'变量判断题超高频：指出自变量、因变量、无关变量、对照组。“在细胞内能通过加热来提高反应速率吗？”——不能。'},
 {t:'酶的本质：一段曲折的探索史',lv:2,k:['巴斯德','李比希','毕希纳','萨姆纳','切赫和奥尔特曼','脲酶'],
  core:'酶是<b>活细胞产生的具有催化作用的有机物</b>，其中<b>绝大多数酶是蛋白质</b>，少数是 <b>RNA</b>。',
  why:`<table class="tb"><tr><th>人物</th><th>观点或发现</th><th>积极意义</th><th>局限</th></tr>
<tr><td>斯帕兰札尼（1773）</td><td>把肉块放进小金属笼让鹰吞下，肉块消失</td><td>说明胃内有化学性消化（金属笼排除了物理性消化）</td><td>不知道是什么物质</td></tr>
<tr><td>巴斯德（1857）</td><td>发酵与<b>活细胞</b>有关，没有活细胞糖类不可能变成酒精</td><td>发现酵母菌在发酵中的作用</td><td>过分强调活细胞</td></tr>
<tr><td>李比希</td><td>引起发酵的是酵母细胞中的<b>某些物质</b>，但只有在细胞<b>死亡裂解后</b>才能发挥作用</td><td>认识到是化学物质在起作用</td><td>认为必须细胞死亡</td></tr>
<tr><td>毕希纳</td><td>研磨酵母菌、加压过滤得到<b>不含细胞</b>的提取液，加入葡萄糖后变成了酒，将引起发酵的物质称为<b>酿酶</b></td><td>证明酶离开活细胞也能起作用，结束了争论</td><td>提取液成分复杂，无法鉴定酶的本质</td></tr>
<tr><td>萨姆纳（1926）</td><td>从刀豆种子中提取出<b>脲酶结晶</b>，并证明<b>脲酶是蛋白质</b>（历时 9 年，获诺贝尔奖）</td><td>首次证明酶的本质是蛋白质</td><td>—</td></tr>
<tr><td>切赫、奥尔特曼（20 世纪 80 年代）</td><td>发现<b>少数 RNA 也具有生物催化功能</b></td><td>完善了酶的概念</td><td>—</td></tr></table>
<b>“酶”的中国渊源：</b>我国早在 4000 多年前的夏禹时代就掌握了酿酒技术；《康熙字典》把“酶”解释为“酒母也”。
<b>科学发展的启示：</b>科学是在实验和争论中前进的，伟大科学家的观点也可能有局限性；要善于汲取不同见解，又要有创新精神，锲而不舍。
<b>怎样设计实验检测某种酶是不是蛋白质？</b>用双缩脲试剂检测，出现紫色说明是蛋白质；或用蛋白酶处理后检测其催化活性是否丧失。在萨姆纳之前很难鉴定，是因为得不到纯酶，提取液中混有其他蛋白质。`,
  exam:'“所有的酶都是蛋白质”（错）；“酶只有释放到细胞外才起作用”（错，在细胞内外都能起作用）；“酶不能脱离生物体起作用”（错，毕希纳实验）。'},
 {t:'酶的高效性与专一性',lv:3,k:['高效性','专一性','10⁷～10¹³倍','淀粉酶','蔗糖'],
  core:'<b>高效性</b>：酶的催化效率是无机催化剂的 <b>10⁷～10¹³ 倍</b>。<b>专一性</b>：每一种酶只能催化<b>一种或一类</b>化学反应。',
  why:`<b>高效性的意义：</b>剧烈运动时肌细胞需要大量能量，如果相关的酶效率低，供能反应慢悠悠进行，你就跑不快。
<b>专一性的意义：</b>细胞内同时进行着成千上万种反应，每种酶只管自己的“那一份工作”，细胞代谢才能有条不紊。目前已发现的酶有 8 000 多种。
<b>专一性的模型（锁和钥匙）：</b>酶的<b>活性部位</b>与底物在空间结构上相互契合，只有形状匹配的底物才能结合并被催化；反应后产物离开，酶<b>本身不变</b>，可以反复使用。
<b>实验：淀粉酶对淀粉和蔗糖的水解作用</b>
<table class="tb"><tr><th>步骤</th><th>试管 1</th><th>试管 2</th></tr>
<tr><td>加底物</td><td>3% 可溶性淀粉溶液 2 mL</td><td>3% 蔗糖溶液 2 mL</td></tr>
<tr><td>加酶</td><td colspan="2">2% 新鲜淀粉酶溶液各 2 mL</td></tr>
<tr><td>保温</td><td colspan="2">60 ℃ 左右热水 5 min</td></tr>
<tr><td>检测</td><td colspan="2">各加 2 mL 斐林试剂，热水浴约 2 min</td></tr>
<tr><td>结果</td><td>砖红色沉淀</td><td>无砖红色沉淀</td></tr></table>
<b>为什么用斐林试剂而不用碘液？</b>碘液只能检测淀粉，无法判断蔗糖是否被水解（蔗糖遇碘液本来就不变蓝）。淀粉和蔗糖都是非还原糖，水解产物都是还原糖，用斐林试剂可以统一检测两支试管。
<b>验证专一性的两种思路：</b>① <b>同一种酶 + 不同底物</b>（本实验）；② <b>不同酶 + 同一种底物</b>（如淀粉酶和蔗糖酶分别催化淀粉）。`,
  exam:'“证明高效性要与什么对照”——无机催化剂（与不加催化剂对照只能证明酶有催化作用）。“能够促使唾液淀粉酶水解的酶”——蛋白酶（唾液淀粉酶的本质是蛋白质）。'},
 {t:'酶的作用条件较温和：温度和 pH',lv:3,k:['最适温度','最适pH','永久失活','低温保存','酶活性'],
  core:'在<b>最适温度和 pH</b> 条件下，酶的活性最高；温度和 pH 偏高或偏低，酶活性都会明显降低。<b>过酸、过碱或温度过高</b>，会使酶的<b>空间结构遭到破坏</b>，使酶<b>永久失活</b>；<b>0 ℃ 左右</b>时，酶的活性很低，但酶的<b>空间结构稳定</b>，在适宜温度下酶的活性会升高。因此，酶制剂适宜在<b>低温</b>下保存。',
  why:`<b>酶活性：</b>酶催化特定化学反应的能力，可用在一定条件下酶所催化某一化学反应的速率表示。
<b>为什么高温和低温的效果不同？</b>酶（多数是蛋白质）的活性依赖于特定的空间结构。高温使维持空间结构的化学键（氢键等）断裂，结构被破坏，降温后也无法恢复；低温只是让分子运动变慢、酶与底物碰撞减少，结构本身完好无损。
<b>最适条件的数据（教材“相关信息”）：</b>
<ul><li>动物体内的酶最适温度在 <b>35～40 ℃</b>；植物体内的酶在 <b>40～50 ℃</b>；细菌和真菌差别较大，有的可达 70 ℃。</li>
<li>动物体内的酶最适 pH 大多在 <b>6.5～8.0</b>，但<b>胃蛋白酶</b>最适 pH 为 <b>1.5</b>；植物体内的酶最适 pH 大多为 4.5～6.5。</li>
<li>唾液 pH 6.2～7.4，胃液 0.9～1.5，小肠液 7.6。所以唾液淀粉酶进入胃后会失活；胃蛋白酶进入小肠后也会失活。</li></ul>
<b>曲线特点：</b>温度曲线和 pH 曲线都是“钟形”。温度曲线左侧（低温）不会降到 0 后结构破坏，右侧（高温）降到 0 是永久失活；pH 曲线两侧都是失活。
<b>酶在细胞中的分布：</b>叶肉细胞中，与光合作用有关的酶分布在叶绿体内，与呼吸作用有关的酶分布在细胞质基质和线粒体内，两类反应在不同区室进行，互不干扰。
<b>生活中的应用：</b>新鲜糯玉米摘后立即放入 85 ℃ 水中热烫 2 min，可破坏<b>将可溶性糖转化为淀粉的酶</b>的活性，保持甜味；嫩肉粉中的<b>蛋白酶</b>分解肌肉组织中的蛋白质；加酶洗衣粉要用温水；工业上用酶法代替盐酸高温高压水解淀粉生产葡萄糖，条件温和、节能、设备要求低。`,
  exam:'“温度在 t₂（最适）时比 t₁（低温）时更适合酶的保存”（错）；“酶的空间结构在 t₁（低温）时比 t₃（高温）时破坏更严重”（错）。'},
 {t:'实验设计：探究温度、pH 对酶活性的影响',lv:3,k:['淀粉酶','碘液','过氧化氢酶','缓冲液','先保温后混合'],
  core:'<b>建议用淀粉酶探究温度对酶活性的影响，用过氧化氢酶探究 pH 对酶活性的影响。</b>',
  why:`<b>为什么探究温度不用过氧化氢酶？</b>H₂O₂ 本身<b>受热会分解</b>，温度越高分解越快，无法区分是酶的作用还是温度的作用。
<b>为什么探究温度时用碘液而不用斐林试剂检测？</b>斐林试剂需要 50～65 ℃ 水浴加热，会改变原来设定的温度，干扰实验结果（例如 0 ℃ 组被加热后酶活性恢复）。
<b>为什么探究 pH 不用淀粉？</b>淀粉在<b>酸性条件下也会水解</b>，无法区分是酶的作用还是酸的作用。另外碘液在碱性条件下也会反应褪色。
<b>关键操作：</b>
<ul><li>探究温度：将底物和酶<b>分别</b>在设定温度下保温一段时间，<b>再混合</b>。如果先混合再保温，在升温或降温过程中反应已经进行了。</li>
<li>探究 pH：先把酶用不同 pH 的缓冲液处理，<b>再加底物</b>。</li>
<li>温度设置至少三组：低温（冰水 0 ℃）、适宜（37 ℃ 或 60 ℃，看酶的来源）、高温（沸水 100 ℃）。</li>
<li>pH 设置：用 0.01 mol/L 盐酸、蒸馏水、0.01 mol/L NaOH 溶液或一系列缓冲液。</li></ul>
<b>定量实验：</b>用“出现同一结果所需的时间”表示酶的活性，时间越短活性越高；画出不同条件下酶活性的曲线。`,
  exam:'近年高考常考“评价实验方案”：指出某方案选用的材料或试剂不合理，并说明理由。四个“为什么”一定要会。'},
 {t:'酶促反应曲线的分析',lv:3,k:['底物浓度','酶浓度','限制因素','饱和'],
  core:'在一定范围内，反应速率随<b>底物浓度</b>增加而加快，达到一定值后不再增加，此时限制因素是<b>酶的数量</b>（浓度）；底物充足时，反应速率与<b>酶浓度</b>成正比。',
  why:`<b>反应物浓度—反应速率曲线（最适温度下）：</b>
<ul><li><b>A 点（上升段）</b>：底物不足，限制因素是<b>底物浓度</b>；</li>
<li><b>B 点（拐点）</b>：底物刚好使酶接近饱和；</li>
<li><b>C 点（平台段）</b>：酶全部在工作，限制因素是<b>酶浓度</b>（数量）。</li></ul>
<b>变式：</b>
<ul><li>从 A 点开始<b>温度升高 10 ℃</b>：原来已经是最适温度，升温后酶活性下降，整条曲线<b>下移</b>，平台降低。</li>
<li>在 B 点<b>加入少量同样的酶</b>：酶浓度增加，反应速率加快，平台<b>升高</b>。</li>
<li>如果在 B 点之后加底物：速率不变（已饱和）。</li></ul>
<b>生成物量—时间曲线：</b>酶只能加快反应速率，不改变最终生成物的量（平衡点）。所以不同温度、不同酶量下，生成物的<b>最终量相同</b>（只要底物量相同、酶未失活），只是到达平衡的<b>时间</b>不同。
<b>注意区分“酶活性”和“反应速率”：</b>温度、pH 影响的是<b>酶活性</b>；底物浓度、酶浓度影响反应速率，但<b>不影响酶活性</b>。`,
  exam:'教材原题：解释 A、B、C 三点的状况，画出升温后和加酶后的曲线。'},
 {t:'酶的概念与特点总结',lv:2,k:['活细胞产生','有机物','催化作用'],
  core:'酶是<b>活细胞产生</b>的具有<b>催化作用</b>的<b>有机物</b>。',
  why:`<table class="tb"><tr><th>项目</th><th>正确理解</th><th>常见错误</th></tr>
<tr><td>来源</td><td>一般活细胞都能产生酶（哺乳动物成熟红细胞除外）</td><td>只有内分泌细胞才产生酶</td></tr>
<tr><td>本质</td><td>绝大多数是蛋白质，少数是 RNA</td><td>都是蛋白质</td></tr>
<tr><td>基本单位</td><td>氨基酸或核糖核苷酸</td><td>只有氨基酸</td></tr>
<tr><td>合成场所</td><td>核糖体（蛋白质类）、主要在细胞核（RNA 类）</td><td>只在核糖体</td></tr>
<tr><td>作用场所</td><td>细胞内、细胞外、体外都可以</td><td>只在细胞内</td></tr>
<tr><td>作用</td><td>只有催化作用</td><td>有调节作用（那是激素）</td></tr>
<tr><td>反应前后</td><td>数量和化学性质不变</td><td>反应后被消耗</td></tr>
<tr><td>温度影响</td><td>低温抑制活性，高温使其失活</td><td>低温也会使酶失活</td></tr></table>
<b>酶为生活添姿彩：</b>溶菌酶溶解细菌细胞壁，抗菌消炎；果胶酶提高果汁产量、使果汁清亮；加酶洗衣粉；多酶片助消化；胰蛋白酶促进伤口愈合；脂肪酶处理废油脂制造生物柴油。`,
  exam:'“酶是具有催化作用的有机物”（对，D 选项）；“酶能为反应物提供能量”（错）。'}],
 traps:['“酶能为反应提供活化能”错：是降低活化能。','“酶的数量越多活性越高”错：酶浓度影响反应速率，不影响活性。','“低温使酶失活”错：低温抑制活性，结构稳定。','“探究温度对酶活性的影响可以用过氧化氢酶”错：H₂O₂ 受热分解。','“酶在反应后会被分解”错：反应前后不变。']},

{id:'5-2',t:'细胞的能量“货币”ATP',
 goal:'理解 ATP 的结构为什么决定了它能“储能”和“放能”；掌握 ATP 与 ADP 相互转化的过程和意义；能举例说明 ATP 如何驱动主动运输等生命活动；理解吸能反应和放能反应通过 ATP 联系起来。',
 focus:[[3,'ATP 的结构简式与各部分名称'],[3,'ATP 与 ADP 的相互转化（不是可逆反应）'],[3,'ATP 合成的能量来源'],[2,'ATP 为主动运输供能：载体蛋白磷酸化'],[2,'吸能反应、放能反应与 ATP 的关系']],
 models:['atp'],
 pts:[
 {t:'ATP 的结构',lv:3,k:['腺苷三磷酸','A—P～P～P','腺苷','特殊的化学键','转移势能'],
  core:'ATP 是<b>腺苷三磷酸</b>的英文名称缩写，结构简式为 <span class="f">A—P～P～P</span>，其中 <b>A 代表腺苷</b>（腺嘌呤 + 核糖），<b>P 代表磷酸基团</b>，<b>～ 代表一种特殊的化学键</b>。1 mol ATP 水解释放的能量高达 <b>30.54 kJ</b>，所以说 ATP 是一种<b>高能磷酸化合物</b>。',
  why:`<b>为什么“～”这种键不稳定？</b>两个相邻的磷酸基团都带<b>负电荷</b>而相互<b>排斥</b>，就像压紧的弹簧。所以末端磷酸基团有一种离开 ATP 而与其他分子结合的趋势，也就是具有较高的<b>转移势能</b>。
<b>ATP 水解时发生了什么？</b>在酶的作用下，远离腺苷的那个“～”断裂，脱离下来的末端磷酸基团<b>挟能量与其他分子结合</b>，使后者发生变化（被“磷酸化”）。所以 ATP 水解的过程就是释放能量的过程。
<b>ATP 的组成拆解：</b>
<ul><li>A（腺苷）= 腺嘌呤 + 核糖</li>
<li>A—P = AMP（腺苷一磷酸）= <b>腺嘌呤核糖核苷酸</b>，是组成 RNA 的基本单位之一！</li>
<li>A—P～P = ADP（腺苷二磷酸）</li>
<li>A—P～P～P = ATP</li>
<li>元素组成：C、H、O、N、P（与核酸相同）</li></ul>
<b>英文名的含义：</b>adenosine（腺苷）+ tri（三）+ phosphate（磷酸盐）。`,
  exam:'“ATP 中的 A 代表腺嘌呤”（错，是腺苷）。“ATP 脱去两个磷酸基团后是什么”——腺嘌呤核糖核苷酸。结构简式选择题：A—P～P～P。'},
 {t:'ATP 与 ADP 的相互转化',lv:3,k:['ADP','Pi','动态平衡','能量来源'],
  core:'<span class="f">ATP ⇌（酶）ADP + Pi + 能量</span>ATP 水解为 ADP 和 Pi 并释放能量；ADP 可以接受能量，同时与 Pi 结合重新形成 ATP。对细胞的正常生活来说，ATP 与 ADP 的相互转化是<b>时刻不停地发生并且处于动态平衡之中</b>的。',
  why:`<b>为什么这“不是可逆反应”？</b>
<table class="tb"><tr><th></th><th>ATP 合成</th><th>ATP 水解</th></tr>
<tr><td>酶</td><td>ATP 合成酶</td><td>ATP 水解酶</td></tr>
<tr><td>能量来源</td><td>呼吸作用释放的化学能；光合作用吸收的光能</td><td>储存在特殊化学键中的化学能</td></tr>
<tr><td>能量去路</td><td>储存在 ATP 中</td><td>用于各项生命活动</td></tr>
<tr><td>场所</td><td>线粒体、叶绿体、细胞质基质</td><td>生物体需要能量的部位</td></tr></table>
酶不同、能量来源和去路不同、场所不同。只有<b>物质</b>（ADP、Pi）可以循环利用，<b>能量不可逆</b>，所以不是可逆反应。
<b>ATP 合成所需能量从哪里来？</b>
<ul><li><b>绿色植物</b>：既可以来自<b>光能</b>（光合作用光反应），也可以来自<b>呼吸作用</b>所释放的能量；</li>
<li><b>动物、人、真菌和大多数细菌</b>：均来自<b>细胞呼吸</b>时有机物分解所释放的能量。</li></ul>
<b>“少而快”：</b>细胞中 ATP 含量很少，但转化非常迅速。一个人在剧烈运动时，每分钟约有 <b>0.5 kg</b> ATP 转化成 ADP。正常细胞中 ATP 与 ADP 的比值相对稳定。
<b>统一性：</b>ATP 与 ADP 相互转化的能量供应机制，在所有生物的细胞内都是一样的，这体现了<b>生物界的统一性</b>，也说明生物有共同的起源。`,
  exam:'“ATP 合成所需的能量由磷酸提供”（错）；“水稻细胞内的 ATP 只能由细胞呼吸产生”（错，叶肉细胞还可以通过光合作用产生）。'},
 {t:'ATP 的利用：ATP 怎样驱动生命活动',lv:2,k:['直接能源物质','磷酸化','载体蛋白','Ca²⁺','荧光素'],
  core:'<b>ATP 是驱动细胞生命活动的直接能源物质</b>。细胞中绝大多数需要能量的生命活动都是由 ATP 直接提供能量的，如大脑思考、电鳐发电、物质的主动运输、肌肉收缩、物质合成等。',
  why:`<b>ATP 为主动运输供能的过程（以 Ca²⁺ 运输为例）：</b>
<ol><li>参与 Ca²⁺ 主动运输的载体蛋白是一种能<b>催化 ATP 水解的酶</b>。当膜内侧的 Ca²⁺ 与其相应位点结合时，其酶活性就被激活了；</li>
<li>在载体蛋白这种酶的作用下，ATP 末端磷酸基团脱离下来与<b>载体蛋白结合</b>，伴随能量的转移，这就是载体蛋白的<b>磷酸化</b>；</li>
<li>载体蛋白磷酸化导致其<b>空间结构发生变化</b>，使 Ca²⁺ 的结合位点转向膜外侧，将 Ca²⁺ 释放到膜外。</li></ol>
这类既是载体又能水解 ATP 的蛋白质叫<b>离子泵</b>。所以离子泵运输属于主动运输，加入蛋白质变性剂会降低其运输速率，一氧化碳中毒（有氧呼吸减弱、ATP 减少）也会降低其运输速率。
<b>磷酸化的普遍性：</b>ATP 水解释放的磷酸基团使蛋白质等分子磷酸化，这些分子被磷酸化后空间结构发生变化，活性也被改变，因而可以参与特定的化学反应。
<b>萤火虫发光：</b>尾部发光细胞中有荧光素和荧光素酶。荧光素接受 ATP 提供的能量后被激活，在荧光素酶催化下与氧反应，形成氧化荧光素并发出荧光。这个过程是<b>化学能 → 光能</b>。利用这一原理，科学家培育出了能在黑暗中发光的“荧光树”。
<b>ATP 与葡萄糖、脂肪的区别：</b>葡萄糖是主要能源物质，脂肪是良好的储能物质，它们的能量都要先转移到 ATP 中才能被直接利用；ATP 是直接能源物质。`,
  exam:'离子泵相关选择题（教材原题）；“能够直接给细胞生命活动提供能量的物质”——腺苷三磷酸。'},
 {t:'吸能反应与放能反应',lv:2,k:['吸能反应','放能反应','能量货币'],
  core:'<b>许多吸能反应与 ATP 水解的反应相联系</b>，由 ATP 水解提供能量；<b>许多放能反应与 ATP 的合成相联系</b>，释放的能量储存在 ATP 中。能量通过 ATP 分子在吸能反应和放能反应之间流通，因此可以把 ATP 比喻成细胞内流通的能量“<b>货币</b>”。',
  why:`<b>货币比喻的妙处：</b>你打工挣钱（放能反应：葡萄糖氧化分解）→ 钱存在钱包里（ATP）→ 需要时花钱买东西（吸能反应：蛋白质合成）。钱可以在不同的“交易”之间流通，ATP 也可以把各种放能反应和吸能反应联系起来。
<b>实例：</b>
<ul><li>吸能反应：蛋白质的合成、主动运输、肌肉收缩、光合作用暗反应中 C₃ 的还原；</li>
<li>放能反应：葡萄糖的氧化分解（细胞呼吸）。</li></ul>
<b>ATP 的特点（教材拓展题）：</b>① 是直接能源物质；② 在细胞内含量少，但转化快；③ 水解时释放的能量多（高能磷酸化合物）；④ 可在细胞内各处流通，细胞质和细胞核中都有分布；⑤ 所有生物通用。`,
  exam:'“吸能反应一般与 ATP 的水解相联系”（对）；“细胞质和细胞核中都有 ATP 的分布”（对）。'}],
 traps:['“ATP 中含有三个特殊的化学键”错：两个。','“ATP 是细胞内唯一的能源物质”错：是直接能源物质，糖类、脂肪也是能源物质。','“ATP 在细胞中大量储存”错：含量很少，靠快速转化。','“ATP 与 ADP 的相互转化是可逆反应”错。','“ATP 中的能量都来自光能”错：动物来自呼吸作用。']},

{id:'5-3',t:'细胞呼吸的原理和应用',
 goal:'会设计和分析“探究酵母菌细胞呼吸的方式”实验；完整写出有氧呼吸三个阶段和无氧呼吸两个阶段的场所、物质变化、能量变化；会用 O₂ 吸收量和 CO₂ 释放量判断呼吸方式并进行计算；能用细胞呼吸原理解释生产生活中的实例。',
 focus:[[3,'有氧呼吸三个阶段（场所、反应物、产物、能量）'],[3,'无氧呼吸两种类型及实例'],[3,'探究酵母菌细胞呼吸方式实验（装置、检测试剂）'],[3,'根据 O₂ 和 CO₂ 的量判断呼吸方式及相关计算'],[2,'细胞呼吸原理的应用'],[2,'影响细胞呼吸的因素与曲线'],[1,'有氧呼吸与燃烧的区别；能量转化效率']],
 models:['yeast','resp'],
 pts:[
 {t:'实验：探究酵母菌细胞呼吸的方式',lv:3,k:['兼性厌氧菌','对比实验','NaOH','澄清石灰水','溴麝香草酚蓝','重铬酸钾'],
  core:'酵母菌在有氧条件下通过细胞呼吸产生大量 <b>CO₂ 和水</b>；在无氧条件下产生<b>酒精</b>，还产生少量 CO₂。',
  why:`<b>为什么选酵母菌？</b>酵母菌是单细胞真菌，在有氧和无氧条件下都能生存，属于<b>兼性厌氧菌</b>，便于比较两种呼吸方式。
<b>装置及每部分的作用：</b>
<ul><li><b>有氧组（A）</b>：橡皮球（或气泵）→ <b>10% NaOH 溶液</b>（吸收空气中的 CO₂，排除其对实验结果的干扰）→ 酵母菌培养液 → 澄清石灰水。间歇性通入空气约 50 min。</li>
<li><b>无氧组（B）</b>：酵母菌培养液 → 澄清石灰水。<b>B 瓶应封口放置一段时间后，再连通盛有澄清石灰水的锥形瓶</b>——目的是让酵母菌先消耗掉瓶中原有的 O₂，确保后面检测到的 CO₂ 是无氧呼吸产生的。</li>
<li>培养液：20 g 酵母菌分两份，各加 240 mL 5% 葡萄糖溶液；在 25～35 ℃ 培养 8～10 h。</li></ul>
<b>检测方法：</b>
<table class="tb"><tr><th>检测对象</th><th>试剂</th><th>现象</th></tr>
<tr><td>CO₂</td><td>澄清石灰水</td><td>变浑浊（根据浑浊程度判断 CO₂ 多少）</td></tr>
<tr><td>CO₂</td><td>溴麝香草酚蓝溶液</td><td><b>由蓝变绿再变黄</b>（根据变黄所需时间判断 CO₂ 多少）</td></tr>
<tr><td>酒精</td><td>橙色的重铬酸钾溶液（<b>酸性条件</b>，溶于浓硫酸）</td><td>变成<b>灰绿色</b></td></tr></table>
<b>检测酒精的细节：</b>取 2 mL 培养液的<b>滤液</b>，滴加 0.5 mL 溶有 0.1 g 重铬酸钾的浓硫酸溶液。由于<b>葡萄糖也能与酸性重铬酸钾反应</b>发生颜色变化，应将酵母菌的培养时间适当延长，以<b>耗尽溶液中的葡萄糖</b>。浓硫酸有腐蚀性，滴加要缓慢小心。
<b>对比实验：</b>设置两个或两个以上的实验组，通过对结果的比较分析，探究某种因素对实验对象的影响。两组的结果都是事先未知的，都是实验组，互为对照（相互对照）。这与“比较过氧化氢分解”实验中有空白对照组不同。`,
  exam:'装置图题必考：NaOH 的作用、B 瓶封口放置的原因、检测试剂和颜色。“有酒味的过期酸奶胀袋，可能是酵母菌无氧呼吸造成的”（对）；“胀袋是乳酸菌无氧呼吸产生气体造成的”（错，乳酸菌不产生 CO₂）。'},
 {t:'有氧呼吸的三个阶段',lv:3,k:['细胞质基质','线粒体基质','线粒体内膜','丙酮酸','[H]','NADH'],
  core:'<span class="f">C₆H₁₂O₆ + 6H₂O + 6O₂ →（酶）6CO₂ + 12H₂O + 能量</span>有氧呼吸是指细胞在氧的参与下，通过多种酶的催化作用，把葡萄糖等有机物<b>彻底氧化分解</b>，产生 CO₂ 和 H₂O，释放能量，生成大量 ATP 的过程。主要场所是<b>线粒体</b>。',
  why:`<div class="tbw"><table class="tb"><tr><th>阶段</th><th>场所</th><th>反应</th><th>是否需要 O₂</th><th>能量</th></tr>
<tr><td>第一阶段</td><td><b>细胞质基质</b></td><td>1 分子葡萄糖 → 2 分子丙酮酸 + 少量 [H]</td><td>不需要</td><td>少量</td></tr>
<tr><td>第二阶段</td><td><b>线粒体基质</b></td><td>丙酮酸 + 水 → CO₂ + [H]</td><td>不直接需要</td><td>少量</td></tr>
<tr><td>第三阶段</td><td><b>线粒体内膜</b></td><td>前两阶段的 [H] + O₂ → H₂O</td><td><b>需要</b></td><td><b>大量</b></td></tr></table></div>
<b>按数量写（便于计算和同位素追踪）：</b>
<ul><li>第一阶段：C₆H₁₂O₆ → 2C₃H₄O₃（丙酮酸）+ 4[H] + 少量能量</li>
<li>第二阶段：2C₃H₄O₃ + 6H₂O → 6CO₂ + 20[H] + 少量能量</li>
<li>第三阶段：24[H] + 6O₂ → 12H₂O + 大量能量</li></ul>
<b>原子去向（同位素标记题）：</b>
<ul><li>CO₂ 在<b>第二阶段</b>产生，其中的 O 来自<b>葡萄糖和反应物水</b>；</li>
<li>H₂O 在<b>第三阶段</b>生成，其中的 O 全部来自 <b>O₂</b>（用 ¹⁸O₂ 标记，¹⁸O 首先出现在水中）；</li>
<li>反应物水在第二阶段参与，所以总反应式两边都有水，不能约掉。</li></ul>
<b>[H] 是什么？</b>是一种十分简化的表示方式，主要是指氧化型辅酶Ⅰ（NAD⁺）转化成<b>还原型辅酶Ⅰ（NADH）</b>。注意区分：光合作用中的是 NADPH（还原型辅酶Ⅱ）。
<b>结构与功能相适应：</b>线粒体内膜向内折叠形成嵴，使内膜面积大大增加；内膜上和基质中含有许多与有氧呼吸有关的酶。
<b>线粒体不能直接分解葡萄糖</b>：葡萄糖必须先在细胞质基质中分解成丙酮酸，丙酮酸才进入线粒体。教材习题：酵母菌离心后，只含细胞质基质的上清液（甲）、只含细胞器的沉淀（乙）、未离心的培养液（丙）分别加葡萄糖，在有氧条件下最终能产生 CO₂ 和 H₂O 的只有<b>丙</b>。`,
  exam:'必考“场所—物质—能量”三要素填空；“有氧呼吸各阶段都需要 O₂”（错）；“有氧呼吸产生 CO₂ 的场所”——线粒体基质。'},
 {t:'有氧呼吸的能量利用特点',lv:2,k:['2870 kJ','977.28 kJ','逐步释放','热能'],
  core:'1 mol 葡萄糖彻底氧化分解可以释放出 <b>2 870 kJ</b> 的能量，可使 <b>977.28 kJ</b> 左右的能量储存在 ATP 中，其余的能量则以<b>热能</b>的形式散失掉了。',
  why:`<b>能量转化效率</b> = 977.28 ÷ 2 870 ≈ <b>34%</b>。
<b>大约能合成多少 ATP？</b>1 mol ATP 水解释放 30.54 kJ，反过来合成 1 mol ATP 约需 30.54 kJ。977.28 ÷ 30.54 ≈ <b>32 mol</b> ATP。
<b>散失的热能有用吗？</b>对恒温动物来说，这部分热能用于<b>维持体温</b>。
<b>有氧呼吸与体外燃烧相比：</b>
<ul><li>过程<b>温和</b>（常温常压，由酶催化）；</li>
<li>有机物中的能量经过一系列化学反应<b>逐步释放</b>；</li>
<li>这些能量有<b>相当一部分储存在 ATP</b> 中。</li></ul>
<b>逐步释放的意义：</b>如果能量一下子全部释放（像燃烧那样），细胞会被“烧坏”，能量也来不及储存，大部分会以热能浪费掉。逐级释放能让能量更多地转移到 ATP 中，便于细胞利用，也保证了细胞内温度稳定。`,
  exam:'计算能量转化效率；解释“逐级释放”的意义。'},
 {t:'无氧呼吸',lv:3,k:['酒精发酵','乳酸发酵','细胞质基质','196.65 kJ','61.08 kJ'],
  core:'无氧呼吸全过程在<b>细胞质基质</b>中进行，分两个阶段：第一阶段与有氧呼吸第一阶段<b>完全相同</b>；第二阶段丙酮酸在酶的催化下分解成<b>酒精和 CO₂</b>，或者转化成<b>乳酸</b>。无论哪种，都<b>只在第一阶段释放少量能量</b>，生成少量 ATP，葡萄糖分子中的大部分能量存留在酒精或乳酸中。',
  why:`<span class="f">C₆H₁₂O₆ →（酶）2C₂H₅OH（酒精）+ 2CO₂ + 少量能量</span>
<span class="f">C₆H₁₂O₆ →（酶）2C₃H₆O₃（乳酸）+ 少量能量</span>
<b>哪些生物/细胞进行哪种无氧呼吸？</b>
<table class="tb"><tr><th>产物</th><th>生物或细胞</th></tr>
<tr><td>酒精 + CO₂</td><td>酵母菌、大多数植物细胞（如水稻根、苹果果实在缺氧时）</td></tr>
<tr><td>乳酸</td><td>乳酸菌、人和动物的骨骼肌细胞、马铃薯块茎、甜菜块根、玉米胚</td></tr></table>
<b>为什么产物不同？</b>第二阶段催化的<b>酶不同</b>（与催化有氧呼吸的酶也不同）。酶不同的根本原因是基因不同。
<b>第二阶段为什么不产生 ATP？</b>第二阶段是把第一阶段产生的 [H] 用掉（还原丙酮酸），使 NAD⁺ 再生，好让第一阶段能继续进行。它本身不释放能量。
<b>能量数据：</b>1 mol 葡萄糖分解成乳酸，只释放 <b>196.65 kJ</b> 能量，其中只有 <b>61.08 kJ</b> 储存在 ATP 中，近 69% 以热能散失。人体肌细胞无氧呼吸产生的乳酸，能在肝脏中再次转化为葡萄糖。
<b>发酵：</b>酵母菌、乳酸菌等微生物的无氧呼吸也叫发酵，分为酒精发酵和乳酸发酵。
<b>有氧呼吸与无氧呼吸比较：</b>
<table class="tb"><tr><th></th><th>有氧呼吸</th><th>无氧呼吸</th></tr>
<tr><td>场所</td><td>细胞质基质、线粒体</td><td>细胞质基质</td></tr>
<tr><td>条件</td><td>需要 O₂</td><td>不需要 O₂</td></tr>
<tr><td>分解程度</td><td>彻底（CO₂ + H₂O）</td><td>不彻底（酒精 + CO₂ 或乳酸）</td></tr>
<tr><td>能量</td><td>大量</td><td>少量</td></tr>
<tr><td>相同点</td><td colspan="2">第一阶段完全相同；都需要酶；实质都是分解有机物、释放能量、生成 ATP</td></tr></table>
<b>进化的视角：</b>地球早期大气中没有氧气，早期的单细胞生物只能进行无氧呼吸。有氧呼吸保留了无氧呼吸的第一阶段，你的骨骼肌细胞仍保留着无氧呼吸的能力，这是漫长进化史留下的印记。
<b>细胞呼吸是代谢的枢纽：</b>细胞呼吸的中间产物可转化为甘油、氨基酸等非糖物质；非糖物质代谢形成的某些产物也能进一步形成葡萄糖。蛋白质、糖类和脂质的代谢都可以通过细胞呼吸联系起来。`,
  exam:'“人体剧烈运动时 CO₂ 的产生场所”——只有线粒体基质（人无氧呼吸不产生 CO₂）。“无氧呼吸两个阶段都产生 ATP”（错）。'},
 {t:'根据 O₂ 吸收量和 CO₂ 释放量判断呼吸方式',lv:3,k:['呼吸商','O₂吸收量','CO₂释放量','计算'],
  core:'以葡萄糖为底物：有氧呼吸中 <b>O₂ 吸收量 = CO₂ 释放量</b>（6∶6）；产生酒精的无氧呼吸不吸收 O₂ 但释放 CO₂；产生乳酸的无氧呼吸既不吸收 O₂ 也不释放 CO₂。',
  why:`<table class="tb"><tr><th>现象</th><th>呼吸方式</th></tr>
<tr><td>不吸收 O₂，释放 CO₂</td><td>只进行产酒精的无氧呼吸</td></tr>
<tr><td>CO₂ 释放量 = O₂ 吸收量</td><td>只进行有氧呼吸（或有氧 + 产乳酸的无氧）</td></tr>
<tr><td><b>CO₂ 释放量 ＞ O₂ 吸收量</b></td><td>有氧呼吸 + 产酒精的无氧呼吸同时进行，多出的 CO₂ 来自无氧呼吸</td></tr>
<tr><td>既不吸收 O₂ 也不释放 CO₂</td><td>只进行产乳酸的无氧呼吸，或细胞已死亡</td></tr></table>
<b>计算例题：</b>酵母菌在某条件下吸收 O₂ 3 mol，释放 CO₂ 5 mol。
有氧呼吸：O₂ 3 mol → 消耗葡萄糖 0.5 mol，产生 CO₂ 3 mol；
无氧呼吸：CO₂ 5 − 3 = 2 mol → 消耗葡萄糖 1 mol；
所以无氧呼吸消耗的葡萄糖是有氧呼吸的 <b>2 倍</b>。
<b>“非绿色器官”曲线（教材习题）：</b>横坐标 O₂ 浓度，两条线分别是 CO₂ 释放量和 O₂ 吸收量。
<ul><li>O₂ 浓度为 0：只有无氧呼吸，仍释放 CO₂（器官在呼吸）；</li>
<li>两线重合点（如 10%）之前：两种呼吸同时进行；</li>
<li>两线重合之后：只进行有氧呼吸；</li>
<li><b>CO₂ 释放总量最低点</b>（约 5%）：有机物消耗最少，最适合储存，而不是 O₂ 浓度越低越好。</li></ul>
<b>注意：</b>如果底物是脂肪，由于脂肪 H 多 O 少，有氧呼吸时 O₂ 吸收量 ＞ CO₂ 释放量。油料种子萌发时就会出现这种情况。`,
  exam:'计算题和曲线题必考。“保存该器官时氧气浓度越低越好”（错）。'},
 {t:'影响细胞呼吸的因素及应用',lv:3,k:['温度','O₂浓度','水','CO₂','中耕松土','低温低氧','破伤风'],
  core:'影响细胞呼吸的主要因素有<b>温度</b>（影响酶活性）、<b>O₂ 浓度</b>、<b>水</b>（自由水多呼吸旺盛）、<b>CO₂ 浓度</b>（产物，浓度高抑制呼吸）。生产上通过改善 O₂ 供应促进根系呼吸，通过降低温度和 O₂ 含量减弱果蔬呼吸。',
  why:`<table class="tb"><tr><th>实例</th><th>原理</th></tr>
<tr><td>包扎伤口选用<b>透气</b>的消毒纱布或“创可贴”</td><td>抑制<b>厌氧菌</b>（如破伤风芽孢杆菌）的繁殖</td></tr>
<tr><td>皮肤破损较深或被锈钉扎伤要及时就医</td><td>破伤风芽孢杆菌只能进行无氧呼吸，深伤口缺氧，容易大量繁殖</td></tr>
<tr><td>酿酒：麦芽、葡萄、粮食 + 酵母菌 + 发酵罐，<b>控制通气</b></td><td>先通气让酵母菌有氧呼吸大量繁殖，再密封让其无氧呼吸产生酒精</td></tr>
<tr><td>花盆土壤板结后要及时<b>松土</b>；农田<b>中耕松土</b>、稻田定期<b>排水</b></td><td>增加 O₂，促进根细胞<b>有氧呼吸</b>，为主动吸收无机盐提供能量；防止无氧呼吸产生酒精毒害根细胞</td></tr>
<tr><td>储藏水果、粮食：<b>降低温度、降低 O₂ 含量</b></td><td>减弱呼吸作用，减少有机物消耗，延长保质期。粮食还要<b>干燥</b>（减少自由水），水果要保持<b>一定湿度</b>（防止失水干瘪）</td></tr>
<tr><td>提倡<b>慢跑</b>等有氧运动</td><td>避免肌细胞因供氧不足进行无氧呼吸产生大量<b>乳酸</b>，乳酸积累会使肌肉酸胀乏力</td></tr>
<tr><td>做馒头、面包、泡菜；生产青霉素、味精</td><td>利用微生物的细胞呼吸</td></tr></table>
<b>养殖酵母作饲料添加剂为什么要通气？</b>有氧呼吸释放能量多，酵母菌繁殖快。<b>酿酒为什么要密封？</b>无氧条件下才产生酒精；产酒精对酵母菌的意义是在无氧条件下获得能量维持生存。
<b>中耕松土的利与弊（教材拓展题）：</b>利：促进根系有氧呼吸和对无机盐的吸收；促进土壤中好氧微生物分解有机物。弊：可能加剧水土流失；促进土壤微生物分解有机物释放更多 CO₂，加剧温室效应。所以要适度松土。`,
  exam:'应用题：给出生活实例，说出应用了什么原理。“储存水果需要无氧条件”（错，无氧会产生酒精导致腐烂）。'}],
 traps:['“有氧呼吸只在线粒体中进行”错：第一阶段在细胞质基质。','“无氧呼吸不产生 CO₂”错：产酒精的无氧呼吸产生 CO₂。','“人体无氧呼吸产生酒精”错：产生乳酸。','“检测酒精可用澄清石灰水”错：用酸性重铬酸钾。','“原核生物没有线粒体，不能进行有氧呼吸”错：好氧细菌在细胞质和细胞膜上进行有氧呼吸。','“有氧呼吸中的 [H] 是 NADPH”错：是 NADH。']},

{id:'5-4',t:'光合作用与能量转化',
 goal:'完成并理解色素提取与分离实验；知道四种色素的吸收光谱；理解叶绿体结构如何适应光合作用；跟随科学史推导出光合作用分两个阶段；掌握光反应和暗反应的场所、条件、物质变化、能量变化及联系；会分析条件骤变时各物质含量的变化；理解环境因素对光合作用强度的影响及其应用；了解化能合成作用。',
 focus:[[3,'色素的提取和分离实验（试剂作用、色素带顺序与颜色）'],[3,'光反应与暗反应的场所、物质变化、能量变化及联系'],[3,'条件骤变时 C₃、C₅、ATP、NADPH 含量变化'],[3,'光照强度、CO₂ 浓度、温度对光合作用的影响及曲线'],[3,'总光合、净光合与呼吸的关系'],[2,'光合作用探索历程（希尔、鲁宾和卡门、阿尔农、卡尔文）'],[2,'恩格尔曼实验'],[2,'化能合成作用；光合作用与细胞呼吸的比较']],
 models:['pigment','photo','lightcurve'],
 pts:[
 {t:'实验：绿叶中色素的提取和分离',lv:3,k:['无水乙醇','层析液','SiO₂','CaCO₃','滤液细线','纸层析法'],
  core:'<b>提取原理</b>：绿叶中的色素能溶解在有机溶剂<b>无水乙醇</b>中。<b>分离原理</b>：不同色素在<b>层析液</b>中的溶解度不同，<b>溶解度高的随层析液在滤纸上扩散得快</b>，反之则慢。',
  why:`<b>步骤与每一步的“为什么”：</b>
<ol><li><b>称 5 g 绿叶，剪去主叶脉，剪碎</b>：主叶脉中色素少；剪碎便于研磨。</li>
<li><b>加少许 SiO₂ 和 CaCO₃，再加 5～10 mL 无水乙醇，迅速、充分研磨</b>：
 <ul><li>SiO₂（二氧化硅）——有助于<b>研磨得充分</b>；</li>
 <li>CaCO₃（碳酸钙）——<b>防止研磨中色素被破坏</b>（中和液泡中释放的有机酸，叶绿素在酸性条件下易被破坏）；</li>
 <li>无水乙醇——<b>溶解（提取）色素</b>；也可用 95% 乙醇加适量无水碳酸钠（除水）代替；</li>
 <li>“迅速”——防止乙醇挥发。</li></ul></li>
<li><b>用单层尼龙布过滤，试管口用棉塞塞严</b>：用尼龙布而不用滤纸，因为色素会被滤纸吸附；塞严防止乙醇挥发。</li>
<li><b>制备滤纸条</b>：干燥的定性滤纸，一端剪去两角（防止两侧层析液扩散过快，使色素带不整齐），距底部 1 cm 处用<b>铅笔</b>画细线（铅笔不溶于层析液）。</li>
<li><b>画滤液细线</b>：用毛细吸管沿铅笔线画，<b>细、直、齐</b>；待滤液<b>干后再重画一到两次</b>（增加色素量，使色素带清晰，同时保持线细，防止色素带重叠）。</li>
<li><b>分离</b>：滤纸条有细线的一端朝下插入层析液，塞紧试管口。<b>不能让滤液细线触及层析液</b>，否则色素会溶解到层析液中，滤纸条上得不到色素带。层析液有毒，要在通风好的条件下进行。</li></ol>
<b>结果（从上到下）：</b>
<table class="tb"><tr><th>色素</th><th>颜色</th><th>含量</th><th>溶解度</th><th>主要吸收</th></tr>
<tr><td>胡萝卜素</td><td>橙黄色</td><td>最少（带最窄）</td><td>最高</td><td rowspan="2">蓝紫光（类胡萝卜素，约占 1/4）</td></tr>
<tr><td>叶黄素</td><td>黄色</td><td>较少</td><td>较高</td></tr>
<tr><td>叶绿素 a</td><td><b>蓝绿色</b></td><td><b>最多</b>（带最宽）</td><td>较低</td><td rowspan="2">红光和蓝紫光（叶绿素，约占 3/4）</td></tr>
<tr><td>叶绿素 b</td><td>黄绿色</td><td>较多</td><td>最低</td></tr></table>
口诀：“<b>胡黄 ab</b>，橙黄黄蓝绿黄绿”。相邻距离最远的是胡萝卜素和叶黄素，最近的是叶绿素 a 和 b。
<b>异常结果分析：</b>
<ul><li>色素带颜色很浅：研磨不充分、加乙醇过多、未重复画线、叶片不新鲜；</li>
<li>只有两条黄色带、绿色带很弱：未加 CaCO₃（叶绿素被破坏），或用的是发黄的叶片；</li>
<li>没有色素带：滤液细线触及层析液；</li>
<li>色素带重叠：滤液细线画得太粗。</li></ul>`,
  exam:'超高频实验！试剂作用、色素带顺序与颜色、异常结果原因分析。“提取色素用层析液”（错，提取用无水乙醇，分离用层析液）。'},
 {t:'色素的吸收光谱与叶绿体结构',lv:3,k:['吸收光谱','红光','蓝紫光','类囊体','基粒','恩格尔曼'],
  core:'叶绿素 a 和叶绿素 b 主要吸收<b>蓝紫光和红光</b>，胡萝卜素和叶黄素主要吸收<b>蓝紫光</b>。四种色素都能用于光合作用，它们分布在叶绿体<b>类囊体的薄膜</b>上。',
  why:`<b>叶片为什么是绿色的？</b>色素对绿光吸收最少，绿光被反射出来。所以“叶片呈绿色是因为叶绿体吸收了绿光”是错的。
<b>植物工厂为什么不用绿光光源？</b>绿光几乎不被利用，常用红光和蓝光 LED。
<b>可见光</b>波长 400～760 nm，一般情况下光合作用所利用的光都是可见光。
<b>白化苗为什么会死？</b>不含绿色色素，不能进行光合作用，待种子中储存的养分耗尽就会死去。
<b>海洋藻类的分层</b>：绿藻、褐藻、红藻依次分布在浅、中、深层。这与光能的捕获有关：不同波长的光穿透海水的能力不同，深层主要是短波长的蓝绿光，红藻含有能吸收这些光的色素。
<b>叶绿体结构适于光合作用：</b>
<ul><li>双层膜包被，内部有许多<b>基粒</b>，每个基粒由<b>类囊体</b>堆叠而成，多的可达 100 个以上，极大扩展了受光面积；</li>
<li>吸收光能的四种色素分布在类囊体薄膜上；</li>
<li>类囊体膜上和叶绿体基质中含有许多光合作用必需的<b>酶</b>。</li></ul>
<b>恩格尔曼的实验（1881）：</b>
<ol><li>把载有<b>水绵</b>（叶绿体呈螺旋带状，便于观察）和<b>需氧细菌</b>的临时装片放在<b>没有空气</b>的小室内，在<b>黑暗</b>中用<b>极细的光束</b>照射水绵 → 细菌只向叶绿体<b>被光束照射到的部位</b>集中；放在光下 → 细菌分布在叶绿体所有受光部位。结论：<b>叶绿体能吸收光能用于光合作用放氧</b>。</li>
<li>用透过三棱镜的光照射水绵 → 大量需氧细菌聚集在<b>红光和蓝紫光</b>区域。结论：叶绿体主要吸收红光和蓝紫光。</li></ol>
<b>巧妙之处：</b>选水绵（叶绿体大且呈带状）；用需氧细菌检测 O₂ 产生的部位；没有空气、黑暗——排除了环境中 O₂ 和光的干扰；极细光束——形成对照（照光部位与不照光部位）。`,
  exam:'“所有植物细胞中都含有 4 种色素”（错，根细胞没有）；“叶绿体中只有叶绿素吸收的光能才能用于光合作用”（错）。'},
 {t:'光合作用原理的探索',lv:2,k:['甲醛','希尔反应','鲁宾和卡门','¹⁸O','阿尔农','卡尔文','¹⁴C'],
  core:'光合作用释放的 <b>O₂ 中的氧元素来自水</b>；O₂ 的产生和糖类的合成<b>不是同一个化学反应</b>，而是分阶段进行的。',
  why:`<table class="tb"><tr><th>时间与人物</th><th>实验</th><th>结论</th></tr>
<tr><td>19 世纪末</td><td>普遍认为 CO₂ 中的 C 和 O 被分开，O₂ 被释放，C 与 H₂O 结合成甲醛，再缩合成糖</td><td>（错误观点）</td></tr>
<tr><td>1928 年</td><td>发现甲醛对植物有毒害作用，且甲醛不能通过光合作用转化成糖</td><td>否定了“甲醛假说”</td></tr>
<tr><td>1937 年 希尔</td><td>离体叶绿体悬浮液中加入铁盐或其他氧化剂（<b>有 H₂O，没有 CO₂</b>），光照下释放 O₂（<b>希尔反应</b>）</td><td>水的光解产生 O₂；O₂ 的产生<b>不需要 CO₂</b>，与糖的合成不是同一反应。但不能说明 O₂ 中的氧<b>全部</b>来自水</td></tr>
<tr><td>1941 年 鲁宾和卡门</td><td><b>同位素示踪</b>（¹⁸O）：第一组 H₂O + C¹⁸O₂，第二组 H₂¹⁸O + CO₂</td><td>第一组释放 O₂，第二组释放 ¹⁸O₂ → O₂ 中的氧<b>全部来自水</b></td></tr>
<tr><td>1954 年、1957 年 阿尔农</td><td>光照下叶绿体可合成 ATP；这一过程总是与水的光解相伴随</td><td>光反应中有 ATP 生成</td></tr>
<tr><td>20 世纪 40 年代 卡尔文</td><td>用 <b>¹⁴CO₂</b> 供<b>小球藻</b>光合作用，追踪 ¹⁴C 的去向</td><td>探明 CO₂ 中的碳转化为有机物中碳的途径（卡尔文循环）：<b>CO₂ → C₃ → (CH₂O)</b></td></tr></table>
<b>注意：</b>¹⁸O 是<b>稳定同位素</b>，没有放射性，鲁宾和卡门检测的是 O₂ 的相对分子质量（用质谱仪）；¹⁴C 是放射性同位素。`,
  exam:'“用 ¹⁴C 追踪碳原子的转移途径”——CO₂ → 三碳化合物 → 糖类。“希尔的实验说明光合作用产生的 O₂ 全部来自水”（错，需要鲁宾和卡门的实验）。'},
 {t:'光反应阶段',lv:3,k:['类囊体薄膜','水的光解','NADPH','ATP','光能→化学能'],
  core:'<b>场所</b>：叶绿体<b>类囊体的薄膜</b>上。<b>条件</b>：必须有<b>光</b>，还需要色素和酶。<b>物质变化</b>：① 水分解为 O₂ 和 H⁺，O₂ 释放，H⁺ 与 NADP⁺ 结合形成 <b>NADPH</b>；② ADP + Pi → <b>ATP</b>。<b>能量变化</b>：光能 → ATP 和 NADPH 中的化学能。',
  why:`<b>光能的两方面用途：</b>
<ol><li><b>水的光解</b>：水分解为氧和 H⁺，同时被叶绿素夺去两个电子。氧以 O₂ 形式释放出去；电子经传递，用于 NADP⁺（氧化型辅酶Ⅱ）与 H⁺ 结合形成 <b>NADPH</b>（还原型辅酶Ⅱ）。</li>
<li>在有关酶的催化作用下，提供能量促使 <b>ADP 与 Pi 反应形成 ATP</b>。</li></ol>
<b>NADPH 的双重作用：</b>① 作为<b>活泼的还原剂</b>，参与暗反应（还原 C₃）；② <b>储存部分能量</b>供暗反应利用。
<b>产物去向：</b>O₂ 释放到叶绿体外（一部分供线粒体有氧呼吸，其余释放到细胞外）；ATP 和 NADPH 从类囊体薄膜移动到叶绿体<b>基质</b>，用于暗反应。
<b>注意：</b>光反应产生的 ATP <b>只用于暗反应</b>，不用于其他生命活动（其他生命活动的 ATP 来自细胞呼吸）。`,
  exam:'“光反应的产物”——O₂、ATP、NADPH。“光反应只能在光下进行”（对）。'},
 {t:'暗反应阶段（卡尔文循环）',lv:3,k:['叶绿体基质','CO₂的固定','C₃的还原','C₅','卡尔文循环'],
  core:'<b>场所</b>：叶绿体<b>基质</b>。<b>条件</b>：不直接依赖光，需要多种酶、ATP 和 NADPH。<b>物质变化</b>：① <b>CO₂ 的固定</b>：CO₂ + C₅ →（酶）2C₃；② <b>C₃ 的还原</b>：C₃ 接受 ATP 和 NADPH 释放的能量并被 NADPH 还原，一部分转化为糖类，另一部分又形成 C₅。<b>能量变化</b>：ATP 和 NADPH 中的化学能 → 糖类等有机物中的化学能。',
  why:`<b>C₃ 和 C₅ 是什么？</b>C₃ 是三碳化合物（3-磷酸甘油酸），C₅ 是五碳化合物（核酮糖-1,5-二磷酸，RuBP）。
<b>为什么叫“循环”？</b>C₅ 固定 CO₂ 变成 C₃，C₃ 被还原后一部分又变回 C₅，C₅ 又可以参与 CO₂ 的固定。从 C₅ 到 C₃ 再到 C₅ 的循环可以源源不断进行，所以也称<b>卡尔文循环</b>。
<b>CO₂ 从哪里来？</b>绿叶通过<b>气孔</b>从外界吸收；此外还有细胞自身有氧呼吸产生的 CO₂。
<b>“暗反应”不是“在黑暗中进行的反应”：</b>它不直接需要光，有光无光都能进行（现在也叫<b>碳反应</b>）。但如果长时间黑暗，光反应停止，没有 ATP 和 NADPH 供应，暗反应很快也会停止。
<b>产物：</b>光合作用的产物有一部分是<b>淀粉</b>，还有一部分是<b>蔗糖</b>。蔗糖可以进入筛管，再通过韧皮部运输到植株各处。
<b>为什么需要 ATP 和 NADPH 都要？</b>ATP 提供能量；NADPH 既提供能量又作为还原剂（提供 H）。`,
  exam:'“暗反应只能在黑暗条件下进行”（错）；“影响光反应的因素不会影响暗反应”（错，两者紧密联系）。'},
 {t:'光反应与暗反应的联系；总反应式',lv:3,k:['ATP、NADPH','ADP、Pi、NADP⁺','光能→稳定的化学能'],
  core:'<span class="f">CO₂ + H₂O →（光能，叶绿体）(CH₂O) + O₂</span>光反应为暗反应提供 <b>ATP 和 NADPH</b>；暗反应为光反应提供 <b>ADP、Pi 和 NADP⁺</b>。两者紧密联系，能量转化与物质变化密不可分。',
  why:`<table class="tb"><tr><th></th><th>光反应</th><th>暗反应</th></tr>
<tr><td>场所</td><td>类囊体薄膜</td><td>叶绿体基质</td></tr>
<tr><td>条件</td><td>光、色素、酶</td><td>多种酶、ATP、NADPH、CO₂</td></tr>
<tr><td>物质变化</td><td>水的光解；ATP、NADPH 的合成</td><td>CO₂ 的固定；C₃ 的还原</td></tr>
<tr><td>能量变化</td><td>光能 → ATP、NADPH 中的化学能</td><td>ATP、NADPH 中的化学能 → 有机物中稳定的化学能</td></tr></table>
<b>原子去向（同位素标记）：</b>
<ul><li>H₂O 中的 O → <b>O₂</b>；H₂O 中的 H → NADPH → (CH₂O)</li>
<li>CO₂ 中的 C → C₃ → (CH₂O)（和 C₅）</li>
<li>CO₂ 中的 O → (CH₂O) 和 H₂O（总反应式中右边生成的水）</li></ul>
<b>光合作用的意义：</b>是唯一能够捕获和转化光能的生物学途径，被称为“地球上最重要的化学反应”。光合作用产生的有机物，不仅供植物自身利用，还养活了包括你我在内的所有异养生物。光能通过驱动光合作用而驱动生命世界的运转。`,
  exam:'光合作用过程图解填空，几乎每次都考。'},
 {t:'条件骤变时 C₃、C₅、ATP、NADPH 含量的变化',lv:3,k:['C₃','C₅','光照减弱','CO₂减少','来源与去路'],
  core:'分析方法：抓住每种物质的“<b>来源</b>”和“<b>去路</b>”，看哪一个变了。',
  why:`<b>C₃</b>：来源——CO₂ 固定；去路——被还原（需要 ATP、NADPH）。
<b>C₅</b>：来源——C₃ 还原再生；去路——固定 CO₂。
<b>ATP、NADPH</b>：来源——光反应；去路——C₃ 还原。
<table class="tb"><tr><th>条件变化（其他不变）</th><th>C₃</th><th>C₅</th><th>ATP、NADPH</th><th>(CH₂O) 合成</th></tr>
<tr><td><b>光照减弱或停止</b></td><td>↑</td><td>↓</td><td>↓</td><td>↓</td></tr>
<tr><td>光照增强</td><td>↓</td><td>↑</td><td>↑</td><td>↑</td></tr>
<tr><td><b>CO₂ 供应减少</b></td><td>↓</td><td>↑</td><td>↑</td><td>↓</td></tr>
<tr><td>CO₂ 供应增加</td><td>↑</td><td>↓</td><td>↓</td><td>↑</td></tr></table>
<b>推理示范——突然停止光照：</b>光反应停止 → ATP、NADPH 减少 → C₃ 的还原减慢（C₃ 去路减少），而 CO₂ 固定仍在进行（C₃ 来源不变）→ <b>C₃ 增加</b>；同时 C₃ 还原生成的 C₅ 减少（C₅ 来源减少），而 C₅ 固定 CO₂ 仍在消耗（去路不变）→ <b>C₅ 减少</b>。
<b>推理示范——夏季中午气孔关闭：</b>CO₂ 吸收减少 → CO₂ 固定减慢 → C₃ 生成减少（来源减少），还原照常 → <b>C₃ 减少</b>；C₅ 消耗减少，生成照常 → <b>C₅ 增加</b>；C₃ 少了，消耗的 ATP、NADPH 也少 → <b>ATP、NADPH 增加</b>。
<b>注意：</b>这里说的都是“<b>短时间内</b>”的变化。时间长了，系统会达到新的平衡。`,
  exam:'几乎年年考。可以在本节“光合作用”模型里亲手调节光照和 CO₂，观察 C₃、C₅ 曲线的实时变化。'},
 {t:'影响光合作用强度的环境因素',lv:3,k:['光照强度','CO₂浓度','温度','光补偿点','光饱和点','气孔','午休'],
  core:'光合作用的<b>原料</b>（水、CO₂）、<b>动力</b>（光能）、<b>场所</b>（叶绿体的形成和结构，受无机营养、病虫害影响）、<b>酶</b>（受温度影响）都会影响光合作用强度。',
  why:`<b>光合作用强度</b>：植物在单位时间内通过光合作用制造糖类的数量。
<b>光照强度—光合速率曲线：</b>
<ul><li>光照为 0：只有细胞呼吸，CO₂ 释放量 = 呼吸速率；</li>
<li><b>光补偿点</b>：光合速率 = 呼吸速率，净光合为 0；</li>
<li><b>光饱和点</b>：光合速率达到最大时的最小光照强度。之后限制因素不再是光照，而是 CO₂ 浓度、温度、酶的数量、色素含量等。</li>
<li>阴生植物的光补偿点和光饱和点都比阳生植物低。</li></ul>
<b>CO₂ 浓度：</b>在一定范围内，光合速率随 CO₂ 浓度升高而加快，到一定程度后不再增加。CO₂ 浓度倍增时，光合速率并未倍增，因为此时光照强度、酶的数量和活性、ATP 和 NADPH 的供应等成为限制因素。
<b>温度：</b>通过影响<b>酶的活性</b>来影响光合作用，主要影响暗反应。
<b>夏季晴天的“午休”现象（教材习题）：</b>
<ul><li>7～10 时：光照逐渐增强，光合作用强度不断增强；</li>
<li>10～12 时：温度过高、蒸腾作用过强，<b>气孔部分关闭</b>，CO₂ 吸收减少，光合作用强度明显减弱；</li>
<li>14～17 时：光照逐渐减弱，光合作用强度不断下降。</li></ul>
<b>探究光照强度对光合作用强度的影响（圆形小叶片上浮法）：</b>用打孔器打出圆形小叶片 30 片，用注射器抽出叶片内的气体，使其沉到水底（黑暗中保存）；分别放入含 CO₂ 的清水（或 1%～2% NaHCO₃ 溶液）中，置于强、中、弱光下；观察同一时间段内小叶片浮起的数量。光合作用产生的 O₂ 积累在细胞间隙，使叶片上浮。注意：观测到的是<b>净光合</b>产生的 O₂。
<b>西北瓜果为什么甜？</b>白天光照强、光合作用旺盛；夜间温度低、呼吸作用微弱，有机物积累多。
<b>生产应用：</b>合理密植、间作套种（充分利用光能）；增施农家肥（微生物分解产生 CO₂）、温室中使用 CO₂ 发生器；温室白天适当升温、夜晚适当降温（增大昼夜温差）；植物工厂用红蓝光 LED 补光。`,
  exam:'曲线题：找出光补偿点、光饱和点，分析各点的限制因素；变式：缺 Mg 时光补偿点右移、光饱和点左移。'},
 {t:'总光合速率、净光合速率与呼吸速率',lv:3,k:['真正光合速率','净光合速率','呼吸速率','有机物积累'],
  core:'<b>总（真正）光合速率 = 净光合速率 + 呼吸速率</b>。植物在进行光合作用的同时还进行呼吸作用，我们观测到的指标（O₂ 释放量、CO₂ 吸收量、有机物积累量）都是<b>净光合速率</b>。',
  why:`<b>关键词对应表：</b>
<table class="tb"><tr><th>总光合</th><th>净光合</th><th>呼吸</th></tr>
<tr><td>O₂ <b>产生</b>量</td><td>O₂ <b>释放</b>量</td><td>黑暗中 O₂ 吸收量</td></tr>
<tr><td>CO₂ <b>固定</b>量（或利用量）</td><td>CO₂ <b>吸收</b>量（从外界）</td><td>黑暗中 CO₂ 释放量</td></tr>
<tr><td>有机物<b>制造</b>量（或合成量）</td><td>有机物<b>积累</b>量</td><td>有机物消耗量</td></tr></table>
<b>植物能否生长？</b>看一昼夜有机物是否有积累：白天净光合积累量 − 夜晚呼吸消耗量 ＞ 0 才能生长。
<b>例：</b>某植物在光下每小时吸收 CO₂ 44 mg，黑暗中每小时释放 CO₂ 22 mg，则每小时实际固定 CO₂ = 44 + 22 = 66 mg。
<b>密封玻璃瓶中的种子能活多久？</b>取决于光照、温度、瓶内 CO₂ 和 O₂ 的量、土壤中的水和无机盐等。如果光合作用与呼吸作用长期平衡、物质循环正常，就能存活较长时间。`,
  exam:'计算题必考，关键是辨认题目给的是哪种数据。'},
 {t:'化能合成作用；光合作用与细胞呼吸的比较',lv:2,k:['化能合成作用','硝化细菌','自养','异养'],
  core:'少数种类的细菌，细胞内没有叶绿素，不能进行光合作用，但能利用体外环境中某些<b>无机物氧化时所释放的能量</b>来制造有机物，这叫<b>化能合成作用</b>。例如<b>硝化细菌</b>能将 NH₃ 氧化成 HNO₂，进而氧化成 HNO₃，利用释放的化学能将 CO₂ 和 H₂O 合成糖类。',
  why:`<b>自养与异养：</b>能利用无机物合成有机物的是自养生物，包括<b>光能自养</b>（绿色植物、蓝细菌）和<b>化能自养</b>（硝化细菌）；只能利用现成有机物的是异养生物（人、动物、真菌、大多数细菌）。
<b>光合作用与细胞呼吸的比较（教材复习题）：</b>
<table class="tb"><tr><th></th><th>光合作用</th><th>细胞呼吸</th></tr>
<tr><td>场所</td><td>叶绿体</td><td>细胞质基质、线粒体</td></tr>
<tr><td>条件</td><td>光、色素、酶</td><td>酶（有光无光都能进行）</td></tr>
<tr><td>物质变化</td><td>无机物 → 有机物</td><td>有机物 → 无机物（或小分子有机物）</td></tr>
<tr><td>能量变化</td><td>光能 → 有机物中稳定的化学能（储能）</td><td>有机物中的化学能 → ATP 中的化学能 + 热能（放能）</td></tr>
<tr><td>发生的细胞</td><td>含叶绿体的细胞</td><td>所有活细胞</td></tr>
<tr><td>联系</td><td colspan="2">光合作用的产物（O₂、有机物）是细胞呼吸的原料；细胞呼吸的产物（CO₂、H₂O）是光合作用的原料</td></tr></table>
<b>叶肉细胞中能合成 ATP 的部位：</b>细胞质基质、线粒体（基质和内膜）、叶绿体类囊体薄膜。<b>叶绿体基质不能合成 ATP</b>，而是消耗 ATP。
<b>叶绿体不同于线粒体的特点：</b>能分解水产生 O₂ 和 H⁺（线粒体也利用水，但不分解水产生 O₂）。`,
  exam:'“叶肉细胞中不能合成 ATP 的部位”——叶绿体基质。“化能合成作用利用的是光能”（错）。'}],
 traps:['“叶片呈绿色是因为叶绿体吸收了绿光”错：是因为反射了绿光。','“光合作用产生的 O₂ 来自 CO₂”错：全部来自水。','“暗反应在黑暗中才能进行”错。','“光反应产生的 ATP 可用于各项生命活动”错：只用于暗反应。','“提取色素用层析液”错：用无水乙醇。','“O₂ 释放量就是光合作用产生的 O₂ 总量”错：是净光合。']}
]},

{id:'6',t:'细胞的生命历程',secs:[
{id:'6-1',t:'细胞的增殖',
 goal:'理解生物体长大的原因和细胞不能无限长大的原因；掌握细胞周期的概念和表示方法；能按时期描述有丝分裂中染色体的行为，并画出染色体、DNA、染色单体的数量变化曲线；比较动植物细胞有丝分裂的异同；完成并分析观察根尖有丝分裂的实验。',
 focus:[[3,'有丝分裂各时期的特点'],[3,'染色体、核 DNA、染色单体数目变化（表格与曲线）'],[3,'动植物细胞有丝分裂的区别'],[3,'观察根尖分生区有丝分裂实验（步骤、试剂作用、现象分析）'],[2,'细胞周期的概念与判断'],[2,'细胞不能无限长大的原因'],[1,'无丝分裂；癌细胞']],
 models:['sav','mitosis'],
 pts:[
 {t:'生物体长大与细胞增殖',lv:2,k:['细胞生长','细胞分裂','细胞增殖'],
  core:'多细胞生物体体积的增大，既靠<b>细胞生长</b>增大细胞体积，还要靠<b>细胞分裂</b>增加细胞数量。不同动（植）物同类器官或组织的细胞大小一般<b>无明显差异</b>，器官大小主要取决于<b>细胞数量</b>的多少。',
  why:`大象和老鼠相应器官的细胞大小差不多，象之所以大，是因为细胞数量多得多。
<b>细胞增殖</b>：细胞通过细胞分裂增加细胞数量的过程。
<ul><li>单细胞生物通过细胞增殖而繁衍；</li>
<li>多细胞生物从受精卵开始，要经过细胞增殖和分化逐渐发育为成体；</li>
<li>体内不断有细胞衰老、死亡，需要细胞增殖补充。</li></ul>
所以细胞增殖是生物体<b>生长、发育、繁殖、遗传</b>的基础。
<b>细胞分裂不是简单一分为二：</b>如果只是简单分开，遗传物质会越分越少。所以细胞在分裂之前必须进行物质准备，特别是遗传物质要进行<b>复制</b>。细胞增殖包括<b>物质准备和细胞分裂</b>两个相连续的过程，具有<b>周期性</b>。
<b>真核细胞的分裂方式：</b>有丝分裂（主要方式）、无丝分裂、减数分裂（必修 2）。`,
  exam:'“有丝分裂是细胞增殖的唯一方式”（错）。'},
 {t:'细胞不能无限长大',lv:2,k:['表面积与体积之比','物质运输效率','核质比'],
  core:'细胞体积越大，其<b>表面积与体积的比值（相对表面积）越小</b>，细胞与周围环境进行物质交换的效率就越低。',
  why:`<b>模型计算（教材思维训练）：</b>三个立方体“细胞”边长 2、4、8 mm，物质向内扩散深度都是 0.5 mm。
<table class="tb"><tr><th>边长</th><th>表面积</th><th>体积</th><th>表面积/体积</th><th>扩散体积/总体积</th></tr>
<tr><td>2 mm</td><td>24 mm²</td><td>8 mm³</td><td>3</td><td>(8 − 1³)/8 ≈ 87.5%</td></tr>
<tr><td>4 mm</td><td>96 mm²</td><td>64 mm³</td><td>1.5</td><td>(64 − 3³)/64 ≈ 57.8%</td></tr>
<tr><td>8 mm</td><td>384 mm²</td><td>512 mm³</td><td>0.75</td><td>(512 − 7³)/512 ≈ 33.0%</td></tr></table>
<b>规律：</b>扩散深度相同，但细胞越大，物质扩散进入的体积占总体积的比例越小，物质运输效率越低。
<b>另一个原因：</b>细胞核中的 DNA 不会随细胞体积扩大而增加，细胞太大时，细胞核难以控制整个细胞的代谢（核质比限制）。
<b>细胞越小越好吗？</b>不是。细胞内要容纳 DNA、核糖体、酶等必需的物质和结构，需要一定的空间，所以细胞也不能太小。`,
  exam:'计算表面积/体积及扩散比例；解释细胞不能无限长大的原因。'},
 {t:'细胞周期',lv:3,k:['连续分裂','分裂间期','分裂期','90%～95%'],
  core:'<b>连续分裂</b>的细胞，从<b>一次分裂完成时开始</b>，到<b>下一次分裂完成时为止</b>，为一个细胞周期。一个细胞周期包括<b>分裂间期</b>和<b>分裂期</b>，分裂间期占细胞周期的 <b>90%～95%</b>。',
  why:`<b>三个要点：</b>
<ol><li><b>只有连续分裂的细胞才有细胞周期</b>：如根尖分生区细胞、茎形成层细胞、造血干细胞、皮肤生发层细胞、癌细胞、早期胚胎细胞。高度分化的细胞（神经细胞、肌细胞、红细胞）和进行减数分裂的细胞没有细胞周期。</li>
<li><b>起点是“一次分裂完成时”</b>，所以先是间期，后是分裂期。“从分裂期开始到下一个分裂期开始”的说法是错的。</li>
<li><b>间期时间长</b>：间期要完成 DNA 复制和有关蛋白质的合成，同时细胞有适度生长，需要的时间长。</li></ol>
<b>不同细胞的细胞周期（h）：</b>
<table class="tb"><tr><th>细胞类型</th><th>分裂间期</th><th>分裂期</th><th>细胞周期</th></tr>
<tr><td>蚕豆根尖分生区细胞</td><td>15.3</td><td>2.0</td><td>17.3</td></tr>
<tr><td>小鼠十二指肠上皮细胞</td><td>13.5</td><td>1.8</td><td>15.3</td></tr>
<tr><td>人的肝细胞</td><td>21</td><td>1</td><td>22</td></tr>
<tr><td>人的宫颈癌细胞</td><td>20.5</td><td>1.5</td><td>22</td></tr></table>
<b>表示方法：</b>
<ul><li><b>线段图</b>：a（间期，长）→ b（分裂期，短）→ c（间期）→ d（分裂期）。一个细胞周期是 a + b 或 c + d，<b>不能</b>是 b + c。</li>
<li><b>扇形图</b>：顺时针方向，从分裂期结束点到下一个分裂期结束点。</li></ul>
<b>教材题：</b>用 ³²P 标记的磷酸盐浸泡蚕豆幼苗，测得分裂节点 0、2、19.3、21.3、38.6、40.6 h。细胞周期 = 21.3 − 2 = <b>19.3 h</b>，分裂间期 = 19.3 − 2 = 17.3 h，分裂期 = 2 h。`,
  exam:'线段图、扇形图上找一个完整的细胞周期；计算间期和分裂期时长。'},
 {t:'有丝分裂各时期的特点',lv:3,k:['间期','前期','中期','后期','末期','着丝粒','纺锤体','赤道板','细胞板'],
  core:'人们根据染色体的行为，把有丝分裂分为<b>前期、中期、后期、末期</b>四个时期。',
  why:`<b>以高等植物细胞为例：</b>
<table class="tb"><tr><th>时期</th><th>主要变化</th><th>识图标志</th></tr>
<tr><td><b>分裂间期</b></td><td>完成 <b>DNA 分子的复制</b>和<b>有关蛋白质的合成</b>，细胞适度生长</td><td>有核膜、核仁，染色质呈细丝状</td></tr>
<tr><td><b>前期</b></td><td>染色质丝<b>螺旋缠绕，缩短变粗，成为染色体</b>，每条染色体包括两条并列的<b>姐妹染色单体</b>，由一个共同的<b>着丝粒</b>连接；<b>核仁逐渐解体，核膜逐渐消失</b>；从细胞两极发出纺锤丝，形成梭形的<b>纺锤体</b></td><td>染色体<b>散乱</b>分布</td></tr>
<tr><td><b>中期</b></td><td>每条染色体的着丝粒两侧都有纺锤丝附着，纺锤丝牵引染色体运动，使每条染色体的<b>着丝粒排列在赤道板上</b></td><td>着丝粒排成一条线；<b>染色体形态稳定、数目清晰</b>，是观察和计数的最佳时期</td></tr>
<tr><td><b>后期</b></td><td>每个<b>着丝粒分裂成两个</b>，姐妹染色单体分开，成为两条染色体，由纺锤丝牵引分别向细胞两极移动。细胞两极各有一套染色体，形态和数目完全相同</td><td>染色体<b>数目加倍</b>，移向两极</td></tr>
<tr><td><b>末期</b></td><td>染色体逐渐变成细长盘曲的染色质丝；纺锤丝逐渐消失；出现新的<b>核膜和核仁</b>，形成两个新的细胞核；在赤道板位置出现<b>细胞板</b>，逐渐扩展形成新的细胞壁</td><td>两个核，细胞板</td></tr></table>
<b>记忆口诀：</b>“间期复制加合成；前期膜仁消失现两体（染色体、纺锤体）；中期形定数清赤道齐；后期点裂数增均两极；末期两消（染色体、纺锤体）两现（核膜、核仁）重开始。”
<b>赤道板 ≠ 细胞板：</b><b>赤道板</b>是与纺锤体中轴相垂直的细胞中央平面，类似地球赤道的位置，是一个<b>假想的平面</b>，不是真实结构；<b>细胞板</b>是植物细胞末期在赤道板位置出现的<b>真实结构</b>，扩展形成细胞壁（与<b>高尔基体</b>有关）。
<b>着丝粒分裂是纺锤丝拉开的吗？</b>不是。着丝粒分裂是自主进行的，纺锤丝只负责牵引染色体移动。用秋水仙素抑制纺锤体形成，着丝粒照样分裂，结果染色体加倍但细胞不分裂。`,
  exam:'识图判断时期；描述某时期特点；“观察染色体最佳时期”——中期；“染色体数目加倍”——后期；“DNA 加倍”——间期。'},
 {t:'染色体、DNA、染色单体的数量变化',lv:3,k:['2N','4N','染色单体','曲线'],
  core:'以体细胞染色体数为 2N 为例：染色体数只在<b>后期加倍</b>（4N），末期结束恢复 2N；核 DNA 数在<b>间期加倍</b>（2N → 4N），末期结束恢复 2N；染色单体在<b>间期形成</b>（0 → 4N），<b>后期消失</b>（变为 0）。',
  why:`<div class="tbw"><table class="tb"><tr><th>时期</th><th>染色体</th><th>核 DNA</th><th>染色单体</th><th>染色体∶DNA∶染色单体</th></tr>
<tr><td>间期</td><td>2N</td><td>2N → 4N</td><td>0 → 4N</td><td>—</td></tr>
<tr><td>前期</td><td>2N</td><td>4N</td><td>4N</td><td>1∶2∶2</td></tr>
<tr><td>中期</td><td>2N</td><td>4N</td><td>4N</td><td>1∶2∶2</td></tr>
<tr><td>后期</td><td>4N</td><td>4N</td><td>0</td><td>1∶1∶0</td></tr>
<tr><td>末期（结束后每个子细胞）</td><td>2N</td><td>2N</td><td>0</td><td>1∶1∶0</td></tr></table></div>
<b>判断规律：</b>
<ul><li>有染色单体时：DNA 数 = 染色单体数 = 2 × 染色体数（前期、中期）；</li>
<li>没有染色单体时：DNA 数 = 染色体数（后期、末期）。</li></ul>
<b>曲线画法：</b>
<ul><li>DNA 曲线：间期是<b>斜线</b>上升（复制需要时间），末期<b>垂直</b>下降；</li>
<li>染色体曲线：后期开始时<b>垂直</b>上升（着丝粒瞬间分裂），末期<b>垂直</b>下降。</li></ul>
<b>例：</b>洋葱根尖细胞有 16 条染色体（8 对）。中期：染色体 16、染色单体 32、DNA 32；后期：染色体 32、染色单体 0、DNA 32。间期 DNA 复制后染色体<b>仍是 16 条</b>（不是 32 条）。`,
  exam:'“DNA、染色体和染色单体三者数量比是 2∶1∶2 的时期”——前期和中期。画曲线题。'},
 {t:'动物细胞与植物细胞有丝分裂的区别；意义',lv:3,k:['中心体','星射线','纺锤丝','细胞板','缢裂','遗传的稳定性'],
  core:'不同点：① <b>前期纺锤体的形成方式</b>不同；② <b>末期细胞质的分裂方式</b>不同。有丝分裂的重要意义是将亲代细胞复制后的染色体<b>精确地平均分配</b>到两个子细胞中，在亲代和子代之间保持了<b>遗传的稳定性</b>。',
  why:`<table class="tb"><tr><th></th><th>高等植物细胞</th><th>动物细胞</th></tr>
<tr><td>间期</td><td>无中心体复制</td><td><b>中心粒倍增</b>，成为两组</td></tr>
<tr><td>前期：纺锤体形成</td><td>从细胞两极直接发出<b>纺锤丝</b>形成纺锤体</td><td>两组中心粒分别移向细胞两极，周围发出大量放射状的<b>星射线</b>，两组中心粒之间的星射线形成纺锤体</td></tr>
<tr><td>末期：细胞质分裂</td><td>赤道板位置出现<b>细胞板</b>，扩展形成新的细胞壁</td><td>不形成细胞板，<b>细胞膜从中部向内凹陷</b>，最后把细胞<b>缢裂</b>成两部分</td></tr></table>
<b>相同点：</b>染色体的行为变化、染色体和 DNA 数量的变化规律完全相同。
<b>与有丝分裂有关的细胞器：</b>
<ul><li>核糖体：间期合成蛋白质；</li><li>线粒体：全程供能；</li><li>中心体：动物和低等植物，前期形成纺锤体；</li><li>高尔基体：植物末期形成细胞壁。</li></ul>
<b>意义的关键是 DNA：</b>染色体上有遗传物质 DNA，有丝分裂把复制后的 DNA 精确平分，所以子细胞与亲代细胞遗传物质相同。
<b>细胞分裂的调控与癌细胞：</b>正常细胞的分裂受机体精确调控，人的一生中体细胞一般能分裂 50～60 次。有的细胞受到致癌因子作用，遗传物质发生变化，变成不受机体控制的、连续进行分裂的恶性增殖细胞，即<b>癌细胞</b>。`,
  exam:'“区分动植物细胞有丝分裂最可靠的依据”——末期细胞质分裂方式（因为低等植物也有中心体）。'},
 {t:'实验：观察根尖分生区组织细胞的有丝分裂',lv:3,k:['解离','漂洗','染色','制片','甲紫溶液','醋酸洋红液','分生区'],
  core:'<span class="chain">洋葱根尖培养 → 解离 → 漂洗 → 染色 → 制片 → 观察（先低倍找分生区，再高倍）</span>',
  why:`<b>原理：</b>高等植物根尖、芽尖等分生区细胞有丝分裂旺盛；各细胞的分裂是<b>独立进行</b>的，所以同一分生组织中可以看到处于不同时期的细胞；染色体容易被<b>碱性染料</b>着色。
<div class="tbw"><table class="tb"><tr><th>步骤</th><th>方法</th><th>时间</th><th>目的</th></tr>
<tr><td>解离</td><td>上午 10 时至下午 2 时剪取根尖 2～3 mm，放入<b>质量分数 15% 盐酸和体积分数 95% 酒精（1∶1）</b>混合液中</td><td>3～5 min</td><td>用药液使组织中的细胞<b>相互分离</b>开来</td></tr>
<tr><td>漂洗</td><td>根尖软化后放入清水</td><td>约 10 min</td><td><b>洗去药液，防止解离过度</b>；同时防止盐酸影响染色（碱性染料）</td></tr>
<tr><td>染色</td><td>0.01 g/mL 或 0.02 g/mL <b>甲紫溶液</b>（旧称龙胆紫）或<b>醋酸洋红液</b></td><td>3～5 min</td><td>使<b>染色体着色</b></td></tr>
<tr><td>制片</td><td>加一滴清水，用镊子尖把根尖弄碎，盖上盖玻片，再用<b>拇指轻轻按压</b>盖玻片</td><td>—</td><td>使细胞<b>分散</b>开来，有利于观察</td></tr></table></div>
<b>为什么选上午 10 时至下午 2 时取材？</b>此时洋葱根尖分生区有较多的细胞处于分裂期。
<b>为什么只剪 2～3 mm？</b>分生区在根尖顶端（根冠之后），剪多了会混入伸长区、成熟区的细胞。
<b>观察顺序：</b>低倍镜扫视整个装片，找到<b>分生区</b>细胞（<b>呈正方形，排列紧密</b>）；换高倍镜，先找中期，再找前期、后期、末期，最后观察间期。
<b>现象与分析：</b>
<ul><li>视野中处于<b>分裂间期的细胞最多</b>，因为间期在细胞周期中所占时间最长。</li>
<li>某时期细胞数占计数细胞总数的比例 ≈ 该时期占细胞周期的时间比例。例如洋葱根尖细胞周期约 12 h，若 50 个细胞中有 5 个处于中期，则中期约 12 × 5/50 = 1.2 h。</li>
<li><b>看不到一个细胞连续分裂的动态过程</b>：解离时细胞已经被杀死，固定在不同时期。要看到各时期，需要移动装片寻找。</li></ul>
<b>常见错误分析：</b>细胞重叠（解离不充分或没有压片）；染色很浅（漂洗不彻底，盐酸残留）；看不到分裂期细胞（取材部位不对，或取材时间不对）；细胞呈长方形（找到的是伸长区）。
<b>其他材料：</b>马蛔虫受精卵的有丝分裂固定装片（动物细胞）。`,
  exam:'超高频实验：步骤顺序、各步目的、试剂名称、“解离后细胞已死亡”、视野中间期最多的原因、时间计算。'},
 {t:'无丝分裂',lv:1,k:['蛙的红细胞'],
  core:'细胞无丝分裂的过程一般是：细胞核先延长，核的中部向内凹陷，缢裂成两个细胞核；接着整个细胞从中部缢裂成两部分。因为在分裂过程中<b>没有出现纺锤丝和染色体的变化</b>，所以叫无丝分裂，如<b>蛙的红细胞</b>的无丝分裂。',
  why:'无丝分裂过程比较简单，但仍有 DNA 的复制和分配（只是不像有丝分裂那样精确平均）。注意<b>蛙的红细胞</b>进行无丝分裂，而<b>人的成熟红细胞</b>没有细胞核，不能分裂。原核细胞（如细菌）的分裂方式是二分裂，不属于无丝分裂。',
  exam:'“无丝分裂过程中没有 DNA 复制”（错）；“蛙的红细胞进行有丝分裂”（错）。'}],
 traps:['“DNA 复制后染色体数目加倍”错：染色体数在后期才加倍。','“赤道板是真实存在的结构”错：细胞板才是。','“观察根尖有丝分裂时能看到一个细胞连续分裂的过程”错：细胞已死亡。','“动物细胞有丝分裂末期形成细胞板”错。','“所有细胞都有细胞周期”错：只有连续分裂的细胞才有。','“着丝粒分裂是纺锤丝牵拉的结果”错。']},

{id:'6-2',t:'细胞的分化',
 goal:'理解细胞分化的概念、特点、实质和意义；能用“基因的选择性表达”解释同一个体中细胞的多样性；理解细胞全能性的概念、原因和实例，能区分植物细胞全能性和动物细胞核全能性；了解干细胞及其应用。',
 focus:[[3,'细胞分化的实质：基因的选择性表达'],[3,'细胞全能性的判断（起点和终点）'],[2,'细胞分化的特点和意义'],[2,'判断细胞是否分化的依据（奢侈基因与管家基因）'],[2,'干细胞的类型与应用']],
 models:['diff'],
 pts:[
 {t:'细胞分化的概念、特点与意义',lv:3,k:['稳定性差异','持久性','普遍性','专门化'],
  core:'在个体发育中，由一个或一种细胞增殖产生的后代，在<b>形态、结构和生理功能</b>上发生<b>稳定性差异</b>的过程，叫作<b>细胞分化</b>。',
  why:`<b>特点：</b>
<ul><li><b>持久性</b>：细胞分化是一种持久性的变化，一般来说，分化的细胞将一直保持分化后的状态，直到死亡；</li>
<li><b>稳定性</b>：一般不可逆（自然条件下）；</li>
<li><b>普遍性</b>：是生物界普遍存在的生命现象。</li></ul>
<b>意义：</b>
<ul><li>是生物个体发育的<b>基础</b>。多细胞生物如果只有细胞增殖而没有细胞分化，就不可能形成具有特定形态、结构和功能的组织和器官；</li>
<li>使多细胞生物体中的细胞<b>趋向专门化</b>，有利于提高生物体各种生理功能的<b>效率</b>。</li></ul>
<b>类比：</b>就像现代社会的职业分工。如果每个人什么都做，效率很低；分工后，每个人专精一项，社会运转效率大大提高。
<b>实例：</b>人体四种组织的细胞（上皮细胞、骨骼肌细胞、软骨细胞、神经细胞）都源自早期胚胎中一群彼此相似的细胞，正常情况下不能恢复成早期胚胎细胞，一种组织的细胞也不会转变成其他组织的细胞。植物的叶肉细胞（有大量叶绿体）、表皮细胞（无叶绿体，有角质层）、储藏细胞（储存营养）也都来自早期胚细胞。
<b>分化 vs 增殖：</b>细胞增殖使细胞<b>数目</b>增多；细胞分化使细胞<b>种类</b>增多。`,
  exam:'“细胞分化使细胞数目增多”（错）；“细胞分化是可逆的”（一般不可逆）。'},
 {t:'细胞分化的实质：基因的选择性表达',lv:3,k:['基因的选择性表达','遗传信息相同','mRNA','蛋白质'],
  core:'就一个个体来说，各种细胞具有<b>完全相同的遗传信息</b>，但形态、结构和功能却有很大差异，这是细胞中的<b>基因选择性表达</b>的结果，即在个体发育过程中，不同种类的细胞中遗传信息的表达情况不同。',
  why:`<b>例：</b>在红细胞中，与<b>血红蛋白</b>合成有关的基因处于活动状态，与<b>抗体</b>合成有关的基因则处于关闭状态；在 B 细胞（一种免疫细胞）中则相反。
<b>分化前后什么变了、什么没变？</b>
<table class="tb"><tr><th>不变</th><th>改变</th></tr>
<tr><td>遗传物质（DNA、基因）</td><td>mRNA 的种类和数量</td></tr>
<tr><td>染色体数目</td><td>蛋白质的种类和数量</td></tr>
<tr><td></td><td>细胞的形态、结构和功能</td></tr></table>
<b>怎样判断细胞是否已经分化？</b>
<ul><li>所有细胞都要表达的基因（“管家基因”）：呼吸酶基因、ATP 合成酶基因、核糖体蛋白基因。合成了这些蛋白质<b>不能</b>说明细胞已分化。</li>
<li>只在特定细胞中表达的基因（“奢侈基因”）：血红蛋白基因、胰岛素基因、抗体基因、肌动蛋白基因。合成了<b>血红蛋白、胰岛素、抗体</b>等，说明细胞<b>已经分化</b>。</li></ul>
<b>教材习题：</b>骨髓干细胞植入胰腺组织后分化为“胰岛样”细胞。骨髓干细胞与胰岛 B 细胞的<b>基因组成相同</b>（同一个人），<b>基因表达情况不同</b>。`,
  exam:'“不同细胞形态功能不同是因为基因不同”（错）；“能说明细胞已经分化的是”——合成血红蛋白（不是合成 ATP、呼吸酶）。'},
 {t:'细胞的全能性',lv:3,k:['全能性','全套遗传信息','植物组织培养','核移植','克隆'],
  core:'细胞经分裂和分化后，仍具有<b>产生完整有机体或分化成其他各种细胞</b>的潜能和特性，叫作<b>细胞的全能性</b>。高度分化的<b>植物细胞</b>仍然具有全能性；已分化的<b>动物体细胞的细胞核</b>具有全能性。',
  why:`<b>为什么具有全能性？</b>细胞中含有本物种全套的遗传信息（全部基因）。
<b>植物：</b>1958 年斯图尔德取<b>胡萝卜韧皮部</b>细胞，放入含植物激素、无机盐和糖类等的培养液中培养，细胞旺盛分裂形成细胞团，继而分化出根、茎和叶，移栽后长成新植株。这就是<b>植物组织培养</b>。应用：快速繁殖花卉和蔬菜、培养微型观赏植株、拯救濒危物种。与传统杂交相比，组织培养能保持亲本优良性状、繁殖速度快、不受季节限制。
<b>动物：</b>同植物相比，在动物中做类似实验要复杂和困难得多。
<ul><li>非洲爪蟾：将蝌蚪的<b>肠上皮细胞的核</b>移植到去核的卵细胞中，获得新个体；</li>
<li>1996 年克隆羊“<b>多莉</b>”；2017 年我国体细胞克隆猴“<b>中中</b>”和“<b>华华</b>”。</li></ul>
这些都是把体细胞核移植到去核卵细胞中培育成的，说明已分化的动物体细胞的<b>细胞核</b>具有全能性。但到目前为止，人们还<b>没有</b>成功地将单个已分化的动物体细胞培养成新个体。
<b>为什么需要卵细胞的细胞质？</b>卵细胞质中含有能“唤醒”体细胞核、启动发育程序的物质。
<b>全能性大小：</b>受精卵 ＞ 早期胚胎细胞 ＞ 生殖细胞 ＞ 体细胞；分化程度越高，表现出来的全能性越弱（一般规律）；植物细胞 ＞ 动物细胞。受精卵没有分化，但全能性<b>最高</b>。
<b>判断“是否体现全能性”的方法：</b>看<b>起点</b>是不是一个已分化的细胞（或细胞核），<b>终点</b>是不是完整个体（或分化成各种细胞）。
<ul><li>种子萌发长成植株：<b>不体现</b>（种子已经是幼体，起点不是单个细胞）；</li>
<li>造血干细胞分化成各种血细胞：<b>不体现</b>细胞全能性（没有形成完整个体，体现的是干细胞的分化能力）；</li>
<li>花粉（生殖细胞）培育成单倍体植株：<b>体现</b>。</li></ul>`,
  exam:'判断哪个实例体现了细胞全能性，几乎必考。“受精卵没有分化，所以没有全能性”（错）。'},
 {t:'干细胞',lv:2,k:['干细胞','造血干细胞','脐带血','骨髓移植','中华骨髓库'],
  core:'动物和人体内仍保留着少数具有<b>分裂和分化能力</b>的细胞，这些细胞叫作<b>干细胞</b>。人的骨髓中有许多<b>造血干细胞</b>，能够通过增殖和分化，不断产生红细胞、白细胞和血小板，补充到血液中去。',
  why:`<b>为什么健康人的血细胞数量不会随着死亡而减少？</b>红细胞寿命约 120 d，白细胞 5～7 d，它们都已失去分裂能力。骨髓中的造血干细胞不断增殖分化，补充新的血细胞。
<b>白血病与骨髓移植：</b>白血病是一类由骨髓造血干细胞恶性增殖引起的疾病。将健康人的骨髓（含造血干细胞）移植到患者体内可以治疗。
<ul><li>移植需要 <b>HLA（人类白细胞抗原）配型</b>相同，否则会发生排斥反应；</li>
<li>捐献造血干细胞不会影响自身健康：造血干细胞增殖能力很强，捐献后一两周内血细胞就能恢复到原来的水平；</li>
<li>我国 2001 年成立了<b>中华骨髓库</b>，截至 2018 年 3 月入库志愿者超过 242 万人份，捐献人数突破 6 000 例。</li></ul>
<b>脐带血</b>中含有大量干细胞，可以培养并分化成人体的各种血细胞，用于治疗血液系统疾病。
<b>干细胞研究的意义与风险：</b>如果能在体外培养干细胞使之形成组织或器官，就可以修复或更换损伤的组织器官。但任务艰巨、难度极大，也有过惨痛教训，需要正确看待科学、技术和社会的关系。`,
  exam:'“造血干细胞分化成红细胞体现了细胞全能性”（错）。'}],
 traps:['“细胞分化导致遗传物质改变”错。','“分化程度越高，全能性越强”错：越弱。','“已分化的动物体细胞具有全能性”不准确：是细胞核具有全能性。','“种子萌发成植株体现了细胞全能性”错。','“合成 ATP 的细胞一定发生了分化”错。']},

{id:'6-3',t:'细胞的衰老和死亡',
 goal:'掌握衰老细胞的特征，能用两种学说解释细胞衰老的原因；理解细胞衰老与个体衰老的关系；能区分细胞凋亡与细胞坏死，理解细胞凋亡的意义；了解细胞自噬。',
 focus:[[3,'衰老细胞的特征'],[3,'细胞凋亡与细胞坏死的区别及实例判断'],[2,'自由基学说和端粒学说'],[2,'细胞衰老与个体衰老的关系'],[2,'细胞自噬']],
 models:['aging'],
 pts:[
 {t:'衰老细胞的特征',lv:3,k:['水分减少','酶活性降低','色素积累','细胞核体积增大','膜通透性改变'],
  core:'细胞衰老的过程是细胞的生理状态和化学反应发生复杂变化的过程，最终表现为细胞的形态、结构和功能发生变化。',
  why:`<b>五大特征（可记“一小一大一多一低一变”）：</b>
<table class="tb"><tr><th>特征</th><th>具体表现</th><th>生活中的现象</th></tr>
<tr><td>水分<b>减少</b></td><td>细胞萎缩，体积变小</td><td>老年人皮肤干燥、出现皱纹</td></tr>
<tr><td>多种酶的活性<b>降低</b></td><td>呼吸速率减慢，新陈代谢速率减慢</td><td>毛囊中黑色素细胞的<b>酪氨酸酶</b>活性降低，黑色素合成减少，头发变白</td></tr>
<tr><td>色素逐渐<b>积累</b></td><td>妨碍细胞内物质的交流和传递</td><td>“<b>老年斑</b>”</td></tr>
<tr><td>细胞核体积<b>增大</b></td><td>核膜内折，染色质收缩、染色加深</td><td>—</td></tr>
<tr><td>细胞膜通透性<b>改变</b></td><td>物质运输功能降低</td><td>—</td></tr></table>
<b>注意两个“反直觉”：</b>细胞体积<b>变小</b>，但细胞核体积<b>增大</b>。
<b>老年人白发 vs 白化病：</b>老年人白发是酪氨酸酶<b>活性降低</b>；白化病是缺少酪氨酸酶（基因突变），两者原因不同。`,
  exam:'“下列不是细胞衰老特征的是”：细胞核体积变小、新陈代谢速率加快、细胞不能继续分化（细胞不能继续分化不是衰老特征）。'},
 {t:'细胞衰老的原因：自由基学说与端粒学说',lv:2,k:['自由基','雪崩式反应','端粒','DNA—蛋白质复合体'],
  core:'目前为大家普遍接受的是<b>自由基学说</b>和<b>端粒学说</b>。',
  why:`<b>自由基学说：</b>
<ul><li><b>自由基</b>：具有不成对电子的原子或基团，表现出高度的反应活泼性。</li>
<li><b>来源</b>：细胞内各种氧化反应；辐射、有害物质入侵也会刺激细胞产生自由基（如水在电离辐射下产生自由基）。</li>
<li><b>危害</b>：攻击和破坏细胞内各种执行正常功能的生物分子。
 <ul><li>攻击<b>磷脂</b>分子时，产物同样是自由基，新产生的自由基又去攻击别的分子，引发<b>雪崩式</b>的反应，对生物膜损伤比较大；</li>
 <li>攻击 <b>DNA</b>，可能引起基因突变；</li>
 <li>攻击<b>蛋白质</b>，使蛋白质活性下降，导致细胞衰老。</li></ul></li></ul>
<b>端粒学说：</b>
<ul><li><b>端粒</b>：每条染色体的两端都有一段特殊序列的 <b>DNA—蛋白质复合体</b>。</li>
<li>端粒 DNA 序列在<b>每次细胞分裂后会缩短一截</b>。随着分裂次数增加，截短的部分逐渐向内延伸，端粒内侧正常基因的 DNA 序列就会受到损伤，使细胞活动渐趋异常。</li>
<li>这解释了为什么体外培养的人体细胞最多分裂约 50 次就停止分裂。</li></ul>
<b>年龄与细胞衰老的实验（教材思考·讨论）：</b>
<ul><li>实验 1：相同条件下培养胎儿、中年人、老年人的肺成纤维细胞，增殖代数分别为 50、20、2～4 → 细胞会随着分裂次数的增多而衰老；</li>
<li>实验 2：年轻人细胞质 + 老年人细胞核 → 不分裂；老年人细胞质 + 年轻人细胞核 → 分裂旺盛 → <b>细胞核</b>对细胞分裂的影响更大。</li></ul>`,
  exam:'“端粒受损可能会导致细胞衰老”（对）。'},
 {t:'细胞衰老与个体衰老',lv:2,k:['单细胞生物','多细胞生物','普遍衰老','老龄化'],
  core:'对于<b>单细胞生物</b>来说，细胞的衰老或死亡就是个体的衰老或死亡；对<b>多细胞生物</b>来说，细胞的衰老和死亡与个体的衰老和死亡<b>并不是一回事</b>，但从总体上看，个体衰老的过程也是组成个体的<b>细胞普遍衰老</b>的过程。',
  why:`<b>老年人体内有幼嫩的细胞吗？</b>有，如造血干细胞、皮肤生发层细胞。<b>年轻人体内有衰老的细胞吗？</b>有，如衰老的红细胞、皮肤表层角质细胞。多细胞生物体内的细胞总是在不断更新。
<b>细胞衰老是正常的生命现象：</b>正常的细胞衰老有利于机体更好地实现自我更新。例如人体皮肤生发层细胞不断分裂产生新细胞替代衰老的细胞；血液中的红细胞快速更新，保障氧气供应。但机体中众多细胞和组织的衰老就会引起人的衰老，出现免疫力下降、适应环境能力减弱等现象。老年人骨折后愈合得慢，与成骨细胞衰老有关。
<b>社会视角：</b>2015 年我国 65 岁及以上人口占总人口的 10.47%，已正式进入老龄化社会，需要关爱老年人。`,
  exam:'“衰老的生物体中，细胞都处于衰老状态”（错）。'},
 {t:'细胞凋亡与细胞坏死',lv:3,k:['细胞凋亡','程序性死亡','细胞坏死','蝌蚪尾','手指'],
  core:'<b>细胞凋亡</b>：由<b>基因所决定</b>的细胞<b>自动结束生命</b>的过程，是一种<b>程序性死亡</b>。<b>细胞坏死</b>：在种种<b>不利因素</b>影响下（如极端的物理、化学因素或严重的病理性刺激），由细胞正常代谢活动<b>受损或中断</b>引起的细胞损伤和死亡。',
  why:`<b>“凋亡”一词</b>源自古希腊语，意思是花瓣或树叶的脱落、凋零，强调细胞凋亡是一种<b>自然的生理过程</b>。
<b>细胞凋亡的实例：</b>
<ul><li><b>个体发育中</b>：人胚胎时期有尾的阶段，后来尾部细胞自动死亡，尾才消失；蝌蚪尾的消失；胎儿手指之间的细胞自动死亡，才发育为成形的手指；脊椎动物神经系统发育过程中约 50% 的细胞凋亡；鸡爪趾间蹼的消失。</li>
<li><b>成熟个体中</b>：细胞的<b>自然更新</b>（健康成人骨髓和肠中每小时约有 10 亿个细胞凋亡）；某些<b>被病原体感染的细胞的清除</b>。</li></ul>
<b>细胞凋亡的意义：</b>对于多细胞生物体<b>完成正常发育</b>、<b>维持内部环境的稳定</b>、以及<b>抵御外界各种因素的干扰</b>都起着非常关键的作用。
<table class="tb"><tr><th></th><th>细胞凋亡</th><th>细胞坏死</th></tr>
<tr><td>原因</td><td>基因决定，受严格的遗传机制程序性调控</td><td>不利因素（烫伤、缺氧、病理刺激）</td></tr>
<tr><td>性质</td><td>主动的、正常的生理过程</td><td>被动的、病理性的</td></tr>
<tr><td>对机体</td><td><b>有利</b></td><td>有害（常引起炎症）</td></tr>
<tr><td>例子</td><td>蝌蚪尾消失、指间细胞死亡、被感染细胞的清除</td><td>烫伤、冻伤导致的细胞死亡；脑缺氧、心肌缺血导致的细胞死亡</td></tr></table>
细胞死亡包括凋亡和坏死等方式，<b>凋亡是细胞死亡的一种主要方式</b>。所以“细胞死亡是细胞凋亡的同义词”是错的。
<b>鸡爪与鸭掌实验（教材复习题）：</b>把鸭胚胎中预定形成鸭掌的细胞移植到鸡胚胎相应部位，鸡爪长成了鸭掌；反之鸭掌长成了鸡爪。说明蹼的消亡是由<b>细胞自身的基因决定</b>的（凋亡），而不是环境造成的（坏死）。
<b>研究史：</b>秀丽隐杆线虫成虫只有 959 个体细胞，发育过程中有 <b>131</b> 个细胞通过凋亡被去除。布雷内、霍维茨、苏尔斯顿因此分享 2002 年诺贝尔生理学或医学奖。`,
  exam:'判断实例属于凋亡还是坏死，是超高频考点。“被病原体感染的细胞被清除”——凋亡。'},
 {t:'细胞自噬',lv:2,k:['细胞自噬','溶酶体','降解','再利用'],
  core:'在一定条件下，细胞会将<b>受损或功能退化的细胞结构</b>等，通过<b>溶酶体</b>降解后再利用，这就是<b>细胞自噬</b>。通俗地说，就是细胞“吃掉”自身的结构和物质。',
  why:`<b>细胞自噬的作用：</b>
<ul><li>处于<b>营养缺乏</b>条件下的细胞，通过细胞自噬可以获得维持生存所需的<b>物质和能量</b>；</li>
<li>在细胞受到损伤、微生物入侵或细胞衰老时，通过细胞自噬可以<b>清除受损或衰老的细胞器</b>，以及感染的微生物和毒素，从而<b>维持细胞内部环境的稳定</b>；</li>
<li>有些<b>激烈的细胞自噬，可能诱导细胞凋亡</b>。</li></ul>
人类许多疾病的发生可能与细胞自噬发生障碍有关，所以细胞自噬机制的研究对许多疾病的防治有重要意义。
<b>与第 3 章的联系：</b>溶酶体能分解衰老、损伤的细胞器，正是细胞自噬的执行者。`,
  exam:'“细胞自噬对细胞都是有害的”（错）。'},
 {t:'细胞的寿命与分裂能力',lv:1,k:['寿命','分裂能力'],
  core:'人体不同细胞的寿命和分裂能力不同，与它们承担的功能有关。',
  why:`<table class="tb"><tr><th>细胞</th><th>寿命</th><th>能否分裂</th></tr>
<tr><td>小肠上皮细胞</td><td>1～2 d</td><td>能</td></tr>
<tr><td>平滑肌细胞</td><td>很长</td><td>能</td></tr>
<tr><td>心肌细胞</td><td>很长</td><td>不能</td></tr>
<tr><td>神经细胞</td><td>很长</td><td>绝大多数不能</td></tr>
<tr><td>白细胞</td><td>5～7 d</td><td>不能</td></tr></table>
<b>规律：</b>寿命与分裂能力之间<b>没有</b>一一对应关系（寿命短的白细胞不能分裂，寿命长的平滑肌细胞却能分裂）。寿命和分裂能力与功能有关：小肠上皮细胞与食物摩擦、易损伤，需要快速更新；神经细胞、心肌细胞需要长期稳定地发挥功能。
<b>白细胞凋亡的速率比红细胞快得多</b>：白细胞吞噬病菌后很快凋亡被清除，有利于维持内环境稳定，这也说明了细胞凋亡的意义。
<b>推测：</b>皮肤表皮细胞寿命短，生发层细胞能不断分裂。`,
  exam:'数据分析题。'}],
