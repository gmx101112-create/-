<script>/* bio/models.js+bio2/mx1.js+bio2/mx0.js+bio2/mx2.js+bio2/mx3.js+bio2/mx5.js */
/* ---------- 交互模型 ---------- */
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const svg=(vb,inner,cls='')=>`<svg class="msvg ${cls}" viewBox="${vb}" role="img">${inner}</svg>`;
const tx=(x,y,s,c='t',a='middle',sz=12)=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${a}" font-size="${sz}">${s}</text>`;
const segs=(name,opts,cur)=>`<div class="seg" data-seg="${name}">${opts.map(([k,l])=>`<button type="button" data-v="${k}" aria-pressed="${k===cur}">${l}</button>`).join('')}</div>`;
function onSeg(el,name,fn){el.querySelectorAll(`[data-seg="${name}"] button`).forEach(b=>b.onclick=()=>fn(b.dataset.v))}

/* ===== 细胞与细胞器 ===== */
const ORG={
 mem:['细胞膜','单层膜（磷脂双分子层）','所有细胞','系统的边界：将细胞与外界分隔开、控制物质进出、进行细胞间信息交流。'],
 wall:['细胞壁','非膜结构','植物、细菌、真菌','植物细胞壁主要由纤维素和果胶构成，起支持和保护作用；具有全透性。细菌细胞壁成分是肽聚糖。'],
 nuc:['细胞核','双层膜（核膜）','真核细胞','遗传信息库，是细胞代谢和遗传的控制中心。由核膜、核孔、核仁、染色质组成。'],
 nucl:['核仁','无膜','真核细胞的细胞核内','与某种 RNA（rRNA）的合成以及核糖体的形成有关。'],
 mito:['线粒体','双层膜，内膜折叠成嵴','动植物细胞','有氧呼吸的主要场所，“动力车间”。含少量 DNA、RNA 和核糖体。'],
 chl:['叶绿体','双层膜，内有类囊体堆叠成基粒','绿色植物叶肉细胞等','光合作用的场所，“养料制造车间”和“能量转换站”。光合色素位于类囊体薄膜上。'],
 rer:['粗面内质网','单层膜，表面附着核糖体','真核细胞','主要对核糖体合成的蛋白质进行加工、折叠，并通过囊泡运输。'],
 ser:['光面内质网','单层膜，无核糖体附着','真核细胞','脂质合成的“车间”。'],
 golgi:['高尔基体','单层膜，由扁平囊叠成','真核细胞','对来自内质网的蛋白质进行加工、分类和包装的“车间”及“发送站”；植物中与细胞壁形成有关。'],
 lys:['溶酶体','单层膜','主要在动物细胞','含多种水解酶，“消化车间”：分解衰老、损伤的细胞器，吞噬并杀死侵入的病毒或细菌。'],
 vac:['液泡','单层膜（液泡膜）','主要在植物细胞','内有细胞液，含糖类、无机盐、色素和蛋白质等；调节细胞内环境，使植物细胞保持坚挺。'],
 ribo:['核糖体','无膜','原核细胞和真核细胞','“生产蛋白质的机器”，合成蛋白质的场所。附着在内质网上或游离在细胞质基质中。'],
 cent:['中心体','无膜，由两个互相垂直的中心粒组成','动物和某些低等植物','与细胞的有丝分裂有关，前期发出星射线形成纺锤体。'],
 cyto:['细胞质基质','—','所有细胞','细胞质中呈溶胶状的部分，是细胞代谢的主要场所（如有氧呼吸第一阶段）。'],
 vesi:['囊泡','单层膜','真核细胞','在内质网、高尔基体和细胞膜之间运输物质，是“快递包裹”。'],
 nucd:['拟核','无核膜','原核细胞','环状 DNA 集中的区域，没有核膜包被，DNA 不与蛋白质结合形成染色体。'],
 flag:['鞭毛','蛋白质构成','部分细菌','细菌的运动结构。'],
 caps:['荚膜','—','部分细菌','位于细胞壁外，具有保护作用。'],
 pla:['质粒','—','细菌等','细胞质中的小型环状 DNA，常用作基因工程的载体。']};
function cellSvg(kind){
 const o=(k,inner)=>`<g class="og" data-o="${k}" tabindex="0" role="button" aria-label="${ORG[k][0]}">${inner}</g>`;
 const mito=(x,y,r=0,s=1)=>o('mito',`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><ellipse rx="22" ry="11" class="c-mito"/><path d="M-16 0 q4 -8 8 0 t8 0 t8 0 t8 0" class="c-mito-l"/></g>`);
 const lys=(x,y)=>o('lys',`<circle cx="${x}" cy="${y}" r="6" class="c-lys"/><circle cx="${x-1.5}" cy="${y-1}" r="1.2" class="c-lys-d"/><circle cx="${x+2}" cy="${y+1.5}" r="1.2" class="c-lys-d"/>`);
 const ribo=(pts)=>o('ribo',pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.2" class="c-ribo"/>`).join(''));
 const golgi=(x,y,r=0)=>o('golgi',`<g transform="translate(${x} ${y}) rotate(${r})">${[0,7,14,21].map((d,i)=>`<path d="M${-26+i*2} ${d} q${26-i*2} ${-10} ${52-i*4} 0" class="c-golgi"/>`).join('')}<circle cx="30" cy="2" r="3.5" class="c-golgi-v"/><circle cx="-30" cy="18" r="3" class="c-golgi-v"/></g>`);
 const chl=(x,y,r=0)=>o('chl',`<g transform="translate(${x} ${y}) rotate(${r})"><ellipse rx="24" ry="12" class="c-chl"/>${[-12,0,12].map(dx=>`<g>${[-5,-1.5,2,5.5].map(dy=>`<rect x="${dx-4}" y="${dy-1.2}" width="8" height="2.4" rx="1" class="c-chl-g"/>`).join('')}</g>`).join('')}</g>`);
 if(kind==='bac'){
  return svg('0 0 400 260',`
  ${o('caps',`<rect x="38" y="58" width="300" height="144" rx="72" class="c-caps"/>`)}
  ${o('wall',`<rect x="50" y="70" width="276" height="120" rx="60" class="c-wall"/>`)}
  ${o('mem',`<rect x="58" y="78" width="260" height="104" rx="52" class="c-mem"/>`)}
  ${o('cyto',`<rect x="62" y="82" width="252" height="96" rx="48" class="c-cyto"/>`)}
  ${o('nucd',`<path d="M140 120 q15 -25 30 0 t30 0 t30 0 q10 20 -20 18 t-40 6 t-30 -24z" class="c-nucd"/><path d="M150 125 q10 -12 20 0 t20 0 t20 0" class="c-nucd-l"/>`)}
  ${o('pla',`<circle cx="270" cy="150" r="9" class="c-pla"/>`)}
  ${ribo([[100,110],[110,150],[95,135],[250,105],[285,120],[230,160],[120,165],[200,165],[175,98]])}
  ${o('flag',`<path d="M326 130 q20 -20 40 0 t30 -5" class="c-flag"/>`)}
  `)}
 if(kind==='plant'){
  return svg('0 0 400 300',`
  ${o('wall',`<rect x="20" y="18" width="360" height="264" rx="10" class="c-wall"/>`)}
  ${o('mem',`<rect x="30" y="28" width="340" height="244" rx="8" class="c-mem"/>`)}
  ${o('cyto',`<rect x="33" y="31" width="334" height="238" rx="7" class="c-cyto"/>`)}
  ${o('vac',`<path d="M120 70 q80 -30 160 0 q50 30 30 100 q-20 70 -110 60 q-90 -5 -105 -70 q-10 -60 25 -90z" class="c-vac"/>`)}
  ${o('nuc',`<circle cx="72" cy="215" r="30" class="c-nuc"/>`)}${o('nucl',`<circle cx="78" cy="210" r="9" class="c-nucl"/>`)}
  ${o('rer',`<path d="M60 175 q20 -14 45 -4 M58 167 q25 -18 55 -6" class="c-er"/>`)}${ribo([[70,168],[85,163],[100,166],[64,160],[95,157]])}
  ${chl(80,70,-20)}${chl(330,90,70)}${chl(340,220,-30)}${chl(200,255,0)}${chl(140,250,15)}
  ${mito(330,160,90,.8)}${mito(260,252,10,.8)}
  ${golgi(110,128,80)}
  ${o('ser',`<path d="M300 40 q15 10 30 0 t30 0" class="c-er"/>`)}
  `)}
 return svg('0 0 400 300',`
  ${o('mem',`<ellipse cx="200" cy="150" rx="185" ry="135" class="c-mem"/>`)}
  ${o('cyto',`<ellipse cx="200" cy="150" rx="180" ry="130" class="c-cyto"/>`)}
  ${o('rer',`<path d="M140 100 q-30 50 0 100 M128 92 q-38 58 0 118 M117 85 q-45 65 0 132" class="c-er"/>`)}${ribo([[136,112],[131,130],[131,150],[133,170],[138,188],[121,100],[115,125],[114,150],[116,175],[124,200]])}
  ${o('nuc',`<circle cx="185" cy="150" r="44" class="c-nuc"/>`)}${o('nucl',`<circle cx="195" cy="142" r="13" class="c-nucl"/>`)}
  ${o('ser',`<path d="M80 200 q12 -10 24 0 t24 0 M84 212 q12 -10 24 0 t24 0" class="c-er"/>`)}
  ${golgi(285,120,-15)}
  ${o('vesi',`<circle cx="320" cy="150" r="4" class="c-vesi"/><circle cx="335" cy="168" r="4" class="c-vesi"/>`)}
  ${mito(270,215,20)}${mito(110,75,-30)}${mito(320,90,60,.8)}
  ${lys(240,85)}${lys(230,230)}
  ${o('cent',`<rect x="250" y="168" width="18" height="6" rx="2" class="c-cent"/><rect x="262" y="160" width="6" height="18" rx="2" class="c-cent"/>`)}
  ${ribo([[80,140],[90,170],[300,190],[220,60],[180,240],[330,210],[60,120]])}
 `);
}
const CELL_LIST={animal:['mem','cyto','nuc','nucl','rer','ser','golgi','mito','lys','cent','ribo','vesi'],plant:['wall','mem','cyto','vac','chl','nuc','nucl','rer','ser','golgi','mito','ribo'],bac:['caps','wall','mem','cyto','nucd','ribo','pla','flag']};
const CELL_NOTE={animal:'动物细胞：没有细胞壁、叶绿体和大液泡，有中心体。',plant:'高等植物细胞：有细胞壁、叶绿体（叶肉细胞）和中央大液泡，没有中心体。',bac:'原核细胞（细菌）：没有以核膜为界限的细胞核，只有核糖体一种细胞器。'};

/* ===== 显微镜 ===== */
/* ===== 模型注册 ===== */
const MODELS={
cell:{t:'细胞与细胞器',sec:'3-2',d:'点选细胞的各个结构，比较动物细胞、植物细胞和细菌。',r(el){
 let kind='animal',sel=null;
 const draw=()=>{el.innerHTML=`${segs('k',[['animal','动物细胞'],['plant','植物细胞'],['bac','细菌（原核）']],kind)}
  <div class="mgrid"><div class="mfig">${cellSvg(kind)}<p class="mcap">${CELL_NOTE[kind]}</p></div>
  <div class="mside"><div class="chips">${CELL_LIST[kind].map(k=>`<button type="button" class="chip ${k===sel?'on':''}" data-pick="${k}">${ORG[k][0]}</button>`).join('')}</div>
  <div class="minfo">${sel?`<h4>${ORG[sel][0]}</h4><dl><dt>结构</dt><dd>${ORG[sel][1]}</dd><dt>分布</dt><dd>${ORG[sel][2]}</dd><dt>功能</dt><dd>${ORG[sel][3]}</dd></dl>`:'<p class="muted">点图中的结构或上面的名称，查看它的结构和功能。</p>'}</div></div></div>`;
  onSeg(el,'k',v=>{kind=v;sel=null;draw()});
  const pick=k=>{sel=k;draw()};
  el.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pick(b.dataset.pick));
  el.querySelectorAll('.og').forEach(g=>{g.onclick=()=>pick(g.dataset.o);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(g.dataset.o)}}});
  if(sel)el.querySelectorAll(`.og[data-o="${sel}"]`).forEach(g=>g.classList.add('on'));
 };draw();}},

scope:{t:'显微镜的放大与成像',sec:'1-2',d:'换目镜和物镜，看视野中细胞的大小和数目怎样变化；理解显微镜成倒像。',r(el){
 let oc=10,ob=10,pos='lu';
 const P={lu:['左上方','左上方'],ru:['右上方','右上方'],ld:['左下方','左下方'],rd:['右下方','右下方']};
 const draw=()=>{const mag=oc*ob,k=mag/100,row=8/k,full=64/(k*k);const cs=34*k;
  const n=Math.ceil(240/cs)+2;let cells='';for(let i=-n;i<=n;i++)for(let j=-n;j<=n;j++){const x=120+i*cs,y=120+j*cs;cells+=`<rect x="${x-cs/2+2}" y="${y-cs/2+2}" width="${cs-4}" height="${cs-4}" rx="${cs*.12}" class="c-scell"/><circle cx="${x}" cy="${y}" r="${cs*.14}" class="c-snuc"/>`}
  const off={lu:[-55,-55],ru:[55,-55],ld:[-55,55],rd:[55,55]}[pos];
  el.innerHTML=`<div class="mgrid"><div class="mfig">${svg('0 0 240 240',`<defs><clipPath id="fov"><circle cx="120" cy="120" r="112"/></clipPath></defs><g clip-path="url(#fov)"><rect width="240" height="240" class="c-fov"/>${cells}<rect width="240" height="240" class="c-dark" style="opacity:${Math.min(.55,(k-1)*.07)}"/></g><circle cx="120" cy="120" r="112" class="c-ring"/>`)}
   <p class="mcap">放大倍数 = ${oc} × ${ob} = <b>${mag}</b> 倍（指长度或宽度）</p></div>
  <div class="mside"><p class="lbl">目镜</p>${segs('oc',[[5,'5×'],[10,'10×'],[16,'16×']].map(([a,b])=>[String(a),b]),String(oc))}
   <p class="lbl">物镜</p>${segs('ob',[[10,'10×'],[40,'40×']].map(([a,b])=>[String(a),b]),String(ob))}
   <div class="minfo"><dl><dt>与 100 倍相比</dt><dd>放大到 ${k} 倍（长度）</dd><dt>一行细胞</dt><dd>原来 8 个 → 现在约 <b>${row%1?row.toFixed(1):row}</b> 个（除以 ${k}）</dd><dt>充满视野</dt><dd>原来 64 个 → 现在约 <b>${full%1?full.toFixed(1):full}</b> 个（除以 ${k}²）</dd><dt>视野亮度</dt><dd>${k>1?'变暗，需要调大光圈或用凹面镜':k<1?'变亮':'适中'}</dd></dl></div>
   <p class="lbl">倒像练习：物像位于视野的</p>${segs('pos',Object.entries(P).map(([a,b])=>[a,b[0]]),pos)}
   <div class="minfo inv">${svg('0 0 120 80',`<circle cx="60" cy="40" r="36" class="c-fov"/><circle cx="60" cy="40" r="36" class="c-ring"/><circle cx="${60+off[0]*.45}" cy="${40+off[1]*.45}" r="6" class="c-hit"/><line x1="60" y1="40" x2="${60+off[0]*.45}" y2="${40+off[1]*.45}" class="c-arrow"/>`,'mini')}<p>要把物像移到视野中央，装片应向<b>${P[pos][1]}</b>移动（“偏哪移哪”）。实际物体位于装片的${{lu:'右下方',ru:'左下方',ld:'右上方',rd:'左上方'}[pos]}。</p></div></div></div>`;
  onSeg(el,'oc',v=>{oc=+v;draw()});onSeg(el,'ob',v=>{ob=+v;draw()});onSeg(el,'pos',v=>{pos=v;draw()});
 };draw();}},

tests:{t:'有机物的检测',sec:'2-1',d:'点“加入试剂”，看四种检测反应的颜色变化和操作要点。',r(el){
 const T=[['还原糖','斐林试剂','#5b8fd6','#b5492d','50～65 ℃ 水浴加热约 2 min','砖红色沉淀','甲乙液等量混合，现配现用'],
  ['脂肪','苏丹Ⅲ染液','#f2f0e8','#e8941c','用体积分数 50% 酒精洗去浮色','橘黄色','花生子叶切片需显微镜观察'],
  ['蛋白质','双缩脲试剂','#eef1ee','#7a3fa8','不需要加热','紫色','先加 A 液 1 mL，再加 B 液 4 滴'],
  ['淀粉','碘液','#f4f1e6','#26307a','不需要加热','蓝色','可用于检测淀粉是否被水解']];
 const done=new Set();
 const tube=(c,on)=>svg('0 0 60 140',`<path d="M18 8 h24 v100 a12 12 0 0 1 -24 0z" class="c-glass"/><path d="M19 60 h22 v48 a11 11 0 0 1 -22 0z" style="fill:${c};transition:fill .6s"/>${on&&c==='#b5492d'?'<ellipse cx="30" cy="112" rx="9" ry="4" style="fill:#8a2f18"/>':''}`,'tube');
 const draw=()=>{el.innerHTML=`<div class="tgrid">${T.map((x,i)=>{const on=done.has(i);return `<div class="tcard"><div class="tfig">${tube(on?x[3]:x[2],on)}</div><div><h4>${x[0]}</h4><p class="muted">${x[1]}</p><p>${on?`<b>${x[5]}</b>`:'加入试剂前'}</p><p class="small">${x[4]}；${x[6]}</p><button type="button" class="btn sm" data-i="${i}">${on?'重置':'加入试剂'}</button></div></div>`}).join('')}</div>`;
  el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;done.has(i)?done.delete(i):done.add(i);draw()});};draw();}},

amino:{t:'氨基酸与脱水缩合',sec:'2-4',d:'一步步看两个氨基酸怎样脱水缩合形成二肽，并用计算器练习肽键和分子量的计算。',r(el){
 let st=0;const G=30;
 const A=(c,r,s,cls='')=>`<text x="${c*G}" y="${r*G+5}" text-anchor="middle" class="t chem ${cls}" font-size="15">${s}</text>`;
 const B=(c1,r1,c2,r2,dbl,cls='')=>{const sh=(a,b)=>a+(b-a)*.3,x1=sh(c1*G,c2*G),y1=sh(r1*G,r2*G),x2=sh(c2*G,c1*G),y2=sh(r2*G,r1*G);
  return dbl?`<line x1="${x1-3}" y1="${y1}" x2="${x2-3}" y2="${y2}" class="bond ${cls}"/><line x1="${x1+3}" y1="${y1}" x2="${x2+3}" y2="${y2}" class="bond ${cls}"/>`:`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="bond ${cls}"/>`};
 const aa1=(hl)=>A(1,2,'H₂N')+A(2,2,'C')+A(2,1,'H')+A(2,3,'R₁','rg')+A(3,2,'C')+A(3,1,'O')+A(4,2,'OH',hl?'hl':'')+B(1,2,2,2)+B(2,1,2,2)+B(2,2,2,3)+B(2,2,3,2)+B(3,1,3,2,1)+B(3,2,4,2);
 const aa2=(hl)=>A(6,2,'H',hl?'hl':'')+A(7,2,'N')+A(7,3,'H')+A(8,2,'C')+A(8,1,'H')+A(8,3,'R₂','rg')+A(9.3,2,'COOH')+B(6,2,7,2)+B(7,2,7,3)+B(7,2,8,2)+B(8,1,8,2)+B(8,2,8,3)+B(8,2,9.3,2);
 const steps=[
  ['氨基酸结构通式','每个氨基酸至少有一个氨基（—NH₂）和一个羧基（—COOH），并连在同一个碳原子上；这个碳原子还连着一个 H 和一个 R 基。R 基不同，氨基酸就不同。',
   ()=>A(2,2,'C','ca')+A(1,2,'H₂N','am')+A(3.3,2,'COOH','cx')+A(2,1,'H')+A(2,3,'R','rg')+B(1,2,2,2)+B(2,2,3.3,2)+B(2,1,2,2)+B(2,2,2,3)+`<text x="${1*G}" y="${3.9*G}" class="tm" font-size="11" text-anchor="middle">氨基</text><text x="${3.3*G}" y="${3.9*G}" class="tm" font-size="11" text-anchor="middle">羧基</text><text x="${2*G}" y="${4.5*G}" class="tm" font-size="11" text-anchor="middle">R 基（侧链）</text>`,'0 0 150 150'],
  ['两个氨基酸靠近','一个氨基酸的羧基与另一个氨基酸的氨基相互靠近。',()=>aa1()+A(5,2,'+')+aa2(),'0 0 330 120'],
  ['脱去一分子水','羧基中的 —OH 与氨基中的 —H 结合，脱去一分子 H₂O。',()=>aa1(1)+A(5,2,'+')+aa2(1)+`<text x="${5*G}" y="${3.6*G}" class="hl" font-size="13" text-anchor="middle">OH + H → H₂O</text>`,'0 0 330 120'],
  ['形成肽键','剩下的 C 与 N 直接相连，形成肽键（—CO—NH—），两个氨基酸连成二肽。',()=>`<rect x="${2.6*G}" y="${.45*G}" width="${1.8*G}" height="${3*G}" rx="8" class="pep"/>`+A(1,2,'H₂N')+A(2,2,'C')+A(2,1,'H')+A(2,3,'R₁','rg')+A(3,2,'C')+A(3,1,'O')+A(4,2,'N')+A(4,3,'H')+A(5,2,'C')+A(5,1,'H')+A(5,3,'R₂','rg')+A(6.3,2,'COOH')+B(1,2,2,2)+B(2,1,2,2)+B(2,2,2,3)+B(2,2,3,2)+B(3,1,3,2,1)+B(3,2,4,2,0,'pb')+B(4,2,4,3)+B(4,2,5,2)+B(5,1,5,2)+B(5,2,5,3)+B(5,2,6.3,2)+A(8.4,2,'+ H₂O','hl')+`<text x="${3.5*G}" y="${3.95*G}" class="hl" font-size="12" text-anchor="middle">肽键</text>`,'0 0 300 130']];
 let n=51,m=2,a=128,d=3;
 const calc=()=>{const pb=n-m,mw=n*a-18*pb-2*d;return `<dl><dt>肽键数 = 脱水数</dt><dd>${n} − ${m} = <b>${pb}</b></dd><dt>相对分子质量</dt><dd>${n}×${a} − 18×${pb}${d?` − 2×${d}`:''} = <b>${mw}</b></dd><dt>至少游离氨基 / 羧基</dt><dd><b>${m}</b> 个 / <b>${m}</b> 个</dd></dl>`};
 const draw=()=>{const s=steps[st];el.innerHTML=`<div class="stepper">${steps.map((x,i)=>`<button type="button" data-st="${i}" aria-pressed="${i===st}">${i+1}. ${x[0]}</button>`).join('')}</div>
  <div class="mfig wide">${svg(s[3],s[2](),'chemfig')}</div><p class="mcap">${s[1]}</p>
  <div class="calc"><p class="lbl">计算器（以胰岛素为例可填 51 个氨基酸、2 条链、3 个二硫键）</p><div class="inrow">
   <label>氨基酸数 n<input id="am-n" type="number" min="2" max="9999" value="${n}"></label><label>肽链数 m<input id="am-m" type="number" min="1" max="99" value="${m}"></label>
   <label>平均分子量 a<input id="am-a" type="number" min="50" max="300" value="${a}"></label><label>二硫键数<input id="am-d" type="number" min="0" max="99" value="${d}"></label></div><div class="minfo" id="am-out">${calc()}</div></div>`;
  el.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{st=+b.dataset.st;draw()});
  ['n','m','a','d'].forEach(k=>{el.querySelector('#am-'+k).oninput=e=>{const v=Math.max(0,parseInt(e.target.value)||0);if(k==='n')n=Math.max(2,v);if(k==='m')m=Math.max(1,Math.min(v,n-1));if(k==='a')a=v;if(k==='d')d=v;el.querySelector('#am-out').innerHTML=calc()}});
 };draw();}},

nucleo:{t:'核苷酸的结构',sec:'2-5',d:'切换 DNA 和 RNA，比较两种核苷酸的五碳糖和碱基。',r(el){
 let k='dna',b='A';
 const BS={dna:['A','T','G','C'],rna:['A','U','G','C']},BN={A:'腺嘌呤',T:'胸腺嘧啶',U:'尿嘧啶',G:'鸟嘌呤',C:'胞嘧啶'};

  onSeg(el,'k',v=>{k=v;draw()});onSeg(el,'b',v=>{b=v;draw()});};draw();}},

membrane:{t:'流动镶嵌模型',sec:'3-1',d:'磷脂分子在不停地运动。点选各部分查看名称和作用。',r(el){
 let lab=true,sel='bil';
 const I={bil:['磷脂双分子层','膜的基本支架。亲水的“头部”朝外，疏水的“尾部”朝内。'],head:['亲水头部','含磷酸基团，朝向膜两侧的水环境。'],tail:['疏水尾部','由脂肪酸链构成，相互靠拢藏在膜中间。'],
  pt:['贯穿蛋白','贯穿整个磷脂双分子层，如转运蛋白（载体蛋白、通道蛋白）。'],pe:['嵌入蛋白','部分嵌入磷脂双分子层中。'],ps:['表面蛋白','镶在磷脂双分子层表面。'],gly:['糖蛋白（糖被）','糖类与蛋白质结合而成，只分布在细胞膜外侧，与细胞识别、信息传递有关，还有保护和润滑作用。'],gl:['糖脂','糖类与脂质结合而成，也位于膜外侧。']};
 let lip='';for(let i=0;i<26;i++){const x=12+i*15;if(x>118&&x<162||x>232&&x<262)continue;const dl=(i%5)*.37;
  lip+=`<g class="lip" style="animation-delay:-${dl}s"><g class="og" data-o="head"><circle cx="${x}" cy="62" r="6" class="c-head"/><circle cx="${x}" cy="148" r="6" class="c-head"/></g><g class="og" data-o="tail"><path d="M${x-2} 68 q-3 10 0 20 t0 14 M${x+2} 68 q3 10 0 20 t0 14" class="c-tail"/><path d="M${x-2} 142 q-3 -10 0 -20 t0 -14 M${x+2} 142 q3 -10 0 -20 t0 -14" class="c-tail"/></g></g>`}
 const g=(k,inner)=>`<g class="og" data-o="${k}" tabindex="0" role="button">${inner}</g>`;
 const draw=()=>{el.innerHTML=`<div class="mgrid"><div class="mfig">${svg('0 0 400 220',`${tx(8,18,'细胞外',"tm",'start',11)}${tx(8,212,'细胞内（细胞质）','tm','start',11)}
   <rect x="0" y="54" width="400" height="102" class="c-bilbg og" data-o="bil"/>${lip}
   ${g('pt',`<rect x="120" y="44" width="40" height="122" rx="18" class="c-prot"/>`)}${g('pt',`<rect x="232" y="48" width="30" height="114" rx="14" class="c-prot"/>`)}
   ${g('pe',`<ellipse cx="320" cy="78" rx="18" ry="24" class="c-prot2"/>`)}${g('ps',`<ellipse cx="60" cy="168" rx="22" ry="10" class="c-prot2"/>`)}
   ${g('gly',`<path d="M140 44 v-14 l-10 -10 M140 30 l10 -9 l6 -10 M150 21 l8 2" class="c-sugar-l"/><circle cx="130" cy="20" r="3.5" class="c-sug"/><circle cx="156" cy="11" r="3.5" class="c-sug"/><circle cx="158" cy="23" r="3.5" class="c-sug"/>`)}
   ${g('gl',`<path d="M42 56 v-16 l-8 -8 M42 40 l8 -10" class="c-sugar-l"/><circle cx="34" cy="31" r="3.5" class="c-sug"/><circle cx="50" cy="29" r="3.5" class="c-sug"/>`)}
   ${lab?`${tx(140,190,'贯穿蛋白','tm','middle',10)}${tx(320,112,'嵌入蛋白','tm','middle',10)}${tx(60,190,'表面蛋白','tm','middle',10)}${tx(175,14,'糖蛋白','tm','start',10)}${tx(372,62,'头部','tm','middle',10)}${tx(372,106,'尾部','tm','middle',10)}`:''}`)}</div>
  <div class="mside"><div class="chips">${Object.keys(I).map(x=>`<button type="button" class="chip ${x===sel?'on':''}" data-pick="${x}">${I[x][0]}</button>`).join('')}</div>
  <div class="minfo"><h4>${I[sel][0]}</h4><p>${I[sel][1]}</p></div>
  <label class="tog"><input type="checkbox" id="mb-lab" ${lab?'checked':''}> 显示标注</label>
  <p class="small muted">结构特点：一定的流动性 · 功能特性：选择透过性</p></div></div>`;
  el.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{sel=b.dataset.pick;draw()});
  el.querySelectorAll('.og').forEach(x=>x.onclick=()=>{sel=x.dataset.o;draw()});
  el.querySelector('#mb-lab').onchange=e=>{lab=e.target.checked;draw()};
  el.querySelectorAll(`.og[data-o="${sel}"]`).forEach(x=>x.classList.add('on'));};draw();}},

 let st=0;
 const S=[['核糖体',' 在附着于内质网的核糖体上，氨基酸脱水缩合形成肽链。',[118,128]],['粗面内质网','肽链进入内质网腔，进行加工、折叠，形成具有一定空间结构的蛋白质。',[150,120]],['囊泡','内质网“出芽”形成囊泡，包裹蛋白质移向高尔基体。',[200,110]],['高尔基体','囊泡与高尔基体膜融合，蛋白质被进一步修饰加工、分类和包装。',[245,118]],['囊泡','高尔基体形成囊泡，运输蛋白质到细胞膜。',[300,128]],['细胞膜（胞吐）','囊泡与细胞膜融合，把蛋白质分泌到细胞外。整个过程由线粒体供能。',[352,140]]];

   <g class="${st===3?'hlx':''}">${[0,8,16,24].map((d,i)=>`<path d="M${226+i*2} ${100+d} q${20-i*2} -9 ${40-i*4} 0" class="c-golgi"/>`).join('')}</g>
   <ellipse cx="200" cy="190" rx="22" ry="10" class="c-mito"/><path d="M184 190 q4 -6 8 0 t8 0 t8 0 t8 0" class="c-mito-l"/>${tx(200,215,'线粒体供能','tm','middle',10)}
   <path d="M150 120 C 175 100, 220 100, 245 118 S 320 135, 352 140 L 395 140" class="c-path"/>
   ${st>=2?`<circle cx="${st===2?200:300}" cy="${st===2?110:128}" r="8" class="c-vesi2"/>`:''}
   <circle cx="${p[0]}" cy="${p[1]}" r="5" class="c-protdot"/>${st===5?`<circle cx="385" cy="140" r="5" class="c-protdot"/>`:''}
   ${tx(60,180,'细胞核','tm','middle',10)}${tx(122,182,'内质网','tm','middle',10)}${tx(245,160,'高尔基体','tm','middle',10)}${tx(370,15,'细胞膜','tm','middle',10)}`)}</div>
  <p class="mcap"><b>${st+1}. ${S[st][0]}：</b>${S[st][1]}</p>
  <div class="row2"><button type="button" class="btn sm" data-mv="-1" ${st?'':'disabled'}>上一步</button><button type="button" class="btn sm pri" data-mv="1">${st<5?'下一步':'重新开始'}</button></div>
  ${st===5?`<div class="minfo"><p class="lbl">分泌前后膜面积的变化</p>${[['内质网',70,55,'减少'],['高尔基体',50,50,'基本不变'],['细胞膜',60,75,'增加']].map(([n,a,b,c])=>`<div class="bar2"><span>${n}</span><div><i style="width:${a}%" class="b0"></i><i style="width:${b}%" class="b1"></i></div><b>${c}</b></div>`).join('')}<p class="small muted">浅色：分泌前　深色：分泌后（示意）</p></div>`:''}`;
  el.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{st=+b.dataset.st;draw()});

transport:{t:'物质跨膜运输方式',sec:'4-2',d:'切换六种运输方式，观察物质怎样通过细胞膜，比较方向、转运蛋白和能量。',r(el){
 let k='free',raf=0;
 const M={free:['自由扩散','高 → 低','不需要','不需要','O₂、CO₂、甘油、乙醇、苯'],chan:['协助扩散（通道蛋白）','高 → 低','通道蛋白','不需要','水通过水通道蛋白；K⁺ 通过钾离子通道'],car:['协助扩散（载体蛋白）','高 → 低','载体蛋白','不需要','葡萄糖进入红细胞'],act:['主动运输','低 → 高','载体蛋白','需要（ATP）','小肠上皮细胞吸收葡萄糖、氨基酸、无机盐'],endo:['胞吞','膜外 → 膜内','不需要转运蛋白（需膜蛋白识别）','需要','白细胞吞噬病菌、变形虫摄食'],exo:['胞吐','膜内 → 膜外','不需要转运蛋白','需要','分泌蛋白（消化酶、抗体）的分泌']};
 const dots=(n,y0,y1,seed)=>{let s='',r=rng2(seed);for(let i=0;i<n;i++)s+=`<circle cx="${10+r()*380}" cy="${y0+r()*(y1-y0)}" r="4" class="c-sol"/>`;return s};
 const draw=()=>{cancelAnimationFrame(raf);const m=M[k],down=true;let body='';
  const hi=k==='act'?[2,8]:[9,3];// counts outside, inside
  if(k==='endo'||k==='exo'){const ex=k==='exo';body=`<path d="M0 100 h400" class="c-mem2"/><path d="M0 116 h400" class="c-mem2"/>

   <path d="M125 108 h30 M245 108 h30" class="c-arrow" marker-end="url(#ah)"/>`}
  else{body=`${dots(hi[0],10,85,1)}${dots(hi[1],132,205,2)}<rect x="0" y="92" width="400" height="32" class="c-bilbg"/><path d="M0 92 h400 M0 124 h400" class="c-mem2"/>
   ${k==='chan'?`<rect x="180" y="84" width="16" height="48" rx="4" class="c-prot"/><rect x="204" y="84" width="16" height="48" rx="4" class="c-prot"/>`:k==='car'||k==='act'?`<path d="M178 84 h44 v18 l-10 6 v24 h-24 v-24 l-10 -6z" class="c-prot"/>`:''}
   ${k==='act'?`<g transform="translate(250 150)"><rect x="-22" y="-12" width="44" height="24" rx="12" class="c-atp"/>${tx(0,4,'ATP','tw','middle',11)}</g><path d="M240 140 L222 124" class="c-arrow" marker-end="url(#ah)"/>`:''}
   <circle id="mv" cx="200" cy="${down?40:190}" r="5" class="c-sol hi"/>`}
  el.innerHTML=`${segs('k',Object.entries(M).map(([a,b])=>[a,b[0].replace('协助扩散（','协助·').replace('）','')]),k)}

  <div class="mside"><div class="minfo"><h4>${m[0]}</h4><dl><dt>运输方向</dt><dd>${m[1]}</dd><dt>转运蛋白</dt><dd>${m[2]}</dd><dt>消耗能量</dt><dd>${m[3]}</dd><dt>例子</dt><dd>${m[4]}</dd></dl></div>
  ${k==='endo'||k==='exo'?'<p class="small muted">胞吞、胞吐依赖细胞膜的流动性，运输大分子，物质不穿过膜（穿过 0 层膜）。</p>':`<div class="minfo">${rateChart(k)}</div>`}</div></div>`;
  onSeg(el,'k',v=>{k=v;draw()});

 };draw();}},

osmosis:{t:'细胞的吸水和失水',sec:'4-1',d:'拖动滑块改变外界溶液浓度，观察植物细胞的质壁分离与复原，以及红细胞的变化。',r(el){
 let c=0.15,auto=0,tm=0;const sap=0.15;
 const draw=()=>{const d=c-sap,shr=Math.max(0,Math.min(1,d/0.3)),swell=Math.max(0,Math.min(1,-d/0.15));
  const w=200-shr*90,h=150-shr*70,col=`hsl(300 ${45+shr*25}% ${68-shr*28}%)`;
  const state=d>0.02?(c>=0.45?'失水过多，细胞可能死亡，无法复原':'质壁分离：原生质层与细胞壁分离'):d<-0.02?'吸水：原生质层紧贴细胞壁（细胞壁限制，不会涨破）':'水分进出平衡';
  const rbc=d>0.02?`<path d="${starPath(60,60,30-shr*6,8)}" class="c-rbc"/>`:d<-0.02?(swell>.85?`<circle cx="60" cy="60" r="38" class="c-rbc" style="opacity:.35;stroke-dasharray:5 5"/>${tx(60,64,'涨破','t','middle',12)}`:`<circle cx="60" cy="60" r="${30+swell*7}" class="c-rbc"/>`):`<ellipse cx="60" cy="60" rx="32" ry="30" class="c-rbc"/><ellipse cx="60" cy="60" rx="13" ry="12" class="c-rbc2"/>`;
  el.innerHTML=`<div class="mgrid"><div class="mfig">${svg('0 0 300 220',`<rect x="40" y="20" width="220" height="170" rx="8" class="c-wall"/><rect x="${150-w/2}" y="${105-h/2}" width="${w}" height="${h}" rx="${10+shr*20}" class="c-proto"/><rect x="${150-w/2+10}" y="${105-h/2+10}" width="${w-20}" height="${h-20}" rx="${8+shr*18}" style="fill:${col}"/><circle cx="${150-w/2+16}" cy="${105+h/2-16}" r="7" class="c-nuc"/>${tx(150,212,'紫色洋葱鳞片叶外表皮细胞（示意）','tm','middle',11)}`)}</div>
  <div class="mside"><label class="lbl" for="os-c">外界蔗糖溶液浓度：<b>${c.toFixed(2)} g/mL</b>（细胞液约 ${sap} g/mL）</label><input id="os-c" type="range" min="0" max="0.5" step="0.01" value="${c}">
   <div class="row2"><button type="button" class="btn sm" data-p="0">清水</button><button type="button" class="btn sm" data-p="0.3">0.3 g/mL 蔗糖</button><button type="button" class="btn sm" data-p="kno3">KNO₃（自动复原）</button></div>
   <div class="minfo"><h4>${state}</h4><p class="small">液泡${d>0.02?'变小、颜色变深':d<-0.02?'略增大、颜色变浅':'大小不变'}。原生质层（细胞膜、液泡膜及两层膜之间的细胞质）相当于半透膜，细胞壁是全透性的。</p></div>
   <div class="minfo rbcbox">${svg('0 0 120 120',rbc,'mini')}<p class="small"><b>红细胞：</b>${d>0.02?'失水皱缩':d<-0.02?(swell>.85?'吸水过多涨破':'吸水膨胀'):'保持正常形态'}。动物细胞没有细胞壁，不会发生质壁分离。</p></div>
   ${auto?'<p class="small hlt">KNO₃：K⁺ 和 NO₃⁻ 被细胞主动吸收，细胞液浓度升高，细胞吸水，自动复原……</p>':''}</div></div>`;
  el.querySelector('#os-c').oninput=e=>{clearInterval(tm);auto=0;c=+e.target.value;draw();el.querySelector('#os-c').focus()};
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{clearInterval(tm);auto=0;if(b.dataset.p==='kno3'){c=0.3;auto=1;draw();tm=setInterval(()=>{if(!el.isConnected){clearInterval(tm);return}c=Math.max(sap,c-0.01);if(c<=sap){clearInterval(tm);auto=0}draw()},180)}else{c=+b.dataset.p;draw()}});
 };draw();}},

enzyme:{t:'酶：活化能与作用条件',sec:'5-1',d:'比较有无催化剂时的活化能，拖动温度或 pH 观察酶活性的变化。',r(el){
 let cat='enz',mode='t',tv=37,ph=7,ez='amy';
 const EZ={pep:['胃蛋白酶',1.5],amy:['唾液淀粉酶',6.8],try:['胰蛋白酶',8]};
 const draw=()=>{const peak={none:150,inorg:110,enz:60}[cat];
  const curve=`M20 150 C 70 150, 90 ${180-peak*1.45+30}, 140 ${180-peak*1.45+30} S 210 190, 260 190`;
  const top=180-peak*1.45+30;
  const act=mode==='t'?(tv<=37?Math.max(0,tv/37)*(tv<=0?0:1):Math.max(0,1-Math.pow((tv-37)/26,2))):Math.max(0,Math.exp(-Math.pow((ph-EZ[ez][1])/1.6,2)));
  const xs=[];for(let i=0;i<=100;i++){const v=mode==='t'?i:(i/100*14);const a=mode==='t'?(v<=37?v/37:Math.max(0,1-Math.pow((v-37)/26,2))):Math.exp(-Math.pow((v-EZ[ez][1])/1.6,2));xs.push(`${30+i*2.2},${150-a*120}`)}
  const cx=mode==='t'?30+tv*2.2:30+ph/14*220;
  const note=mode==='t'?(tv<=5?'低温：酶活性很低，但空间结构稳定，升温后可恢复。适合保存酶。':tv>=65?'高温：酶的空间结构被破坏，永久失活。':Math.abs(tv-37)<4?'接近最适温度，酶活性最高。':'偏离最适温度，活性降低。'):(Math.abs(ph-EZ[ez][1])<.6?'接近最适 pH，活性最高。':act<.05?'过酸或过碱：空间结构被破坏，永久失活。':'偏离最适 pH，活性降低。');
  el.innerHTML=`<div class="mgrid"><div class="mfig"><p class="lbl">反应过程中的能量变化</p>${svg('0 0 280 210',`<line x1="20" y1="200" x2="270" y2="200" class="axis"/><line x1="20" y1="200" x2="20" y2="10" class="axis"/>${tx(146,209,'反应过程','tm','middle',10)}<text x="10" y="100" class="tm" font-size="10" transform="rotate(-90 10 100)" text-anchor="middle">能量</text>
   <path d="${curve}" class="c-curve"/><line x1="20" y1="150" x2="150" y2="150" class="dash"/><line x1="140" y1="150" x2="140" y2="${top}" class="c-ea" marker-end="url(#ah2)"/>
   ${tx(150,(150+top)/2,'活化能','hl','start',11)}${tx(30,145,'初态','tm','start',10)}${tx(258,185,'终态','tm','end',10)}
   <defs><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" class="c-ahead2"/></marker></defs>`)}
   ${segs('cat',[['none','无催化剂'],['inorg','无机催化剂'],['enz','酶']],cat)}<p class="small muted">酶降低活化能的作用更显著，所以具有高效性。</p></div>
  <div class="mside">${segs('mode',[['t','温度'],['ph','pH']],mode)}
   ${mode==='ph'?segs('ez',Object.entries(EZ).map(([a,b])=>[a,`${b[0]} ${b[1]}`]),ez):''}
   ${svg('0 0 260 175',`<line x1="30" y1="150" x2="252" y2="150" class="axis"/><line x1="30" y1="150" x2="30" y2="20" class="axis"/><polyline points="${xs.join(' ')}" class="c-curve2"/><line x1="${cx}" y1="150" x2="${cx}" y2="${150-act*120}" class="dash2"/><circle cx="${cx}" cy="${150-act*120}" r="5" class="c-hit"/>
    ${mode==='t'?[0,20,40,60,80,100].map(v=>tx(30+v*2.2,165,v,'tm','middle',9)).join('')+tx(252,140,'℃','tm','end',10):[0,2,4,6,8,10,12,14].map(v=>tx(30+v/14*220,165,v,'tm','middle',9)).join('')+tx(252,140,'pH','tm','end',10)}
    <text x="14" y="85" class="tm" font-size="10" transform="rotate(-90 14 85)" text-anchor="middle">酶活性</text>`)}
   ${mode==='t'?`<label class="lbl" for="ez-t">温度 <b>${tv} ℃</b>（以人体内的酶为例）</label><input id="ez-t" type="range" min="0" max="100" value="${tv}">`:`<label class="lbl" for="ez-p">pH <b>${ph}</b></label><input id="ez-p" type="range" min="0" max="14" step="0.5" value="${ph}">`}
   <div class="minfo"><p><b>相对活性 ${Math.round(act*100)}%</b></p><p class="small">${note}</p></div></div></div>`;
  onSeg(el,'cat',v=>{cat=v;draw()});onSeg(el,'mode',v=>{mode=v;draw()});onSeg(el,'ez',v=>{ez=v;draw()});
  const t=el.querySelector('#ez-t');if(t)t.oninput=e=>{tv=+e.target.value;draw();el.querySelector('#ez-t').focus()};
  const p=el.querySelector('#ez-p');if(p)p.oninput=e=>{ph=+e.target.value;draw();el.querySelector('#ez-p').focus()};
 };draw();}},

atp:{t:'ATP 的结构与转化',sec:'5-2',d:'点选 ATP 的各部分，按按钮观察 ATP 水解和合成。',r(el){
 let s='atp',sel=null;
 const I={ade:['腺嘌呤','一种含氮碱基，与核糖组成腺苷。'],rib:['核糖','五碳糖，与 RNA 中的核糖相同。'],aden:['腺苷（A）','腺嘌呤 + 核糖。注意 ATP 中的 A 指腺苷，不是腺嘌呤。'],p:['磷酸基团（P）','ATP 含 3 个磷酸基团。'],bond:['特殊的化学键（～）','相邻磷酸基团都带负电荷而相互排斥，使这种化学键不稳定，末端磷酸基团容易脱离并释放能量。'],amp:['AMP','腺苷 + 一个磷酸基团 = 腺嘌呤核糖核苷酸，是 RNA 的基本单位之一。']};
 const g=(k,inner)=>`<g class="og" data-o="${k}" tabindex="0" role="button">${inner}</g>`;
 const draw=()=>{const h=s==='adp';
  el.innerHTML=`<div class="mfig wide">${svg('0 0 420 170',`${g('ade',`<path d="M30 40 l22 -12 22 12 v24 l-22 12 -22 -12z" class="c-ade"/>${tx(52,57,'腺嘌呤','t','middle',10)}`)}
   <line x1="74" y1="58" x2="96" y2="72" class="bond"/>${g('rib',`<path d="M118 60 l22 16 -8 26 h-28 l-8 -26z" class="c-sugar"/>${tx(118,92,'核糖','t','middle',10)}`)}
   <line x1="140" y1="76" x2="170" y2="76" class="bond"/>
   ${g('p',`<circle cx="186" cy="76" r="16" class="c-phos"/>${tx(186,81,'P','tw','middle',14)}`)}
   ${g('bond',`<path d="M204 76 q6 -8 12 0 t12 0" class="c-squig"/>`)}${g('p',`<circle cx="246" cy="76" r="16" class="c-phos"/>${tx(246,81,'P','tw','middle',14)}`)}
   <g style="transition:transform .8s;transform:translateX(${h?60:0}px)">${g('bond',`<path d="M264 76 q6 -8 12 0 t12 0" class="c-squig ${h?'broken':''}"/>`)}${g('p',`<circle cx="306" cy="76" r="16" class="c-phos"/>${tx(306,81,h?'Pi':'P','tw','middle',14)}`)}</g>
   ${h?`${tx(330,40,'+ 能量','hl','middle',13)}`:''}
   ${g('aden',`<path d="M26 120 v8 h120 v-8" class="c-brk"/>${tx(86,145,'腺苷 A','tm','middle',11)}`)}
   ${g('amp',`<path d="M26 18 v-6 h178 v6" class="c-brk2"/>${tx(115,9,'AMP（腺嘌呤核糖核苷酸）','tm','middle',10)}`)}
   ${tx(h?250:280,162,h?'ADP + Pi + 能量':'ATP：A—P～P～P','t','middle',13)}`)}</div>
  <div class="row2"><button type="button" class="btn sm pri" data-s="${h?'atp':'adp'}">${h?'合成 ATP（吸收能量）':'水解 ATP（释放能量）'}</button></div>
  <div class="mgrid"><div class="minfo">${sel?`<h4>${I[sel][0]}</h4><p>${I[sel][1]}</p>`:'<p class="muted">点图中的结构查看说明。</p>'}</div>
  <div class="minfo"><dl><dt>ATP 合成的能量来源</dt><dd>呼吸作用；绿色植物还有光合作用</dd><dt>ATP 水解的能量去路</dt><dd>主动运输、肌肉收缩、大脑思考、生物发光、物质合成等</dd><dt>特点</dt><dd>含量少、转化快，处于动态平衡；酶和能量不同，不是可逆反应</dd></dl></div></div>`;
  el.querySelector('[data-s]').onclick=e=>{s=e.currentTarget.dataset.s;draw()};
  el.querySelectorAll('.og').forEach(x=>x.onclick=()=>{sel=x.dataset.o;draw()});
  if(sel)el.querySelectorAll(`.og[data-o="${sel}"]`).forEach(x=>x.classList.add('on'));};draw();}},

resp:{t:'有氧呼吸与无氧呼吸',sec:'5-3',d:'逐阶段查看细胞呼吸发生的场所和物质变化。',r(el){
 let st=0;
 const S=[['有氧 · 第一阶段','cyto','细胞质基质','C₆H₁₂O₆ →(酶) 2 丙酮酸 + 4[H] + 少量能量','葡萄糖分解成丙酮酸，与无氧呼吸第一阶段完全相同。'],
  ['有氧 · 第二阶段','mat','线粒体基质','2 丙酮酸 + 6H₂O →(酶) 6CO₂ + 20[H] + 少量能量','丙酮酸和水彻底分解，产生 CO₂。'],
  ['有氧 · 第三阶段','inner','线粒体内膜','24[H] + 6O₂ →(酶) 12H₂O + 大量能量','前两个阶段产生的 [H] 与 O₂ 结合生成水，释放大量能量。'],
  ['无氧 · 酒精发酵','cyto','细胞质基质','C₆H₁₂O₆ →(酶) 2C₂H₅OH + 2CO₂ + 少量能量','酵母菌、大多数植物。第二阶段不释放能量。'],
  ['无氧 · 乳酸发酵','cyto','细胞质基质','C₆H₁₂O₆ →(酶) 2C₃H₆O₃ + 少量能量','乳酸菌、人和动物骨骼肌、马铃薯块茎、甜菜块根、玉米胚。']];
 const draw=()=>{const s=S[st],loc=s[1];
  el.innerHTML=`<div class="stepper">${S.map((x,i)=>`<button type="button" data-st="${i}" aria-pressed="${i===st}">${x[0]}</button>`).join('')}</div>
  <div class="mfig wide">${svg('0 0 420 200',`<rect x="6" y="6" width="408" height="188" rx="16" class="c-cyto ${loc==='cyto'?'hlx':''}"/>${tx(20,26,'细胞质基质','tm','start',11)}
   <g transform="translate(250 110)"><ellipse rx="140" ry="70" class="c-mito"/><ellipse rx="128" ry="60" class="c-mat ${loc==='mat'?'hlx':''}"/>
   <path d="M-110 0 q10 -45 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t10 0" class="c-inner ${loc==='inner'?'hlx2':''}"/>${tx(0,-44,'线粒体基质','tm','middle',11)}${tx(0,58,'内膜（嵴）','tm','middle',11)}</g>
   <g transform="translate(64 110)"><circle r="20" class="c-glu"/>${tx(0,4,'葡萄糖','t','middle',10)}</g>
   ${st<3?`<path d="M88 110 L120 110" class="c-arrow" marker-end="url(#ah3)"/>`:''}
   <defs><marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" class="c-ahead"/></marker></defs>`)}</div>
  <div class="minfo"><h4>${s[0]}</h4><dl><dt>场所</dt><dd><b>${s[2]}</b></dd><dt>反应</dt><dd class="f">${s[3]}</dd><dt>说明</dt><dd>${s[4]}</dd></dl></div>
  <p class="small muted">有氧呼吸总反应式：C₆H₁₂O₆ + 6H₂O + 6O₂ →(酶) 6CO₂ + 12H₂O + 能量。[H] 即 NADH。</p>`;
  el.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{st=+b.dataset.st;draw()});};draw();}},

photo:{t:'光合作用的过程',sec:'5-4',d:'看光反应和暗反应的场所与联系，试试改变光照或 CO₂，观察 C₃ 和 C₅ 的变化。',r(el){
 let cond='norm',sel=null;
 const C={norm:['正常',0,0],ldn:['光照减弱',1,-1],lup:['光照增强',-1,1],cdn:['CO₂ 减少',-1,1],cup:['CO₂ 增加',1,-1]};
 const I={thy:['类囊体薄膜（光反应）','条件：光、色素、酶。水的光解产生 O₂ 和 H⁺；H⁺ 与 NADP⁺ 形成 NADPH；ADP + Pi 合成 ATP。光能 → 活跃的化学能。'],str:['叶绿体基质（暗反应）','CO₂ 的固定：CO₂ + C₅ → 2C₃；C₃ 的还原：2C₃ 在 ATP、NADPH 和酶作用下 → (CH₂O) + C₅。活跃的化学能 → 稳定的化学能。'],link:['光反应与暗反应的联系','光反应为暗反应提供 ATP 和 NADPH；暗反应为光反应提供 ADP、Pi 和 NADP⁺。']};
 const g=(k,inner)=>`<g class="og" data-o="${k}" tabindex="0" role="button">${inner}</g>`;
 const arr=v=>v>0?'↑ 增加':v<0?'↓ 减少':'— 稳定';
 const draw=()=>{const c=C[cond];

pigment:{t:'光合色素的分离与吸收光谱',sec:'5-4',d:'点滤纸条上的色素带，查看色素的名称、颜色、含量和吸收的光。',r(el){

mitosis:{t:'有丝分裂各时期',sec:'6-1',d:'逐个时期观察染色体的行为，对照数目变化表。体细胞以 4 条染色体（2N = 4）为例。',r(el){
 let st=0,kind='animal';
 const PH=['间期','前期','中期','后期','末期'];
 const TXT=['DNA 复制和有关蛋白质的合成，细胞适度生长。染色质呈细丝状，核膜、核仁清晰。','核膜、核仁逐渐消失；染色质缩短变粗成为染色体；形成纺锤体；染色体散乱分布。','着丝粒排列在赤道板上，染色体形态稳定、数目清晰，最适合观察。','着丝粒分裂，姐妹染色单体分开成为子染色体，移向两极；染色体数目加倍。','染色体变成染色质；纺锤体消失；核膜、核仁重新出现；细胞质一分为二。'];

  const spindle=st>=1&&st<=3?`<path d="M60 100 Q210 20 360 100 M60 100 Q210 50 360 100 M60 100 Q210 150 360 100 M60 100 Q210 180 360 100" class="c-spin"/>`:'';
  if(st===0)f=`<circle cx="210" cy="100" r="58" class="c-nuc"/><circle cx="228" cy="88" r="13" class="c-nucl"/><path d="M175 80 q15 -15 30 0 t30 0 M170 110 q15 15 30 0 t30 5 M185 135 q15 -10 30 0 t25 -5" class="c-chr"/>${an?`<g transform="translate(300 60)"><rect x="-6" y="-2" width="12" height="5" rx="2" class="c-cent"/><rect x="-2.5" y="-6" width="5" height="13" rx="2" class="c-cent"/></g>`:''}`;
  if(st===1)f=`<circle cx="210" cy="100" r="62" class="c-nucfade"/>${xchr(180,80,30,0)}${xchr(240,120,-20,1)}${xchr(235,72,70,2)}${xchr(178,128,-60,3)}`;
  if(st===2)f=`<line x1="210" y1="18" x2="210" y2="182" class="c-eq"/>${tx(214,30,'赤道板','tm','start',10)}${[0,1,2,3].map(i=>xchr(210,46+i*36,90,i)).join('')}`;
  if(st===3)f=[0,1,2,3].map(i=>rod(150,46+i*36,90,i)+rod(270,46+i*36,-90,i)).join('');
  if(st===4)f=`<circle cx="110" cy="100" r="44" class="c-nuc"/><circle cx="310" cy="100" r="44" class="c-nuc"/><circle cx="120" cy="90" r="9" class="c-nucl"/><circle cx="320" cy="90" r="9" class="c-nucl"/><path d="M85 95 q10 -10 20 0 t20 0 M90 115 q10 10 20 0 t20 0 M285 95 q10 -10 20 0 t20 0 M290 115 q10 10 20 0 t20 0" class="c-chr"/>`;
  const pts=[[0,2,4],[1,2,4],[2,2,4],[3,4,4],[4,2,2]];

  <div class="tbw"><table class="tb ctb"><tr><th>时期</th><th>染色体</th><th>核 DNA</th><th>染色单体</th></tr>${PH.map((p,i)=>`<tr class="${i===st?'cur':''}"><td>${p}</td><td>${CNT[i][0]}</td><td>${CNT[i][1]}</td><td>${CNT[i][2]}</td></tr>`).join('')}</table></div>
  <div class="row2"><button type="button" class="btn sm" data-mv="-1">上一个时期</button><button type="button" class="btn sm pri" data-mv="1">下一个时期</button></div>`;
  onSeg(el,'k',v=>{kind=v;draw()});el.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{st=+b.dataset.st;draw()});el.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{st=(st+ +b.dataset.mv+5)%5;draw()});};draw();}}

function rng2(s){let a=s*9301+49297;return()=>{a=(a*9301+49297)%233280;return a/233280}}
function starPath(cx,cy,r,n){let d='';for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2,rr=i%2?r*.78:r;d+=(i?'L':'M')+(cx+Math.cos(a)*rr).toFixed(1)+' '+(cy+Math.sin(a)*rr).toFixed(1)}return d+'Z'}
function rateChart(k){const pts=[];for(let i=0;i<=50;i++){const x=i/50;const y=k==='free'?x*.9:(1-Math.exp(-x*4))*.85;pts.push(`${30+x*210},${120-y*100}`)}
 return `<p class="lbl">运输速率与${k==='act'?'物质浓度（能量充足时）':'浓度差'}</p>${svg('0 0 260 140',`<line x1="30" y1="120" x2="245" y2="120" class="axis"/><line x1="30" y1="120" x2="30" y2="12" class="axis"/><polyline points="${pts.join(' ')}" class="c-curve2"/>${tx(240,134,k==='act'?'浓度':'浓度差','tm','end',9)}<text x="16" y="66" class="tm" font-size="9" transform="rotate(-90 16 66)" text-anchor="middle">速率</text>`)}<p class="small muted">${k==='free'?'自由扩散：速率与浓度差成正比。':k==='act'?'主动运输：受载体蛋白数量和能量（O₂ 浓度、温度）限制。':'协助扩散：受转运蛋白数量限制，到一定程度后不再增加。'}</p>`}

/* ===== v2 模型：通用画布工具 ===== */
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function PAL(){const o={};['paper','surface','sunk','ink','muted','line','hema','hema-soft','eosin','eosin-soft','ok','warn','mito','mito-d','chl','chl-d','er','golgi','nuc','nucl','lys','vac','ribo','cyto','memc','wall','prot','prot2','head','tail','sug','phos','sugarc'].forEach(k=>o[k.replace('-','_')]=cssv('--'+k));return o}
/* 画布：逻辑尺寸 w×h，自动适配清晰度；frame(dt,P,ctx) 每帧调用；离开页面自动停止，滚出视野自动暂停 */
function canvasBox(host,w,h,frame,opt={}){
 const c=document.createElement('canvas');c.className='mcv';c.style.aspectRatio=w+' / '+h;host.appendChild(c);
 const ctx=c.getContext('2d');const S={c,ctx,w,h,paused:!!opt.paused||RM,vis:true,t:0,P:PAL()};
 const fit=()=>{const dpr=Math.min(2,window.devicePixelRatio||1),cw=c.clientWidth||w;c.width=Math.round(cw*dpr);c.height=Math.round(cw*h/w*dpr);ctx.setTransform(c.width/w,0,0,c.height/h,0,0)};
 fit();let ro;if(window.ResizeObserver){ro=new ResizeObserver(fit);ro.observe(c)}
 if(window.IntersectionObserver){const io=new IntersectionObserver(es=>{S.vis=es[0].isIntersecting});io.observe(c)}
 let last=performance.now(),n=0;
 const tick=now=>{if(!c.isConnected){ro&&ro.disconnect();return}
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S.vis){if(++n%40===0)S.P=PAL();const d=S.paused?0:dt;S.t+=d;ctx.clearRect(0,0,w,h);frame(d,S.P,ctx,S)}
  requestAnimationFrame(tick)};
 requestAnimationFrame(tick);
 S.redraw=()=>{ctx.clearRect(0,0,w,h);frame(0,S.P,ctx,S)};
 S.pt=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)/r.width*w,(e.clientY-r.top)/r.height*h]};
 return S}
const playBtn=S=>`<button type="button" class="btn sm" data-play>${S&&S.paused?'▶ 播放':'❚❚ 暂停'}</button>`;
function bindPlay(el,S){el.querySelectorAll('[data-play]').forEach(b=>{b.textContent=S.paused?'▶ 播放':'❚❚ 暂停';b.onclick=()=>{S.paused=!S.paused;b.textContent=S.paused?'▶ 播放':'❚❚ 暂停'}})}
const F=(sz,w=500)=>`${w} ${sz}px "Noto Sans SC",system-ui,-apple-system,"PingFang SC",sans-serif`;
function ctext(ctx,s,x,y,col,sz=12,al='center',w=500){ctx.fillStyle=col;ctx.font=F(sz,w);ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function levelsModel(el){
 const L=['细胞','组织','器官','系统','个体','种群','群落','生态系统','生物圈'];
 const SP={panda:{n:'大熊猫',ex:['心肌细胞','心肌组织（肌肉组织）','心脏','循环系统','一只大熊猫','卧龙自然保护区内所有大熊猫','保护区内所有生物','保护区内所有生物 + 无机环境','地球上最大的生态系统'],miss:[]},
  bamboo:{n:'冷箭竹',ex:['叶肉细胞','保护组织、营养组织等','叶（营养器官）','——','一株冷箭竹','保护区内所有冷箭竹','保护区内所有生物','保护区内所有生物 + 无机环境','地球上最大的生态系统'],miss:[3]},
  para:{n:'草履虫',ex:['一个草履虫细胞','——','——','——','一个草履虫（一个细胞就是一个个体）','池塘中所有草履虫','池塘中所有生物','池塘生态系统','地球上最大的生态系统'],miss:[1,2,3]}};
 const WHY={3:'植物没有“系统”层次：植物的根、茎、叶等器官直接构成个体。',1:'单细胞生物没有组织、器官、系统层次：一个细胞既是“细胞”层次，也是“个体”层次。'};
 const DEF=['生命系统最基本的结构层次；生命活动离不开细胞。','由形态相似、结构功能相同的细胞联合在一起。','不同组织按一定次序结合在一起，完成一定功能。','能够共同完成一种或几种生理功能的多个器官按一定次序组合。','由各种器官或系统协调配合，共同完成复杂生命活动的生物。','一定区域内同种生物的所有个体。注意关键词“同种”“所有”。','一定区域内所有种群的集合（所有生物）。','群落与它的无机环境相互作用形成的统一整体。','由地球上所有的生物和这些生物生活的无机环境共同组成。'];
 let sp='panda',cur=0;
 const draw=()=>{const s=SP[sp],miss=s.miss;
  const H=34,g=svg(`0 0 340 ${L.length*H+20}`,L.map((x,i)=>{const y=10+(L.length-1-i)*H,ms=miss.includes(i),on=i===cur,w=120+i*22;return `<g class="og ${on?'on':''}" data-lv="${i}" tabindex="0" role="button" aria-label="${x}"><rect x="${170-w/2}" y="${y}" width="${w}" height="${H-6}" rx="8" style="fill:${ms?'var(--sunk)':on?'var(--hema)':'var(--hema-soft)'};stroke:${ms?'var(--line)':'var(--hema)'};stroke-dasharray:${ms?'4 3':'0'}"/>${tx(170,y+H/2+1,x+(ms?'（无）':''),on?'tw':ms?'tm':'t','middle',13)}</g>`}).join('')+`${tx(10,L.length*H,'小','tm','start',11)}${tx(10,22,'大','tm','start',11)}<line x1="14" y1="34" x2="14" y2="${L.length*H-12}" class="c-arrow"/>`);
  el.innerHTML=`${segs('sp',Object.entries(SP).map(([k,v])=>[k,v.n]),sp)}<div class="mgrid"><div class="mfig">${g}</div><div class="mside"><div class="minfo"><h4>${L[cur]}</h4><p>${DEF[cur]}</p><p><b>${s.n}的例子：</b>${s.ex[cur]}</p>${miss.includes(cur)?`<p class="small" style="color:var(--eosin)">${WHY[miss.length===1?3:1]}</p>`:''}</div>
  <p class="small muted">点阶梯上的层次。切换“冷箭竹”“草履虫”看看哪些层次会消失。<b>最基本</b>的生命系统是细胞，<b>最大</b>的是生物圈；分子、原子、病毒都<b>不属于</b>生命系统的结构层次。</p></div></div>`;
  onSeg(el,'sp',v=>{sp=v;draw()});el.querySelectorAll('[data-lv]').forEach(g=>{const f=()=>{cur=+g.dataset.lv;draw()};g.onclick=f;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}}})};draw()}

function waterModel(el){
 let temp=25,bound=.2,dry=0;const N=90,mols=[];const r=rng2(3);
 for(let i=0;i<N;i++)mols.push({x:20+r()*340,y:20+r()*200,vx:r()-.5,vy:r()-.5,a:r()*6.28,va:r()-.5,b:false});
 const prot={x:290,y:120,r:38};
 el.innerHTML=`<div class="mgrid"><div class="mfig" data-cv></div><div class="mside">
  <label class="lbl">温度：<b data-v="t">${temp} ℃</b></label><input type="range" min="0" max="80" value="${temp}" data-r="t">
  <label class="lbl">结合水比例（冬季、抗逆时升高）：<b data-v="b"></b></label><input type="range" min="5" max="60" value="${bound*100}" data-r="b">
  <div class="seg" data-seg="dry">${[['0','新鲜种子'],['1','晒干'],['2','烘烤（失去结合水）']].map(([k,l])=>`<button type="button" data-v="${k}" aria-pressed="${k==='0'}">${l}</button>`).join('')}</div>
  <div class="minfo" data-info></div>${playBtn()}</div></div>`;
 const info=()=>{const free=1-bound;el.querySelector('[data-v="b"]').textContent=Math.round(bound*100)+'%';el.querySelector('[data-v="t"]').textContent=temp+' ℃';
  el.querySelector('[data-info]').innerHTML=dry===0?`<p>自由水 ∶ 结合水 ≈ <b>${(free/bound).toFixed(1)} ∶ 1</b></p><p>${bound>.35?'结合水比例高 → 代谢减弱，<b>抗寒、抗旱等抗逆性增强</b>（如冬小麦越冬）。':'自由水比例高 → 细胞<b>代谢旺盛</b>，但抗逆性较弱（如萌发的种子）。'}</p><p class="small muted">虚线是水分子间的<b>氢键</b>：不断断裂又形成，使水在常温下保持液态、比热容大、温度相对稳定。温度越高，氢键越少。</p>`:dry===1?'<p><b>晒干</b>：失去的主要是<b>自由水</b>，代谢降到很低，便于储存；结合水仍在，细胞结构完好，种子<b>还能萌发</b>。</p>':'<p><b>烘烤</b>：连<b>结合水</b>也失去了。结合水是细胞结构的重要组成部分，失去后细胞结构被破坏，种子<b>不能再萌发</b>。剩下的灰烬是<b>无机盐</b>。</p>'};
 const S=canvasBox(el.querySelector('[data-cv]'),380,240,(dt,P,ctx)=>{
  const sp=(.4+temp/40)*60;const nb=Math.round(N*bound);
  ctx.fillStyle=alpha(P.prot,.85);ctx.beginPath();for(let k=0;k<=40;k++){const a=k/40*6.283,rr=prot.r+Math.sin(a*5)*4;ctx.lineTo(prot.x+Math.cos(a)*rr,prot.y+Math.sin(a)*rr)}ctx.fill();ctext(ctx,'蛋白质',prot.x,prot.y,P.surface,12,'center',700);
  mols.forEach((m,i)=>{const isB=i<nb;m.b=isB;if(dry===2||(dry===1&&!isB)){m.gone=true;return}m.gone=false;
   if(isB){const a=i/nb*6.283+S.t*.05,rr=prot.r+11+(i%3)*9;m.x=lerp(m.x,prot.x+Math.cos(a)*rr,.1);m.y=lerp(m.y,prot.y+Math.sin(a)*rr,.1);m.a+=Math.sin(S.t*3+i)*.01}
   else{m.x+=m.vx*sp*dt;m.y+=m.vy*sp*dt;m.a+=m.va*dt*3;if(m.x<10||m.x>370)m.vx*=-1;if(m.y<10||m.y>230)m.vy*=-1;const dx=m.x-prot.x,dy=m.y-prot.y,d=Math.hypot(dx,dy);if(d<prot.r+30){m.x=prot.x+dx/d*(prot.r+30);m.y=prot.y+dy/d*(prot.r+30);m.vx=dx/d*.6;m.vy=dy/d*.6}}});
  const live=mols.filter(m=>!m.gone);const lim=temp>60?16:temp>30?20:24;ctx.setLineDash([2,3]);ctx.strokeStyle=alpha(P.hema,.7);ctx.lineWidth=1;
  for(let i=0;i<live.length;i++)for(let j=i+1;j<live.length;j++){const a=live[i],b=live[j];if(a.b&&b.b)continue;const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<lim&&((i*7+j)%5<(temp>60?1:temp>30?2:3))){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
  ctx.setLineDash([]);
  live.forEach(m=>{const c=Math.cos(m.a),s=Math.sin(m.a);ctx.fillStyle=m.b?P.eosin:'#e0574c';ctx.beginPath();ctx.arc(m.x,m.y,5,0,6.283);ctx.fill();ctx.fillStyle=P.surface;ctx.strokeStyle=P.muted;ctx.lineWidth=.8;[[1,.6],[-1,.6]].forEach(([u,v])=>{const hx=m.x+(c*u*.8-s*v)*6,hy=m.y+(s*u*.8+c*v)*6;ctx.beginPath();ctx.arc(hx,hy,2.8,0,6.283);ctx.fill();ctx.stroke()})});
  ctext(ctx,'红：自由水（可自由流动）',10,12,P.ink,11,'left');ctext(ctx,'粉：结合水（与蛋白质、多糖等结合）',10,28,P.eosin,11,'left');
  if(dry)ctext(ctx,dry===1?'晒干：自由水已失去':'烘烤：结合水也失去，细胞结构破坏',190,228,P.eosin,12,'center',700)});
 el.querySelector('[data-r="t"]').oninput=e=>{temp=+e.target.value;info()};el.querySelector('[data-r="b"]').oninput=e=>{bound=e.target.value/100;info()};
 onSeg(el,'dry',v=>{dry=+v;el.querySelectorAll('[data-seg="dry"] button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));info()});bindPlay(el,S);info()}

/* ===== 写实渲染库：明暗、有机形状、细胞器画法、标注 ===== */
const BR=(()=>{

/* ===== 3-1 人鼠细胞融合 ===== */
function fusionModel(el){
 let temp=37,phase=0,tmin=0,ps=[];const r=rng2(9);
 const reset=()=>{phase=0;tmin=0;ps=[];for(let i=0;i<46;i++)ps.push({h:i<23,a:0,base:r()})};reset();
 el.innerHTML=`<div class="mgrid"><div class="mfig" data-cv></div><div class="mside"><label class="lbl">培养温度：<b data-v>${temp} ℃</b></label><input type="range" min="0" max="40" value="${temp}" data-r>
 <div class="row2"><button type="button" class="btn sm pri" data-go>诱导融合</button><button type="button" class="btn sm" data-re>重置</button></div><div class="minfo" data-info></div></div></div>`;
 const info=()=>{el.querySelector('[data-info]').innerHTML=phase===0?'<p>用<b>绿色</b>荧光染料标记人细胞膜上的蛋白质，用<b>红色</b>荧光染料标记小鼠细胞膜上的蛋白质。点“诱导融合”。</p>':`<p>融合后 <b>${Math.round(tmin)} min</b>（${temp} ℃）</p><p>${tmin>=40&&temp>=30?'两种颜色的荧光<b>均匀分布</b>。结论：细胞膜上的蛋白质分子是可以运动的，<b>细胞膜具有流动性</b>。':temp<15?'低温下荧光几乎不混合：温度降低，分子运动减慢，膜的流动性降低。这说明膜的流动性<b>受温度影响</b>。':'红绿荧光正在逐渐混合……'}</p>`};
 const S=canvasBox(el.querySelector('[data-cv]'),360,240,(dt,P,ctx)=>{
  const D=Math.max(0,(temp-5)/32);if(phase===1){phase=2}if(phase>=1)tmin+=dt*12;
  const f=phase===0?0:clamp(tmin/4,0,1);const cxL=lerp(110,180,f),cxR=lerp(250,180,f),R=lerp(62,84,f);
  ctx.lineWidth=4;ctx.strokeStyle=P.memc;{const g=ctx.createRadialGradient(150,90,10,180,120,170);g.addColorStop(0,BR.lite(P.cyto,.35));g.addColorStop(1,BR.mix(P.cyto,P.memc,.15));ctx.fillStyle=g}
  if(f<1){[cxL,cxR].forEach(cx=>{ctx.beginPath();ctx.arc(cx,120,lerp(62,74,f),0,6.283);ctx.fill();ctx.stroke()})}else{ctx.beginPath();ctx.ellipse(180,120,R*1.15,R,0,0,6.283);ctx.fill();ctx.stroke()}
  if(f<1){BR.nucleus(ctx,P,cxL,120,20,{seed:1});BR.nucleus(ctx,P,cxR,120,20,{seed:2})}else{BR.nucleus(ctx,P,160,120,18,{seed:1});BR.nucleus(ctx,P,200,120,18,{seed:2})}
  ps.forEach((p,i)=>{let x,y;if(f<1){const k=p.h?0:1,cx=p.h?cxL:cxR,a=p.base*6.283;const rr=lerp(62,74,f);x=cx+Math.cos(a)*rr;y=120+Math.sin(a)*rr}else{if(!p.init){p.a=(p.h?Math.PI/2+p.base*Math.PI:-Math.PI/2+p.base*Math.PI);p.init=1}p.a+=(Math.random()-.5)*D*4*dt*12;x=180+Math.cos(p.a)*R*1.15;y=120+Math.sin(p.a)*R}
   ctx.save();ctx.shadowColor=p.h?'#2fbf5a':'#e2464a';ctx.shadowBlur=8;BR.ball(ctx,x,y,4.4,p.h?'#2fbf5a':'#e2464a',.6);ctx.restore()});
  ctext(ctx,phase===0?'人细胞':'',cxL,40,P.ink,12);ctext(ctx,phase===0?'小鼠细胞':'',cxR,40,P.ink,12);if(phase)ctext(ctx,`${Math.round(tmin)} min`,180,20,P.hema,14,'center',700);
  if(phase&&Math.round(tmin)%5===0)info()});
 el.querySelector('[data-go]').onclick=()=>{if(phase===0){phase=1;S.paused=false;info()}};el.querySelector('[data-re]').onclick=()=>{reset();info()};

function memAlong(ctx,P,pts,o={}){const half=o.half||9,sp=o.sp||7,hr=o.hr||3.3;
 ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));if(o.closed)ctx.closePath();
 ctx.strokeStyle=BR.rgba(P.tail,.55);ctx.lineWidth=half*1.75;ctx.stroke();ctx.strokeStyle=BR.rgba(BR.dark(P.tail,.2),.5);ctx.lineWidth=.8;ctx.stroke();
 const segs=[];for(let i=0;i<pts.length-1+(o.closed?1:0);i++){const a=pts[i],b=pts[(i+1)%pts.length];segs.push([a,b,Math.hypot(b[0]-a[0],b[1]-a[1])])}
 let carry=0;segs.forEach(([a,b,l])=>{if(l<.01)return;const nx=-(b[1]-a[1])/l,ny=(b[0]-a[0])/l;for(let d=carry;d<l;d+=sp){const x=a[0]+(b[0]-a[0])*d/l,y=a[1]+(b[1]-a[1])*d/l;BR.ball(ctx,x+nx*half,y+ny*half,hr,o.col||P.head,.55);BR.ball(ctx,x-nx*half,y-ny*half,hr,o.col||P.head,.55)}carry=(carry-l)%sp;if(carry<0)carry+=sp})}
const circPts=(x,y,r,n=48)=>[...Array(n)].map((_,i)=>[x+Math.cos(i/n*6.283)*r,y+Math.sin(i/n*6.283)*r]);

    else if(c.st==='flip'){const u=clamp(c.t/.8,0,1);c.o=c.from?1-2*u:-1+2*u;if(c.t>.8){const q=c.p;q.held=false;pass(q,1-c.from);c.p=null;c.st=mode==='act'?'out':(c.from?'out':'in');if(mode==='car'&&Math.random()<.5)c.st=c.st==='out'?'in':'out';c.t=0;c.atp=0}}

function endoModel(el){

 ['1965 年','我国科学家','人工合成了具有生物活性的结晶牛胰岛素（世界上第一次人工合成蛋白质）','证实蛋白质可以由氨基酸<b>按一定顺序连接</b>而成，结构决定功能',2],

 ['证据','甲基绿—吡罗红染色','DNA 主要被染成绿色、分布在细胞核；RNA 被染成红色、主要在细胞质','DNA 主要分布在<b>细胞核</b>，RNA 主要分布在<b>细胞质</b>',0,1],
 ['证据','DNA 指纹','不同人的 DNA 中脱氧核苷酸序列各不相同，可用于刑侦、亲子鉴定','遗传信息储存在<b>核苷酸的排列顺序</b>中',3]]},
'3-1':{lead:'细胞膜太薄，光学显微镜看不清。科学家先“推理”出成分，再“提取”验证，然后提出结构假说，不断被新证据修正——这是“提出假说”这一科学方法的典型案例。',ev:[

 ['1925 年','戈特、格伦德尔','把红细胞膜中的脂质在空气—水界面铺成单分子层，面积恰为红细胞表面积的 2 倍','磷脂分子排列为<b>连续的两层</b>',2],
 ['1935 年','丹尼利、戴维森','发现细胞的表面张力明显低于油—水界面的表面张力','推测细胞膜除含脂质外，可能还附有<b>蛋白质</b>',2],

 ['1970 年','人鼠细胞融合','用不同颜色的荧光标记人、鼠细胞膜蛋白，融合后 37 ℃ 下约 40 min 两种荧光均匀分布','细胞膜具有<b>流动性</b>',2],
 ['1972 年','辛格、尼科尔森','综合以上证据','提出<b>流动镶嵌模型</b>，被大多数人接受',3]]},

'3-3':{lead:'“细胞核是控制中心”是四组实验共同支撑的结论：每一组都在问“去掉核（或换掉核）会怎样”。',ev:[

 ['综合','四组实验','细胞核内有 DNA，储存遗传信息','细胞核是<b>遗传信息库</b>，是细胞代谢和遗传的<b>控制中心</b>',3]]},
'4-1':{lead:'“原生质层相当于半透膜”是用“提出问题 → 作出假设 → 设计实验 → 验证”这一完整探究过程得出的。',ev:[

'5-1':{lead:'人们对“酶是什么”的认识经历了 150 多年的争论；而酶的特性，则是用一组组对照实验得出的。',ev:[

 ['1857 年','巴斯德','认为没有活细胞参与，糖类不可能变成酒精','发酵与<b>活细胞</b>有关',2],

 ['1897 年','毕希纳','用不含细胞的酵母提取液也使葡萄糖变成了酒','<b>酶离开活细胞也能起作用</b>，结束了争论',2],
 ['1926 年','萨姆纳','从刀豆种子中提取出脲酶结晶，证明脲酶是蛋白质','<b>酶是蛋白质</b>',2],

'5-2':{lead:'ATP 是“直接能源”，这个结论要靠“换能源物质看效果”的对照实验来支持。',ev:[

'5-3':{lead:'细胞呼吸的三阶段，是在“分离线粒体 + 同位素追踪”的基础上一段段拼出来的；酵母菌实验则让你亲手得出两种呼吸方式。',ev:[

'5-4':{lead:'光合作用是生物学史上研究最久的课题之一：从“植物能更新空气”到“两个阶段、卡尔文循环”，经历了近 200 年。',ev:[

 ['1937 年','希尔','离体叶绿体悬浮液中加入铁盐等氧化剂（没有 CO₂），光照下释放 O₂','O₂ 的产生<b>不需要 CO₂</b>，与糖的合成不是同一个反应',2],

<script>/* bio2/map.js */
/* ---------- 思维导图、发现之路、跨章联系 ---------- */
const CHC=['var(--hema)','var(--eosin)','var(--chl-d)','var(--er)','var(--mito-d)','var(--golgi)'];
const sid=id=>id.replace('-','.');
function twd(s,fs){let w=0;for(const ch of s)w+=/[\x00-\xff]/.test(ch)?fs*.58:fs*1.02;return w}
function clip(s,fs,max){if(twd(s,fs)<=max)return s;let o='';for(const ch of s){if(twd(o+ch+'…',fs)>max)break;o+=ch}return o+'…'}
/* 横向思维导图：node = {t, href, kp, c:[], col, lv, sub} */
function mindmap(root,o={}){
 const FS=[17,14.5,13.5],pad=12,rowH=o.rowH||32,gap=40,MAXW=o.maxw||290;
 const mw=[];(function walk(n,d){n.d=d;const fs=FS[Math.min(d,2)];n.tt=clip(n.t,fs,MAXW);n.w=twd(n.tt,fs)+pad*2+(n.lv?40:0);mw[d]=Math.max(mw[d]||0,n.w);(n.c||[]).forEach(c=>{c.col=c.col||n.col;walk(c,d+1)})})(root,0);
 const X=[];let x=8;mw.forEach((w,d)=>{X[d]=x;x+=w+gap});
 let y=6;(function lay(n){if(!n.c||!n.c.length){n.y=y+rowH/2;y+=rowH}else{n.c.forEach(lay);n.y=(n.c[0].y+n.c[n.c.length-1].y)/2;if(n.d===1&&root.c.length>1)y+=10}})(root);
 const W=x-gap+8,H=y+6;let E='',N='';
 (function draw(n){const fs=FS[Math.min(n.d,2)],h=n.d===0?40:n.d===1?32:26,x0=X[n.d],col=n.col||'var(--hema)';
  (n.c||[]).forEach(c=>{const x1=x0+n.w,x2=X[c.d],mx=(x1+x2)/2;E+=`<path d="M${x1} ${n.y} C${mx} ${n.y} ${mx} ${c.y} ${x2} ${c.y}" style="fill:none;stroke:${c.col||col};stroke-width:${n.d===0?3:2};opacity:.55"/>`;draw(c)});
  const box=n.d===0?`<rect x="${x0}" y="${n.y-h/2}" width="${n.w}" height="${h}" rx="12" style="fill:${col}"/>`:n.d===1?`<rect x="${x0}" y="${n.y-h/2}" width="${n.w}" height="${h}" rx="9" style="fill:var(--surface);stroke:${col};stroke-width:2"/>`:`<rect x="${x0}" y="${n.y-h/2}" width="${n.w}" height="${h}" rx="6" style="fill:var(--surface);stroke:var(--line)"/><rect x="${x0}" y="${n.y-h/2}" width="4" height="${h}" rx="2" style="fill:${col}"/>`;
  const txt=`<text x="${x0+pad}" y="${n.y+fs*.36}" font-size="${fs}" style="fill:${n.d===0?'var(--surface)':'var(--ink)'};font-weight:${n.d<2?700:500}">${n.tt}</text>`+(n.lv?`<text x="${x0+n.w-8}" y="${n.y+4.5}" font-size="11" text-anchor="end" style="fill:var(--eosin)">${'★'.repeat(n.lv)}</text>`:'');
  const tip=n.tt!==n.t?`<title>${n.t}</title>`:'';
  N+=n.href?`<a href="${n.href}"${n.kp!=null?` data-kp="${n.kp}"`:''} class="mmn">${tip}${box}${txt}</a>`:`<g>${tip}${box}${txt}</g>`})(root);
 return `<div class="mmwrap"><svg class="mm" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${root.t} 思维导图">${E}${N}</svg></div>`}
const chMap=c=>mindmap({t:`第${CN[+c.id-1]}章 ${c.t}`,col:CHC[+c.id-1],c:c.secs.map(s=>({t:`${sid(s.id)} ${s.t}`,href:`#s-${s.id}`,c:s.pts.map((p,k)=>({t:p.t,href:`#s-${s.id}`,kp:k,lv:p.lv}))}))});
const bookMap=()=>mindmap({t:'分子与细胞',col:'var(--ink)',c:CH.map(c=>({t:`第${CN[+c.id-1]}章 ${c.t}`,col:CHC[+c.id-1],href:`#s-${c.secs[0].id}`,c:c.secs.map(s=>({t:`${sid(s.id)} ${s.t}`,href:`#s-${s.id}`}))}))},{maxw:250});
const secMap=s=>mindmap({t:`${sid(s.id)} ${s.t}`,col:CHC[+s.ch.id-1],c:s.pts.map((p,k)=>({t:p.t,href:`#s-${s.id}`,kp:k,lv:p.lv}))},{rowH:30,maxw:300});

/* 发现之路 */
function histBlock(s){const h=HIST[s.id];if(!h)return '';
 return `<section class="hist" id="hist"><h3>这些结论是怎么得出来的</h3><p class="lead">${h.lead}</p><ol class="tl">${h.ev.map(([t,who,did,got,k,ext])=>`<li><span class="yr">${t}</span><div><b>${who}</b>${ext?'<span class="ext" title="教材正文以外的补充，帮助理解">拓展</span>':''}<p>${did}</p><p class="got"><span>→</span> ${got}${k!=null&&s.pts[k]?` <a href="#s-${s.id}" data-kp="${k}" class="tok">知识点 ${k+1}</a>`:''}</p></div></li>`).join('')}</ol></section>`}
function srcLine(s,k){const h=HIST[s.id];if(!h)return '';const ev=h.ev.filter(e=>e[4]===k);if(!ev.length)return '';
 return `<div class="src"><span class="lab">结论从哪来</span>${ev.map(e=>`<span>${e[1]}${/^\d|世纪|年/.test(e[0])?`（${e[0]}）`:''}：${e[3].replace(/<[^>]+>/g,'')}</span>`).join('')}<button type="button" class="linkb" data-gohist>看完整的发现过程 ↑</button></div>`}
/* 跨章联系 */
function linkBlock(s){const L=LINKS.filter(l=>l[0]===s.id||l[1]===s.id);if(!L.length)return '';
 return `<section class="links"><h3>和其他章节的联系</h3><ul>${L.map(([a,b,t])=>{const o=a===s.id?b:a,os=secOf(o),back=b===s.id;return `<li><a href="#s-${o}"><span class="dir">${back?'← 来自':'→ 通向'}</span><b>${sid(o)} ${os.t}</b></a><span>${t}</span></li>`}).join('')}</ul><p class="small"><a href="#map">打开知识导图，看全书的联系网 →</a></p></section>`}

/* 知识导图页 */
let MAPT='book';
function vMap(){
 const tabs=[['book','全书总图'],...CH.map(c=>['c'+c.id,`第${CN[+c.id-1]}章`]),['net','跨章联系网']];
 let body='';
 if(MAPT==='book')body=`<div class="bline">${BOOKLINE.map(([id,t,d])=>`<a href="#s-${id}-1" style="--c:${CHC[+id-1]}"><small>第${CN[+id-1]}章</small><b>${t}</b><span>${d}</span></a>`).join('<i>→</i>')}</div><p class="muted small">全书的主线：先认识细胞（第 1 章）→ 细胞由哪些物质组成（第 2 章）→ 这些物质怎样构成细胞的结构（第 3 章）→ 结构怎样完成功能：物质进出（第 4 章）、能量转换（第 5 章）→ 细胞的一生（第 6 章）。<b>结构与功能相适应</b>贯穿始终。</p>${bookMap()}`;
 else if(MAPT==='net')body=`<p class="muted small" style="max-width:64ch">每个圆点是一节，连线表示两节之间有重要联系（共 ${LINKS.length} 条）。点一个圆点，看它和哪些节相连、为什么相连。考试中的综合题，往往就出在这些连线上。</p><div class="mgrid g3"><div class="mfig" data-net></div><div class="mside"><div class="minfo" data-netinfo><p>点左边任意一节。</p></div></div></div>`;
 else{const c=CH.find(c=>'c'+c.id===MAPT);body=`<p class="muted small">点任意方框跳到对应的节或知识点。★ 表示考频。</p>${chMap(c)}`}
 return `<p class="eyebrow">MIND MAP</p><h1 class="ptitle">知识导图</h1><div class="seg" data-mapt>${tabs.map(([k,l])=>`<button type="button" data-v="${k}" aria-pressed="${k===MAPT}">${l}</button>`).join('')}</div>${body}`}
function mapMount(){const t=document.querySelector('[data-mapt]');if(t)t.querySelectorAll('button').forEach(b=>b.onclick=()=>{MAPT=b.dataset.v;route(true)});
 const el=document.querySelector('[data-net]');if(!el)return;
 const n=SECS.length,R=200,C=300,CX=330,pos={};SECS.forEach((s,i)=>{const a=-Math.PI/2+i/n*Math.PI*2;pos[s.id]=[CX+Math.cos(a)*R,C+Math.sin(a)*R,a]});
 let sel=null;
 const draw=()=>{const on=l=>sel&&(l[0]===sel||l[1]===sel);
  el.innerHTML=`<svg class="msvg net" viewBox="0 0 660 600" role="img" aria-label="跨章联系网">${LINKS.map(l=>{const [x1,y1]=pos[l[0]],[x2,y2]=pos[l[1]];const mx=(x1+x2)/2*.55+CX*.45,my=(y1+y2)/2*.55+C*.45;return `<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" style="fill:none;stroke:${on(l)?'var(--eosin)':'var(--line)'};stroke-width:${on(l)?3:1.4};opacity:${sel&&!on(l)?.35:1}"/>`}).join('')}
  ${SECS.map(s=>{const [x,y,a]=pos[s.id],act=s.id===sel||(sel&&LINKS.some(l=>on(l)&&(l[0]===s.id||l[1]===s.id)));const lx=CX+Math.cos(a)*(R+26),ly=C+Math.sin(a)*(R+30),anc=Math.cos(a)>.3?'start':Math.cos(a)<-.3?'end':'middle';
   return `<g class="og ${s.id===sel?'on':''}" data-n="${s.id}" tabindex="0" role="button" aria-label="${sid(s.id)} ${s.t}" style="opacity:${sel&&!act?.4:1}"><circle cx="${x}" cy="${y}" r="17" style="fill:${CHC[+s.ch.id-1]}"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" style="fill:var(--surface);font-weight:700">${sid(s.id)}</text><text x="${lx}" y="${ly+4}" text-anchor="${anc}" font-size="11" class="tm">${clip(s.t,11,100)}</text></g>`}).join('')}
  ${CH.map((c,i)=>`<g><circle cx="${18}" cy="${18+i*18}" r="6" style="fill:${CHC[i]}"/><text x="30" y="${22+i*18}" font-size="11" class="t">第${CN[i]}章</text></g>`).join('')}</svg>`;
  el.querySelectorAll('[data-n]').forEach(g=>{const f=()=>{sel=sel===g.dataset.n?null:g.dataset.n;draw();info()};g.onclick=f;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}}})};
 const info=()=>{const box=document.querySelector('[data-netinfo]');if(!sel){box.innerHTML='<p>点左边任意一节。</p>';return}const s=secOf(sel);const L=LINKS.filter(l=>l[0]===sel||l[1]===sel);
  box.innerHTML=`<h4><a href="#s-${sel}">${sid(sel)} ${s.t}</a></h4><p class="small muted">与 ${L.length} 节有联系</p><ul class="nl">${L.map(([a,b,t])=>{const o=a===sel?b:a;return `<li><a href="#s-${o}"><b>${sid(o)} ${secOf(o).t}</b></a><br>${t}</li>`}).join('')}</ul>`};
 draw()}

<script>/* bio2/bexp.js */

['用高倍显微镜观察叶绿体和细胞质的流动','3-2','叶绿体呈绿色，不需染色；可以叶绿体的运动作为标志观察细胞质流动','藓类叶片（单层细胞）、菠菜叶稍带些叶肉的下表皮、黑藻','临时装片中的叶片要<b>随时保持有水状态</b>','叶绿体呈绿色、扁平的椭球或球形；细胞质不断流动','提高温度、适当光照可使流动加快；黑藻也常用于观察质壁分离'],
['制作真核细胞的三维结构模型','3-3','物理模型：以实物或图画形式直观表达认识对象的特征','各种材料','科学性第一，美观第二','—','流动镶嵌模型、DNA 双螺旋结构模型都属于物理模型；照片不是模型'],
['探究植物细胞的吸水和失水','4-1','原生质层相当于半透膜；原生质层的伸缩性大于细胞壁','<b>紫色洋葱鳞片叶外表皮</b>（液泡紫色，便于观察）；质量浓度为 <b>0.3 g/mL</b> 的蔗糖溶液；清水','先观察正常细胞 → 盖玻片一侧滴蔗糖溶液、另一侧用<b>吸水纸引流</b> → 观察质壁分离 → 滴清水引流 → 观察复原（共三次观察，前后自身对照）','质壁分离：液泡变小、颜色变深；复原：液泡变大','KNO₃、尿素、甘油溶液中会<b>自动复原</b>；浓度过高（0.5 g/mL）细胞失水过多死亡，不能复原；死细胞、动物细胞、根尖分生区细胞不发生质壁分离'],
['比较过氧化氢在不同条件下的分解','5-1','酶和无机催化剂都能降低活化能，酶更显著','3% H₂O₂；3.5% FeCl₃；20% 新鲜肝脏研磨液；卫生香','4 支试管：常温、90 ℃ 水浴、FeCl₃、肝脏研磨液；观察气泡和卫生香复燃情况','肝脏研磨液组气泡最多最快 → 酶具有<b>高效性</b>','自变量、因变量、无关变量的判断；肝脏要新鲜；1 号试管是空白对照'],
['淀粉酶对淀粉和蔗糖的水解作用','5-1','酶具有专一性','可溶性淀粉溶液、蔗糖溶液、淀粉酶溶液、斐林试剂','两支试管分别加淀粉和蔗糖，各加等量淀粉酶，60 ℃ 保温，用<b>斐林试剂</b>检测','只有淀粉组出现砖红色沉淀','不能用碘液检测（碘液无法判断蔗糖是否被水解）'],
['探究温度和 pH 对酶活性的影响','5-1','酶的作用条件较温和','温度：淀粉 + 淀粉酶，<b>碘液</b>检测；pH：H₂O₂ + 过氧化氢酶','温度实验中底物和酶<b>先分别保温再混合</b>；pH 实验中先用不同 pH 处理酶，再加底物','存在最适温度和最适 pH','温度实验不用 H₂O₂（受热分解），不用斐林试剂（需加热）；pH 实验不用淀粉（酸会水解淀粉）'],
['探究酵母菌细胞呼吸的方式','5-3','酵母菌是兼性厌氧菌；对比实验','酵母菌培养液；10% NaOH；澄清石灰水；溴麝香草酚蓝溶液；酸性重铬酸钾','有氧组先通过 NaOH 溶液<b>除去空气中的 CO₂</b>；无氧组<b>封口放置一段时间</b>再连通石灰水（耗尽原有 O₂）；检测酒精前延长培养时间，<b>耗尽葡萄糖</b>','有氧组产生 CO₂ 多；无氧组产生酒精（重铬酸钾由橙色变<b>灰绿色</b>）','CO₂ 使溴麝香草酚蓝<b>由蓝变绿再变黄</b>；两组都是实验组（对比实验）'],
['绿叶中色素的提取和分离','5-4','提取：色素溶于<b>无水乙醇</b>；分离：不同色素在<b>层析液</b>中溶解度不同，扩散速度不同','新鲜绿叶、SiO₂（研磨充分）、CaCO₃（防止色素被破坏）、无水乙醇、层析液、定性滤纸','迅速充分研磨 → 单层尼龙布过滤 → 滤纸条剪去两角、铅笔画线 → 画滤液细线（细、直、齐，干后重复 1～2 次） → 细线<b>不能触及层析液</b>','从上到下：胡萝卜素（橙黄）、叶黄素（黄）、叶绿素 a（蓝绿，最宽）、叶绿素 b（黄绿）','色带浅：研磨不充分、乙醇过多、未重复画线；无色带：细线触及层析液；绿色带很浅：未加 CaCO₃ 或叶片发黄'],
['探究光照强度对光合作用强度的影响','5-4','叶片产生的 O₂ 积累在细胞间隙，使叶片上浮','打孔器打出的圆形小叶片、注射器（抽出叶片内气体）、NaHCO₃ 溶液（提供 CO₂）、不同距离的光源','抽气使叶片沉底并暗处保存 → 分别放在强、中、弱光下 → 记录相同时间内浮起的叶片数','光照越强，浮起越多越快（一定范围内）','观测的是<b>净光合</b>；用光源距离改变光照强度时要注意温度（可隔水降温）'],
['细胞不能无限长大（模型计算）','6-1','把细胞看成立方体，物质从表面向内扩散的深度相同','边长 2 mm、4 mm、8 mm 的立方体“细胞”，扩散深度都是 0.5 mm','计算表面积/体积，以及物质扩散进入的体积占总体积的比例','边长越大，表面积/体积越小，扩散进入的体积比例越小（约 87.5%、57.8%、33.0%）','细胞越大，相对表面积越小，物质运输效率越低；细胞也不能太小（要容纳必要的结构）'],
['观察根尖分生区组织细胞的有丝分裂','6-1','分生区细胞分裂旺盛；染色体易被碱性染料着色','洋葱根尖；解离液（15% 盐酸 + 95% 酒精，1∶1）；清水；0.01～0.02 g/mL 甲紫溶液或醋酸洋红液','<b>解离 → 漂洗 → 染色 → 制片</b>（顺序不能颠倒）；上午 10 时至下午 2 时取材；先低倍镜找到分生区（正方形、排列紧密）','视野中<b>间期细胞最多</b>','解离后细胞已死亡，看不到动态过程；漂洗是为了洗去解离液、防止解离过度并便于染色'],
];
/* 试剂速查：[试剂, 用途, 现象或作用, 注意] */
const REAG=[
['斐林试剂','检测还原糖','砖红色沉淀','甲乙等量混合、现配现用、50～65 ℃ 水浴'],
['双缩脲试剂','检测蛋白质','紫色','先 A 液 1 mL 后 B 液 4 滴，不加热；变性蛋白也显色'],
['苏丹Ⅲ染液','检测脂肪','橘黄色','50% 酒精洗去浮色'],
['碘液','检测淀粉','蓝色','不能检测蔗糖是否水解'],
['体积分数 50% 的酒精','洗去浮色','—','脂肪检测实验'],
['无水乙醇','提取光合色素','—','也可用 95% 乙醇加无水碳酸钠'],
['层析液','分离光合色素','—','有毒，通风；细线不能触及'],
['SiO₂ / CaCO₃','研磨充分 / 防止色素被破坏','—','色素提取实验'],
['澄清石灰水','检测 CO₂','变浑浊','根据浑浊程度判断 CO₂ 多少'],
['溴麝香草酚蓝溶液','检测 CO₂','由蓝变绿再变黄','根据变黄时间判断 CO₂ 多少'],
['酸性重铬酸钾','检测酒精','橙色 → 灰绿色','葡萄糖也能使其变色，需耗尽葡萄糖'],
['10% NaOH 溶液','吸收 CO₂','—','酵母菌有氧组除去空气中的 CO₂'],
['0.3 g/mL 蔗糖溶液','使细胞失水','质壁分离','0.5 g/mL 会使细胞死亡'],
['解离液（15% 盐酸 + 95% 酒精 1∶1）','使组织细胞相互分离','—','根尖有丝分裂实验'],
['甲紫溶液 / 醋酸洋红液','染色体着色','深色','碱性染料，染色前需漂洗'],
['3% H₂O₂ / FeCl₃ / 肝脏研磨液','底物 / 无机催化剂 / 过氧化氢酶','气泡、卫生香复燃','肝脏要新鲜'],
['NaHCO₃ 溶液','提供 CO₂','—','光合作用相关实验'],
];

<script>/* bio/quizui.js */
/* ---------- 练习 UI ---------- */
ST.qa=ST.qa||{};
const QIDS=[];Object.keys(QZ).forEach(s=>QZ[s].forEach((_,i)=>QIDS.push(s+'#'+i)));
const qGet=id=>{const [s,i]=id.split('#');return QZ[s][+i]};
const LET='ABCD';
function qPerm(id){let a=7;for(const c of id)a=Math.imul(a^c.charCodeAt(0),2654435761)>>>0;const r=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};const n=qGet(id)[1].length,p=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]]}return p}
const qRight=id=>ST.qa[id]!=null&&ST.qa[id]===qGet(id)[2];
const qWrong=id=>ST.qa[id]!=null&&ST.qa[id]!==qGet(id)[2];
function qCard(id,no,showSec){const q=qGet(id),p=qPerm(id),a=ST.qa[id],done=a!=null,ok=done&&a===q[2],ansL=LET[p.indexOf(q[2])],s=secOf(id.split('#')[0]);
 return `<div class="qz ${done?(ok?'ok':'bad'):''}" id="q-${id.replace('#','_')}"><p class="qs"><span class="qn">${no}</span>${showSec?`<small class="qsec">${s.id.replace('-','.')} ${s.t}</small>`:''}${q[0]}（　）</p>
 <div class="qo">${p.map((oi,k)=>`<button type="button" data-qa="${id}" data-o="${oi}" class="${done?(oi===q[2]?'right':oi===a?'wrong':''):''}" ${done?'disabled':''}><b>${LET[k]}</b><span>${q[1][oi]}</span></button>`).join('')}</div>
 ${done?`<div class="qe"><p><b class="${ok?'okt':'badt'}">${ok?'回答正确':'回答错误'}</b>　正确答案：<b>${ansL}</b>${ok?'':`　你的选择：${LET[p.indexOf(a)]}`}</p><p><span class="tagx">解析</span>${q[3]}</p><button type="button" class="linkb" data-qone="${id}">重做这题</button></div>`:''}</div>`}
function qSum(ids){const d=ids.filter(i=>ST.qa[i]!=null).length,r=ids.filter(qRight).length;return `已答 <b>${d}</b> / ${ids.length} 题 · 答对 <b>${r}</b> 题${d?` · 正确率 <b>${Math.round(r/d*100)}%</b>`:''}`}
function quizBlock(ids,title,showSec,redo){return `<section class="quiz" data-qs="${ids.join(',')}"><div class="qhead"><h3>${title}</h3><span class="qsum">${qSum(ids)}</span></div>${ids.map((id,k)=>qCard(id,k+1,showSec)).join('')}${redo?`<div class="row2"><button type="button" class="btn sm" data-qredo="${ids.join(',')}">清空答案，重做${redo}</button></div>`:''}</section>`}
let QR=null,QM=null;
function vQuiz(){
 const all=QIDS.length,d=QIDS.filter(i=>ST.qa[i]!=null).length,r=QIDS.filter(qRight).length,wr=QIDS.filter(qWrong);

 return `<p class="eyebrow">PRACTICE</p><h1 class="ptitle">练习中心</h1>
 <p class="muted" style="max-width:62ch">每节配有 4～6 道选择题，答完立即显示答案和解析。题目和解析都是按教材知识点原创编写的。</p>
 <div class="stats" id="qstats">${qStats()}</div><p class="qnote">以上是累计数据，包含你在各节“本节练习”里答过的题；“随机抽 10 题”会清空这 10 题之前的作答。</p>
 <div class="row2" style="margin:16px 0"><button type="button" class="btn pri" data-qmode="rand">随机抽 10 题</button><button type="button" class="btn" data-qmode="wrong" id="qwrongb">错题本（${wr.length}）</button><a class="btn" href="#mock">限时小测</a></div>
 ${body}
 <div class="sech"><h2>按章节练习</h2></div>
 <div class="chgrid">${CH.map(c=>`<div class="chcard"><div class="chh">第${CN[+c.id-1]}章</div><h3>${c.t}</h3>${c.secs.map(s=>{const ids=QIDS.filter(i=>i.startsWith(s.id+'#')),dd=ids.filter(i=>ST.qa[i]!=null).length,rr=ids.filter(qRight).length;return `<a href="#s-${s.id}" data-goq="1">${s.id.replace('-','.')}　${s.t}<span class="qpg ${dd===ids.length&&rr===dd?'full':''}">${dd?rr+'/'+ids.length:ids.length+' 题'}</span></a>`}).join('')}</div>`).join('')}</div>`;
}
function qStats(){const all=QIDS.length,d=QIDS.filter(i=>ST.qa[i]!=null).length,r=QIDS.filter(qRight).length,w=QIDS.filter(qWrong).length;return `<span><b>${all}</b>道题</span><span><b>${d}</b>累计已答</span><span><b>${r}</b>答对</span><span><b>${d?Math.round(r/d*100):0}%</b>正确率</span><span><b>${w}</b>错题</span>`}

document.addEventListener('click',e=>{
 const a=e.target.closest('[data-qa]');if(a){const id=a.dataset.qa;ST.qa[id]=+a.dataset.o;save();const old=a.closest('.qz'),no=old.querySelector('.qn').textContent,ss=!!old.querySelector('.qsec');old.outerHTML=qCard(id,no,ss);const nw=document.getElementById('q-'+id.replace('#','_'));refreshQuiz(nw);return}
 const one=e.target.closest('[data-qone]');if(one){const id=one.dataset.qone;delete ST.qa[id];save();const old=one.closest('.qz'),no=old.querySelector('.qn').textContent,ss=!!old.querySelector('.qsec');old.outerHTML=qCard(id,no,ss);refreshQuiz(document.getElementById('q-'+id.replace('#','_')));return}
 const rd=e.target.closest('[data-qredo]');if(rd){rd.dataset.qredo.split(',').forEach(i=>delete ST.qa[i]);save();const box=rd.closest('.quiz'),y=box.getBoundingClientRect().top+scrollY-80;route(true);if(location.hash.startsWith('#s-')){const q=$('#quiz-sec');q&&window.scrollTo(0,q.getBoundingClientRect().top+scrollY-80)}else window.scrollTo(0,y);return}
 const qm=e.target.closest('[data-qmode]');if(qm){QM=qm.dataset.qmode;if(QM==='rand'){const p=QIDS.slice().sort(()=>Math.random()-.5).slice(0,10);QR=p;p.forEach(i=>delete ST.qa[i]);save()}route(true);const q=$('.quiz');q&&window.scrollTo(0,q.getBoundingClientRect().top+scrollY-80);return}
 const gq=e.target.closest('[data-goq]');if(gq){setTimeout(()=>{const q=$('#quiz-sec');q&&q.scrollIntoView({block:'start'})},80)}
},true);

<script>/* extra.js */

 let body;
 if(!all)body=`<section class="rvc"><h3>还没有要复习的内容</h3><p>在各节知识点下点“标记为已掌握”，它会在第二天出现在这里。之后答“记得”，间隔会依次拉长到 2、4、7、15、30、60 天；答“忘了”，就从头开始。</p><a class="btn pri" href="#home">去学习</a></section>`;
 else if(!due.length){const nx=Math.min(...Object.values(ST.rv).map(r=>r.d));body=`<section class="rvc"><h3>今天的复习完成了 ✓</h3><p>下一次复习在 <b>${fmtDay(nx)}</b>。明天到期 ${tm} 个。</p><div class="row2"><a class="btn" href="#mock">做一次限时小测</a><a class="btn" href="#quiz">去错题本</a></div></section>`}
 else{const k=due[0],o=kpOf(k),r=ST.rv[k];

  ${RVSHOW?`<div class="core"><span class="lab">核心结论</span><div>${o.p.core}</div></div>${o.p.exam?`<div class="exam"><span class="lab">考试怎么考</span><div>${o.p.exam}</div></div>`:''}
  <p class="small muted">对照一下，你刚才想起来多少？</p><div class="rvb"><button type="button" class="btn" data-rv="0">忘了<small>明天再来</small></button><button type="button" class="btn" data-rv="1">有点模糊<small>${RVI[r.n]} 天后</small></button><button type="button" class="btn pri" data-rv="2">记得<small>${RVI[Math.min(r.n+1,RVI.length-1)]} 天后</small></button></div><p class="small"><a href="#s-${o.s.id}" data-kp="${o.i}">回原文看“深度理解”</a></p>`
  :`<p class="muted">先别看答案，在心里（或纸上）说出这个知识点的<b>核心结论</b>和<b>常见考法</b>。</p><button type="button" class="btn pri" data-rvshow>想好了，看答案</button>`}</section>

 return `<p class="eyebrow">REVIEW</p><h1 class="ptitle">今日复习</h1>

/* 限时小测 */
let MQ=null,MQT=null,MQSET={n:10,ch:'all'};

const mmss=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function mqCard(id,no){const q=qGet(id),p=qPerm(id),a=MQ.ans[id],s=secOf(id.split('#')[0]);

 if(!MQ){const hist=ST.mh.slice(-6).reverse();
  return `<p class="eyebrow">TIMED QUIZ</p><h1 class="ptitle">限时小测</h1><p class="muted" style="max-width:64ch">模拟考试：随机抽题、倒计时，做题时<b>不显示对错</b>，可以改选；交卷或时间到后统一出分，并给出每题解析。答错的题自动进入错题本。</p>
  <section class="mqset"><div><span class="lbl">题量（每题 1 分钟）</span><div class="seg">${[10,20,30].map(n=>`<button type="button" data-mqn="${n}" aria-pressed="${MQSET.n===n}">${n} 题 · ${n} 分钟</button>`).join('')}</div></div>
  <div><span class="lbl">范围</span><div class="seg">${[['all','全书']].concat(CH.map(c=>[c.id,'第'+CN[+c.id-1]+'章'])).map(([v,l])=>`<button type="button" data-mqc="${v}" aria-pressed="${MQSET.ch===v}">${l}</button>`).join('')}</div></div>

  ${hist.length?`<section class="mqh"><h3>最近成绩</h3><table class="tb"><tr><th>时间</th><th>范围</th><th>得分</th><th>用时</th></tr>${hist.map(h=>`<tr><td>${fmtDay(h.t)}</td><td>${h.c}</td><td><b>${h.ok}</b> / ${h.n}（${Math.round(h.ok/h.n*100)}%）</td><td>${mmss(h.s*1000)}</td></tr>`).join('')}</table></section>`:''}`}
 if(!MQ.res){const d=Object.keys(MQ.ans).length;
  return `<div class="mqbar" role="timer"><span class="mqt ${mqLeft()<60000?'low':''}" data-mqt>${mmss(mqLeft())}</span><span class="mqp" data-mqp>已答 ${d} / ${MQ.ids.length}</span><button type="button" class="btn sm pri" data-mqend>交卷</button></div>

  <section class="quiz">${MQ.ids.map((id,k)=>mqCard(id,k+1)).join('')}</section>

 const R=MQ.res,byCh={};MQ.ids.forEach(id=>{const c=secOf(id.split('#')[0]).ch;const o=byCh[c.id]=byCh[c.id]||{t:c.t,n:0,ok:0};o.n++;if(MQ.ans[id]===qGet(id)[2])o.ok++});
 const wrong=MQ.ids.filter(id=>MQ.ans[id]!==qGet(id)[2]);

/* 滑条：加“−”“+”按钮，手机上也能一格一格精确调；长按连续调 */
function enhanceRanges(root){(root||document).querySelectorAll('input[type=range]:not([data-rgx])').forEach(r=>{r.dataset.rgx='1';
 const w=document.createElement('span');w.className='rgx';r.parentNode.insertBefore(w,r);

  const step=()=>{const st=parseFloat(r.step)||1,mn=parseFloat(r.min)||0,mx=parseFloat(r.max),n=(mx-mn)/st,k=Math.max(1,Math.round(n/100));const v=Math.min(mx,Math.max(mn,parseFloat(r.value)+d*st*k));const dec=(String(st).split('.')[1]||'').length;r.value=v.toFixed(dec);r.dispatchEvent(new Event('input',{bubbles:true}));r.dispatchEvent(new Event('change',{bubbles:true}))};
  let t1=null,t2=null;const stop=()=>{clearTimeout(t1);clearInterval(t2);t1=t2=null};
  b.addEventListener('pointerdown',e=>{e.preventDefault();step();t1=setTimeout(()=>{t2=setInterval(step,70)},420)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation()});
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();step()}});return b};
 w.appendChild(mk(-1,'−'));w.appendChild(r);w.appendChild(mk(1,'+'))})}

<script>/* bio2/app2.js#B */

const IDX=[];SECS.forEach(s=>{s.pts.forEach((p,k)=>IDX.push({s,k,t:p.t,txt:plain(p.core+' '+p.why+' '+(p.exam||'')),kw:(p.k||[]).join(' ')}));(s.traps||[]).forEach(t=>IDX.push({s,k:-1,t:'易错辨析',txt:t,kw:''}))});
Object.entries(HIST).forEach(([id,h])=>h.ev.forEach(e=>IDX.push({s:secOf(id),k:e[4]==null?-1:e[4],t:'发现之路：'+e[1],txt:plain(e[0]+' '+e[2]+' '+e[3]),kw:''})));
EXPS.forEach(e=>IDX.push({s:secOf(e[1]),k:-1,t:'实验：'+e[0],txt:plain(e.slice(2).join(' ')),kw:''}));
Object.entries(QZ).forEach(([sid,qs])=>qs.forEach((q,i)=>IDX.push({s:secOf(sid),k:-1,qz:'q-'+sid+'_'+i,t:'练习题',txt:q[0]+' '+q[3],kw:''})));
MK().forEach(k=>{const m=MODELS[k];IDX.push({m:k,t:'模型：'+m.t,txt:m.d,kw:''})});
function search(q){q=q.trim();const box=$('#sres');if(!q){box.hidden=true;return}
  const terms=q.split(/\s+/).filter(Boolean);
  const hits=IDX.map(x=>{let sc=0;for(const t of terms){if(x.t.includes(t))sc+=5;if(x.kw.includes(t))sc+=3;if(x.txt.includes(t))sc+=1;else if(!x.t.includes(t)&&!x.kw.includes(t))return null}return {x,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,24);
  const mk=s=>{let o=esc(s);terms.forEach(t=>{o=o.split(esc(t)).join(`<mark>${esc(t)}</mark>`)});return o};
  const snip=txt=>{const i=txt.indexOf(terms[0]);return i<0?txt.slice(0,60):(i>20?'…':'')+txt.slice(Math.max(0,i-20),i+60)};
  box.innerHTML=hits.length?hits.map(({x})=>x.m?`<a href="#m-${x.m}"><small>模型馆</small>${mk(x.t)}<span>${mk(snip(x.txt))}</span></a>`:`<a href="#s-${x.s.id}" data-kp="${x.k}"${x.qz?` data-qz="${x.qz}"`:''}><small>${x.s.id.replace('-','.')} ${x.s.t}</small>${mk(x.t)}<span>${mk(snip(x.txt))}</span></a>`).join(''):`<a><span>没有找到“${esc(q)}”。试试换个关键词，例如“线粒体”“斐林”“质壁分离”。</span></a>`;
  box.hidden=false}

<script>/* bio2/ai.js */
/* ---------- AI 答疑 ---------- */
const AI=(()=>{
 let sample=null,ready=false,turns=[],busy=null,img=null,canImg=false,open=false;
 const RULES=`你是一位耐心、讲得清楚的高中生物老师，正在帮学生学习人教版（2019 年版）普通高中教科书《生物学 必修 1 分子与细胞》。请遵守：
1. 用简体中文回答。先用一两句话直接给出结论，再分步骤讲清“为什么”，必要时用生活中的例子或类比帮助理解。
2. 如果问题和考试有关，最后另起一行写“考试提示：”，用一两句话说明常见考法或易错点。
3. 篇幅适中，一般不超过 300 字；学生要求详细讲解时可以更长。
4. 格式只用 **加粗**、以“- ”开头的列表、以“1. ”开头的编号和空行分段；不要用表格、标题符号和 LaTeX。化学式用 Unicode 下标，如 CO₂、C₆H₁₂O₆。
5. 以教材为准。学生消息末尾会附上网站里与问题相关的教材要点，优先依据它们；不确定的内容要直说，不要编造实验数据或年份。
6. 问题超出必修 1 时，简短说明它属于哪部分内容，仍给出基本解答。
7. 学生发来题目图片时，先把题目读出来，再给出解题思路和答案。
8. 学生让你出题时，出一道题并先不给答案，等学生作答后再讲评。`;
 const esc2=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 function md(s){const lines=esc2(s).split('\n');let out='',list=null;const close=()=>{if(list){out+=`</${list}>`;list=null}};
  const inl=t=>t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  for(const raw of lines){const l=raw.trim();let m;
   if(!l){close();continue}
   if((m=l.match(/^[-•*]\s+(.*)/))){if(list!=='ul'){close();out+='<ul>';list='ul'}out+=`<li>${inl(m[1])}</li>`;continue}
   if((m=l.match(/^(\d+)[.、)]\s*(.*)/))){if(list!=='ol'){close();out+='<ol>';list='ol'}out+=`<li>${inl(m[2])}</li>`;continue}
   close();const h=l.match(/^#{1,4}\s+(.*)/);if(h){out+=`<p><b>${inl(h[1])}</b></p>`;continue}
   out+=l.startsWith('考试提示')?`<p class="aitip">${inl(l)}</p>`:`<p>${inl(l)}</p>`}
  close();return out}
 /* 本地检索：中文按双字切分打分 */
 const grams=s=>{const g=new Set();const t=s.replace(/[\s，。？！、,.?!“”"'：:；;（）()]/g,'');for(let i=0;i<t.length-1;i++)g.add(t.slice(i,i+2));for(const w of s.match(/[A-Za-z0-9₀-₉⁺⁻]+/g)||[])g.add(w);return [...g]};
 function retrieve(q,n=4){const gs=grams(q);if(!gs.length)return [];
  return IDX.filter(x=>x.s&&x.k>=0&&!x.qz).map(x=>{let sc=0;for(const g of gs){if(x.t.includes(g))sc+=4;if(x.kw.includes(g))sc+=3;if(x.txt.includes(g))sc+=1}return {x,sc}}).filter(o=>o.sc>2).sort((a,b)=>b.sc-a.sc).slice(0,n).map(o=>o.x)}
 const ptOf=x=>x.s.pts[x.k];
 function refs(hits){return hits.map(x=>{const p=ptOf(x);return `【${x.s.id.replace('-','.')} ${x.s.t} · ${p.t}】核心结论：${p.core.replace(/<[^>]+>/g,'')}${p.exam?' 考法：'+p.exam.replace(/<[^>]+>/g,''):''}`.slice(0,520)}).join('\n')}
 function curSec(){const h=location.hash||'';return h.startsWith('#s-')?secOf(h.slice(3)):null}
 const $p=s=>document.querySelector('#aip '+s);
 function mount(){
  const b=document.createElement('button');b.id='aib';b.type='button';b.innerHTML='<span>AI</span>问老师';b.setAttribute('aria-label','打开 AI 答疑');document.body.appendChild(b);
  const p=document.createElement('aside');p.id='aip';p.hidden=true;p.setAttribute('aria-label','AI 答疑');
  p.innerHTML=`<header><div><b data-ttl>AI 答疑老师</b><small data-mode>正在连接…</small></div><button type="button" class="aix" data-close aria-label="关闭">×</button></header>
  <div class="ailog" data-log></div>
  <div class="aiin"><div class="aiimg" data-imgchip hidden></div><textarea data-q rows="2" placeholder="哪里不懂就问，例如：为什么暗反应离不开光反应？"></textarea>
  <div class="aibar"><label class="aiup" data-up hidden><input type="file" accept="image/*" data-file hidden>传题目图片</label><button type="button" class="btn sm" data-clear>清空对话</button><button type="button" class="btn sm" data-stop hidden>停止</button><button type="button" class="btn sm pri" data-send>发送</button></div></div>`;
  document.body.appendChild(p);
  b.onclick=()=>toggle(true);$p('[data-close]').onclick=()=>toggle(false);
  $p('[data-send]').onclick=()=>send();$p('[data-q]').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
  $p('[data-stop]').onclick=()=>busy&&busy.abort();$p('[data-clear]').onclick=()=>{if(busy)busy.abort();turns=[];render()};
  $p('[data-file]').onchange=e=>{const f=e.target.files[0];if(!f)return;img=f;const u=URL.createObjectURL(f);const c=$p('[data-imgchip]');c.hidden=false;c.innerHTML=`<img src="${u}" alt="题目图片"><span>已附上题目图片</span><button type="button" aria-label="移除图片">×</button>`;c.querySelector('button').onclick=()=>{img=null;c.hidden=true;c.innerHTML='';e.target.value=''}};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&open)toggle(false)});
  render();
  (async()=>{try{sample=window.claude&&await window.claude.use('sample')}catch(e){sample=null}ready=true;
   if(sample){try{const L=await sample.limits();canImg=!!(L&&L.images)}catch(e){}$p('[data-up]').hidden=!canImg}
   $p('[data-mode]').textContent=sample?'由 Claude 回答 · 会结合你正在看的这一节':'检索模式 · 从本书内容里找答案';if(!sample){$p('[data-ttl]').textContent='答疑助手';b.innerHTML='<span>?</span>答疑';b.setAttribute('aria-label','打开答疑助手')}render()})()}
 function toggle(v){open=v;document.getElementById('aip').hidden=!v;document.body.classList.toggle('aiopen',v);if(v)setTimeout(()=>$p('[data-q]').focus(),50)}
 function chips(){const s=curSec();let q=s?[`用更通俗的话，讲讲“${s.t}”这一节最难懂的地方`,`出一道“${s.t}”的选择题考考我`,`这一节和其他章节有什么联系？`]:['光合作用和细胞呼吸有什么联系？','怎样区分自由扩散、协助扩散和主动运输？','出一道高频考点的选择题考考我'];
  if(ready&&!sample)q=q.filter(x=>!x.includes('出一道'));return `<div class="aichips">${q.map(x=>`<button type="button" data-ask-q="${esc2(x)}">${esc2(x)}</button>`).join('')}</div>`}
 function render(){const log=$p('[data-log]');if(!log)return;
  const intro=`<div class="aimsg ai"><p>你好！看书时哪里不懂、哪道题不会，都可以问我。${sample?'我会结合你正在看的这一节来讲。':ready?'</p><div class="aioff"><b>说明：</b>这个公开网页版没有接入 AI 对话。你输入问题后，我会从本书内容里找出最相关的知识点。<br>想要 AI 一步步讲解？每次回答下面都有“复制提问”按钮：问题和相关教材要点会一起复制，粘贴到豆包、Kimi、DeepSeek 等任意 AI 应用里就能问。</div><p>':''}</p>${chips()}</div>`;

  log.querySelectorAll('.airefs a').forEach(a=>a.addEventListener('click',()=>{if(window.innerWidth<760)toggle(false)}));
  log.scrollTop=log.scrollHeight}
 const ERR={not_granted:'你没有允许这个页面使用 Claude，所以 AI 回答用不了。可以在页面的“权限”菜单里重新允许。',sampling_disabled:'这个账号暂时不能使用 AI 回答。',rate_limited:'问得太快了，或者已达到用量上限，请稍后再试。',session_expired:'登录已过期，请重新登录 Claude 后再试。',refused:'这个问题我没法回答，换个问法试试。',image_rejected:'这张图片用不了，换一张清晰些的 JPG 或 PNG 试试。',prompt_too_large:'内容太长了，请把问题缩短一些，或者先清空对话。',empty_completion:'没有生成回答，换个问法试试。'};
 async function send(q){const box=$p('[data-q]');q=(q||box.value).trim();if(busy)return;if(!q&&!img)return;if(!q)q='请帮我解这道题，讲清楚思路。';box.value='';
  const s=curSec(),hits=retrieve(q+(s?' '+s.t:''));

  const a={role:'assistant',content:'',refs:hits,html:'<p class="aithink">思考中…</p>'};turns.push(a);render();
  const ctx=s?`\n\n【学生正在看的一节】${s.id.replace('-','.')} ${s.t}：${s.pts.map(p=>p.t).join('、')}`:'';
  const msg=q+ctx+(hits.length?`\n\n【网站中的相关教材要点】\n${refs(hits)}`:'');
  const hist=turns.slice(0,-2).filter(t=>t.content&&!t.err).slice(-8).map(t=>({role:t.role,content:t.content}));
  while(hist.length&&hist[0].role!=='user')hist.shift();
  const ctl=new AbortController();busy=ctl;$p('[data-stop]').hidden=false;$p('[data-send]').disabled=true;
  const opts={signal:ctl.signal,cache:false,onText:({text})=>{a.content=text;a.html=null;const last=$p('[data-log]').lastElementChild;if(last){last.innerHTML=md(text);$p('[data-log]').scrollTop=1e9}}};
  if(img&&canImg)opts.images=img;
  try{const r=await sample([{role:'user',content:RULES},...hist,{role:'user',content:msg}],opts);a.content=r.text;a.html=null;if(r.truncated)a.err='回答太长被截断了，可以让我“接着讲”。'}
  catch(e){a.content=e&&e.text||'';a.html=a.content?null:'';if(e&&e.code!=='cancelled')a.err=ERR[e.code]||'网络出了点问题，回答中断了，可以再发一次。';if(e&&(e.code==='not_granted'||e.code==='sampling_disabled')){sample=null;$p('[data-mode]').textContent='AI 回答不可用：只能从本书内容里检索答案'}if(!a.content&&!a.err)turns.splice(turns.indexOf(a),1)}
  finally{busy=null;img=null;const c=$p('[data-imgchip]');c.hidden=true;c.innerHTML='';$p('[data-file]').value='';$p('[data-stop]').hidden=true;$p('[data-send]').disabled=false;render()}}
 function ask(q){toggle(true);send(q)}
