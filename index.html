/* Layout: a lab manual — fixed chapter index on the left (drawer on phones), one reading column on the right; models sit in stained "slide" frames. Palette from H&E histology stain: hematoxylin violet + eosin pink. */
:root{
  --paper:#f5f4f9; --surface:#ffffff; --sunk:#efedf5; --ink:#1e1a2e; --muted:#5f5975; --line:#dcd8e8;
  --hema:#4b3a94; --hema-soft:#e9e5f7; --eosin:#c83a74; --eosin-soft:#fbe6ef; --ok:#1f8a5a; --warn:#b45a12;
  --mito:#f0a35a; --mito-d:#b8641e; --chl:#5fb36a; --chl-d:#2c7a3a; --er:#5a8fd8; --golgi:#d9619a; --nuc:#b9a7ea; --nucl:#6b4fc8;
  --lys:#e2574c; --vac:#bfe6f2; --ribo:#3d3550; --cyto:#fbf6e9; --memc:#8f7a4a; --wall:#9fc77f; --prot:#7c6bd6; --prot2:#a99ae8;
  --head:#e8a33d; --tail:#c9b98a; --sug:#d9619a; --phos:#e8a33d; --sugarc:#f3d36b;
  --display:"Noto Serif SC","Songti SC","STSong",serif; --body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121019; --surface:#1a1724; --sunk:#221e30; --ink:#ebe8f5; --muted:#a39db8; --line:#2f2a40;
  --hema:#a99cf2; --hema-soft:#2a2445; --eosin:#f07aa8; --eosin-soft:#3a1c2b; --ok:#4cc48a; --warn:#f0a050;
  --mito:#d98a45; --mito-d:#f2b77a; --chl:#4b9a56; --chl-d:#8fd69a; --er:#6f9fe6; --golgi:#e07aaa; --nuc:#4c3f80; --nucl:#9f86f0;
  --lys:#e66a60; --vac:#2b5566; --ribo:#d9d2ef; --cyto:#262033; --memc:#c9b07a; --wall:#5f8f48; --prot:#8f80e6; --prot2:#6c5dc4;
  --head:#e0a04a; --tail:#7f7458; --sug:#e07aaa; --phos:#d99a3e; --sugarc:#b89a3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121019; --surface:#1a1724; --sunk:#221e30; --ink:#ebe8f5; --muted:#a39db8; --line:#2f2a40;
  --hema:#a99cf2; --hema-soft:#2a2445; --eosin:#f07aa8; --eosin-soft:#3a1c2b; --ok:#4cc48a; --warn:#f0a050;
  --mito:#d98a45; --mito-d:#f2b77a; --chl:#4b9a56; --chl-d:#8fd69a; --er:#6f9fe6; --golgi:#e07aaa; --nuc:#4c3f80; --nucl:#9f86f0;
  --lys:#e66a60; --vac:#2b5566; --ribo:#d9d2ef; --cyto:#262033; --memc:#c9b07a; --wall:#5f8f48; --prot:#8f80e6; --prot2:#6c5dc4;
  --head:#e0a04a; --tail:#7f7458; --sug:#e07aaa; --phos:#d99a3e; --sugarc:#b89a3a; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--hema)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--eosin);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:13px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{display:flex;align-items:center;gap:12px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.brand svg{width:30px;height:30px}
.brand b{font-family:var(--display);font-size:18px;font-weight:900;letter-spacing:.02em}
.brand small{display:block;font-size:11px;color:var(--muted);line-height:1.2;letter-spacing:.06em}
.menu{display:none;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:6px 10px;font-size:14px}
.sbox{margin-left:auto;position:relative;flex:1;max-width:380px;min-width:0}
.sbox input{width:100%;font:inherit;font-size:15px;padding:8px 12px 8px 34px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
.sbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(20,10,40,.18);max-height:min(70vh,520px);overflow-y:auto;z-index:40}
.sres a{display:block;padding:10px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.sres a:last-child{border-bottom:0}
.sres small{display:block;color:var(--muted);font-size:12px}
.sres span{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
mark{background:var(--eosin-soft);color:var(--eosin);padding:0 1px;border-radius:2px}

/* layout */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:32px;max-width:1240px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);align-self:start;max-height:calc(100vh - 96px);overflow-y:auto;padding-right:4px}
.side .ch{margin-bottom:14px}
.side .chh{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.side .cht{font-family:var(--display);font-weight:600;font-size:15px;margin:2px 0 6px}
.side a{display:flex;gap:8px;align-items:baseline;font-size:14px;line-height:1.45;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none}
.side a:hover{background:var(--sunk)}
.side a.on{background:var(--hema-soft);color:var(--hema);font-weight:700}
.side a .n{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;width:28px}
.side a .pg{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
.side a .pg.full{color:var(--ok)}

/* section page */

.row2{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
input[type=range]{width:100%;accent-color:var(--hema)}

.c-lys{fill:var(--lys)}.c-lys-d{fill:var(--surface)}

.c-vesi{fill:var(--golgi);opacity:.8}
.c-nucd{fill:var(--nuc);opacity:.55}.c-nucd-l{fill:none;stroke:var(--nucl);stroke-width:2}
.c-pla{fill:none;stroke:var(--nucl);stroke-width:2.5}
.c-flag{fill:none;stroke:var(--memc);stroke-width:3;stroke-linecap:round}
.c-fov{fill:var(--cyto)}.c-ring{fill:none;stroke:var(--ink);stroke-width:4}.c-dark{fill:#000}
.c-scell{fill:var(--chl);opacity:.35;stroke:var(--chl-d);stroke-width:1.5}.c-snuc{fill:var(--nucl);opacity:.7}

.c-glass{fill:var(--surface);stroke:var(--muted);stroke-width:2}
.c-phos{fill:var(--phos)}.c-sugar{fill:var(--sugarc);stroke:var(--warn);stroke-width:1.5}
.c-base{stroke:var(--ink);stroke-width:1}.b-A{fill:#d9534f}.b-T{fill:#e0a02a}.b-U{fill:#2d9a6a}.b-G{fill:#3b7dd8}.b-C{fill:#8a5cc8}
.c-head{fill:var(--head)}.c-tail{fill:none;stroke:var(--tail);stroke-width:1.8}

.c-vesi2{fill:var(--golgi);opacity:.45;stroke:var(--golgi)}

.hlx2{stroke:var(--eosin)!important;stroke-width:4!important}

.axis{stroke:var(--muted);stroke-width:1.2}.dash{stroke:var(--muted);stroke-dasharray:3 3}.dash2{stroke:var(--eosin);stroke-dasharray:3 3}
.c-curve{fill:none;stroke:var(--hema);stroke-width:3}.c-curve2{fill:none;stroke:var(--hema);stroke-width:2.5}
.c-ea{stroke:var(--eosin);stroke-width:2}

/* quiz */
.quiz{margin-top:28px;max-width:72ch;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:4px}
.qhead h3{font-size:20px}.qsum{font-size:13px;color:var(--muted)}.qsum b{color:var(--ink);font-family:var(--mono)}
.qz{padding:14px 0;border-bottom:1px solid var(--line)}
.qz:last-of-type{border-bottom:0}
.qs{margin:0 0 8px;font-weight:500}
.qn{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:6px;background:var(--hema-soft);color:var(--hema);font-family:var(--mono);font-size:12px;margin-right:8px;vertical-align:2px}
.qsec{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-bottom:2px}
.qo{display:grid;gap:6px}
.qo button{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-size:15px;line-height:1.55}
.qo button:not(:disabled):hover{border-color:var(--hema)}
.qo button b{font-family:var(--mono);color:var(--muted)}
.qo button:disabled{cursor:default;opacity:.75}
.qo button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface));opacity:1}.qo button.right b{color:var(--ok)}
.qo button.wrong{border-color:var(--eosin);background:var(--eosin-soft);opacity:1}.qo button.wrong b{color:var(--eosin)}
.qe{margin-top:10px;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:15px}
.qe p{margin:.2em 0}
.okt{color:var(--ok)}.badt{color:var(--eosin)}
.tagx{font-family:var(--mono);font-size:11px;letter-spacing:.1em;background:var(--hema);color:var(--surface);border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.linkb{border:0;background:none;color:var(--hema);font-size:13px;padding:4px 0;text-decoration:underline}
.qpg{float:right;font-family:var(--mono);font-size:11px;color:var(--muted)}.qpg.full{color:var(--ok)}
/* drawer & phones */
.scrim{display:none}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .menu{display:inline-flex}
  .brand small{display:none}
  .side{position:fixed;top:0;left:0;bottom:0;width:min(86vw,320px);max-height:none;z-index:50;background:var(--surface);border-right:1px solid var(--line);
    padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px;transform:translateX(-105%);transition:transform .25s}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,5,20,.4);z-index:45}
  .mgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){.brand b{font-size:16px}.sbox input{font-size:14px}}
@media (prefers-reduced-motion:reduce){.lip{animation:none}.side{transition:none}*{transition:none!important}}

/* ---- v2：三层讲解 + 考频 ---- */
.stars{font-size:13px;letter-spacing:1px;color:var(--eosin);white-space:nowrap;flex:none;margin-left:auto}
.stars i{font-style:normal;color:var(--line)}
.kph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kp.lv3 .kph h3::after{content:"高频";font-family:var(--body);font-size:11px;font-weight:700;color:var(--surface);background:var(--eosin);border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:3px}
.core,.exam{border-radius:12px;padding:12px 14px;margin:12px 0;font-size:16px;line-height:1.75}
.core{background:var(--hema-soft);border-left:4px solid var(--hema)}
.core b{color:var(--hema)}
.exam{background:var(--eosin-soft);border-left:4px solid var(--eosin);font-size:15px}
.lab{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;font-weight:700;margin-bottom:2px}
.core .lab{color:var(--hema)}.exam .lab{color:var(--eosin)}

{id:'1-1',t:'细胞是生命活动的基本单位',
 goal:'读完这一节，你应该能回答：细胞学说说了什么、为什么说它阐明了“统一性”；科学家是怎样一步步得出这个结论的；为什么细胞而不是分子、病毒是“最基本的生命系统”。',
 focus:[[3,'细胞学说的内容与意义（揭示统一性，不涉及多样性）'],[3,'生命系统的结构层次判断（种群、群落、生态系统；单细胞生物；植物无系统）'],[2,'细胞学说建立过程中各科学家的贡献'],[2,'完全归纳法与不完全归纳法'],[2,'病毒与细胞的关系']],
 models:['levels'],
 pts:[
 {t:'细胞学说的三条要点',lv:3,k:['施莱登','施旺','细胞产物'],
  core:'① 细胞是一个有机体，一切<b>动植物</b>都由细胞发育而来，并由<b>细胞和细胞产物</b>所构成；② 细胞是一个<b>相对独立</b>的单位，既有自己的生命，又对与其他细胞共同组成的整体生命起作用；③ <b>新细胞是由老细胞分裂产生的</b>。',
  why:`逐句拆开看，每句话都有“限定词”，考试就考这些限定词。
<ul><li><b>“一切动植物”</b>：施莱登研究植物、施旺研究动物，结论只覆盖动植物。细菌、真菌在当时没被纳入，病毒更是没有细胞结构。所以“一切生物都由细胞构成”是错误表述。</li>
<li><b>“细胞和细胞产物”</b>：生物体不只由细胞组成，还有细胞分泌到细胞外的物质，例如骨组织中的骨基质、血浆中的蛋白质、植物的细胞壁成分。</li>
<li><b>“相对独立”</b>：每个细胞自己进行代谢，有自己的生命；但在多细胞生物中又要服从整体，例如肌细胞收缩要听从神经细胞的指挥。</li>
<li><b>“新细胞由老细胞分裂产生”</b>：这一条是魏尔肖补充修正的。施莱登原本以为新细胞是从老细胞核里“长”出来的，或像结晶一样从细胞质中析出，这是错误的。</li></ul>`,
  exam:'常见判断题：“细胞学说认为一切生物都由细胞构成”（错，是一切动植物）；“细胞学说认为新细胞从老细胞的细胞核中产生”（错，这是施莱登的错误观点）；“细胞是一个绝对独立的单位”（错，是相对独立）。'},
 {t:'细胞学说的建立过程',lv:2,k:['维萨里','比夏','胡克','列文虎克','马尔比基','耐格里','魏尔肖'],
  core:'从器官 → 组织 → 细胞的观察逐步深入，再由施莱登、施旺概括成理论，最后由魏尔肖修正完善。',
  why:`把建立过程理解成四个阶段，每个阶段都对应一种科学方法：
<table class="tb"><tr><th>阶段</th><th>人物与贡献</th><th>说明了什么</th></tr>
<tr><td>解剖观察：器官→组织</td><td><b>维萨里</b>（1543）揭示人体器官水平结构；<b>比夏</b>指出器官由组织构成</td><td>认识需要逐层深入</td></tr>
<tr><td>显微观察：认识细胞</td><td><b>罗伯特·胡克</b>（1665）观察<b>木栓组织</b>，命名 cell，看到的是<b>死细胞</b>的细胞壁；<b>列文虎克</b>观察到细菌、红细胞、精子等<b>活细胞</b>；马尔比基观察了细胞壁和细胞质</td><td>科学发现依赖技术（显微镜）进步</td></tr>
<tr><td>归纳概括：形成理论</td><td><b>施莱登</b>（1838，植物）观察花粉、胚珠、柱头，提出植物细胞学说；<b>施旺</b>（1839，动物）证明动物也由细胞构成，个体发育从受精卵开始</td><td>观察 + 归纳概括</td></tr>
<tr><td>修正中前进</td><td><b>耐格里</b>发现新细胞是细胞分裂的结果；<b>魏尔肖</b>（1858）总结“细胞通过分裂产生新细胞”</td><td>科学理论需要不断修正</td></tr></table>
注意：170 多年间人们积累了大量观察资料，却没有归纳概括，直到施莱登和施旺才把“现象”上升为“理论”。这说明只有观察还不够，还要思维加工。`,
  exam:'常考“谁观察到了什么”：胡克——木栓组织、死细胞、命名细胞；列文虎克——活细胞。也常考“对科学发现的启示”：重视观察与实证；需要归纳和概括；依赖技术进步；理论在不断修正中完善。'},
 {t:'细胞学说的意义',lv:3,k:['统一性','细胞水平','进化论'],
  core:'细胞学说揭示了<b>动物和植物的统一性</b>，从而阐明了<b>生物界的统一性</b>；使生物学研究由器官、组织水平进入<b>细胞水平</b>，并为后来进入分子水平打下基础；“细胞分裂产生新细胞”为<b>生物进化论</b>的确立埋下了伏笔。',
  why:`<ul><li><b>为什么是“统一性”而不是“多样性”？</b>细胞学说的核心是“动植物都由细胞构成”，强调的是动植物在结构上的共同基础，打破了植物学与动物学之间的壁垒。它没有讨论“细胞为什么各不相同”。</li>
<li><b>为什么和进化论有关？</b>如果新细胞都来自老细胞，往上追溯，现代生物的细胞都是远古细胞的后代，每个细胞都凝聚着漫长的进化史。反过来，如果细胞可以从无机环境中随时“自然发生”，进化观点就失去了基础。</li>
<li>细胞学说和进化论一起，被恩格斯列入 19 世纪自然科学三大发现。</li></ul>`,
  exam:'选择题高频陷阱：“细胞学说揭示了细胞的多样性”“揭示了动物细胞与植物细胞的区别”“揭示了原核细胞与真核细胞的区别”都是错的。正确答案通常是“揭示了生物体结构的统一性”。'},
 {t:'归纳法：完全归纳与不完全归纳',lv:2,k:['归纳法','不完全归纳法'],
  core:'由一系列具体事实推出一般结论的思维方法叫<b>归纳法</b>。观察了全部对象才下结论是<b>完全归纳法</b>；只根据部分对象下结论是<b>不完全归纳法</b>。',
  why:`施莱登只观察了部分植物的细胞，就得出“植物都由细胞构成、细胞都有细胞核”，属于不完全归纳。
<ul><li>不完全归纳得出的结论<b>很可能是可信的</b>，可以用来预测和判断，科学研究中经常使用。</li>
<li>但要注意<b>可能存在例外</b>。例如“植物细胞都有细胞核”就有例外：高等植物成熟的<b>筛管细胞</b>没有细胞核。</li></ul>`,
  exam:'题目给出一个推理过程，判断用的是哪种归纳法。只要不是“所有对象都观察过”，就是不完全归纳法。'},
 {t:'细胞是生命活动的基本单位',lv:2,k:['单细胞生物','多细胞生物','病毒','缩手反射'],
  core:'单细胞生物依靠一个细胞完成全部生命活动；多细胞生物依赖各种<b>分化的细胞密切合作</b>完成复杂生命活动；病毒没有细胞结构，但必须<b>寄生在活细胞</b>中才能增殖。所以，生命活动离不开细胞。',
  why:`教材从四个方面论证“细胞是生命活动的基本单位”：
<ol><li>以<b>细胞代谢</b>为基础的各种生理活动；</li><li>以<b>细胞增殖、分化</b>为基础的生长发育；</li><li>以细胞内<b>基因的传递和变化</b>为基础的遗传与变异；</li><li>多细胞生物的复杂活动由多种细胞协作完成，例如<b>缩手反射</b>需要感觉神经元、中间神经元、运动神经元和肌细胞依次参与。</li></ol>
<b>为什么病毒也支持这个观点？</b>病毒只有核酸和蛋白质，没有核糖体，不能自己合成蛋白质，也没有独立的代谢和能量系统。它只能进入活细胞，利用宿主细胞的原料、能量和核糖体来复制自己。离开活细胞，病毒就不表现生命活动。
<p class="warn">“离体的叶绿体在一定条件下能释放氧气”不能说明细胞是生命活动的基本单位，因为叶绿体只是细胞的一部分，完成的是一项化学反应，不是完整的生命活动。</p>`,
  exam:'常见题型：判断某个事实是否支持“细胞是生命活动的基本单位”。支持的：草履虫能运动和分裂；人体发育离不开细胞分裂分化；抓握物体需要神经细胞和肌细胞协调。不支持的：离体叶绿体放氧、离体的酶催化反应。'},
 {t:'生命系统的结构层次',lv:3,k:['细胞','组织','器官','系统','个体','种群','群落','生态系统','生物圈'],
  core:'<span class="chain">细胞 → 组织 → 器官 → 系统 → 个体 → 种群 → 群落 → 生态系统 → 生物圈</span><b>细胞</b>是最基本的生命系统；<b>生物圈</b>是最大的生命系统。',
  why:`<b>什么叫“系统”？</b>彼此间相互作用、相互依赖的组分有规律地结合而形成的整体。一个分子也是系统，但它不能独立表现生命活动，所以<b>不是生命系统</b>。
<ul><li><b>为什么细胞是最基本的？</b>比细胞更小的结构（分子、细胞器）都不能单独完成生命活动；而组织、器官、个体乃至生态系统的形成、维持和运转都以细胞为基础，连生态系统的能量流动和物质循环也不例外。</li>
<li><b>植物没有“系统”层次</b>：植物由根、茎、叶、花、果实、种子六大器官直接构成个体。</li>
<li><b>单细胞生物</b>（草履虫、细菌、衣藻）：一个细胞就是一个个体，既属于细胞层次又属于个体层次，没有组织、器官、系统。</li>
<li><b>病毒</b>不属于任何一个层次。</li></ul>
<b>三个容易混的概念</b>（都要加上“一定区域”）：
<table class="tb"><tr><th>层次</th><th>包含什么</th><th>典型例子</th></tr>
<tr><td>种群</td><td>同一区域<b>同种</b>生物的<b>所有个体</b></td><td>一片竹林中所有的冷箭竹</td></tr>
<tr><td>群落</td><td>同一区域<b>所有生物</b>（所有种群）</td><td>一个池塘中的全部生物</td></tr>
<tr><td>生态系统</td><td>群落 + <b>无机环境</b></td><td>一个池塘；一个培养基上长出的菌落连同培养基</td></tr></table>`,
  exam:'几乎每次都考“判断属于哪个层次”。解题口诀：先看是不是同一种生物（种群），再看是不是全部生物（群落），最后看有没有无机环境（生态系统）。“一个池塘中的全部鱼”什么都不是：鱼有很多种，又不是全部生物。'}],
 traps:['“胡克发现了活细胞”错：胡克看的是木栓组织中的死细胞，列文虎克观察到了活细胞。','“细胞学说揭示了生物的多样性”错：揭示的是统一性。','“一个池塘中的全部鱼是一个种群”错：鱼不止一种，也不是全部生物，什么层次都不是。','“病毒是最简单的生命系统”错：病毒不属于生命系统的任何层次。','“所有生物都有组织、器官、系统层次”错：单细胞生物没有，植物没有系统。']},

{id:'1-2',t:'细胞的多样性和统一性',
 goal:'这一节要掌握两件事：一是会规范地使用高倍显微镜，会算放大倍数、会判断装片移动方向；二是能从结构上区分原核细胞和真核细胞，并说清楚它们统一在哪里。',
 focus:[[3,'原核细胞与真核细胞的根本区别及常见生物的归类'],[3,'高倍镜使用步骤和放大倍数相关计算'],[2,'蓝细菌的特点（无叶绿体却能光合）'],[2,'细胞统一性的表现与原因'],[1,'支原体的结构特点']],
 models:['scope','prokaryote','cell3d'],
 pts:[
 {t:'高倍显微镜的使用步骤',lv:3,k:['低倍镜','转换器','细准焦螺旋','反光镜'],
  core:'<span class="chain">① 低倍镜下找到物像并观察清楚 → ② 把目标移到视野中央 → ③ 转动转换器换成高倍物镜 → ④ 调细准焦螺旋使物像清晰，视野暗时调亮</span>',
  why:`<b>为什么必须先用低倍镜？</b>低倍镜视野范围大，容易找到目标；高倍镜视野只有低倍镜的一小部分，直接用高倍镜很难找到物像。
<b>为什么要先把目标移到视野中央？</b>换高倍镜后看到的只是原来视野正中间的一小块，目标不在中央就会“消失”。
<b>为什么换高倍后只能用细准焦螺旋？</b>高倍物镜很长，与装片的距离很近，转动粗准焦螺旋镜筒升降幅度大，容易压碎玻片、损伤镜头。
<b>换高倍后视野为什么变暗？</b>放大后，进入物镜的光线分布到更大的成像面积上，单位面积亮度下降。可以换用<b>大光圈</b>或<b>凹面镜</b>。`,
  exam:'排序题：把操作步骤按正确顺序排列。判断题：“换高倍镜前先升高镜筒”（错，直接转转换器）；“换高倍后用粗准焦螺旋调焦”（错）。'},
 {t:'放大倍数与视野的计算',lv:3,k:['放大倍数','目镜','物镜','倒像'],
  core:'放大倍数 = 目镜倍数 × 物镜倍数，指的是物体<b>长度或宽度</b>的放大倍数，不是面积。显微镜成<b>倒立</b>的像（上下、左右都颠倒），物像偏哪里，装片就往哪里移。',
  why:`<b>细胞数目怎么算？</b>
<ul><li>视野中<b>一行</b>细胞（一维）：放大倍数变为原来的 n 倍，看到的细胞数变为原来的 <b>1/n</b>。</li>
<li>视野中<b>充满</b>细胞（二维）：看到的细胞数变为原来的 <b>1/n²</b>。</li></ul>
例：100 倍下视野充满 64 个细胞，换成 400 倍（n = 4），能看到 64 ÷ 16 = 4 个。
<b>镜头怎么区分？</b>目镜无螺纹，越<b>长</b>倍数越<b>低</b>；物镜有螺纹，越<b>长</b>倍数越<b>高</b>，离装片越近。
<b>倒像怎么理解？</b>相当于把纸旋转 180°。装片上写“b”，视野中看到“q”。细胞质环流方向在视野中是顺时针，实际也是顺时针（旋转 180° 不改变转动方向）。
<b>偏哪移哪：</b>物像在视野左上方，实际物体在装片的右下方，要让物像回到中央，装片应向<b>左上方</b>移动。`,
  exam:'计算题必考“一行/充满”两种情况；还常考“视野中细胞质顺时针流动，实际是逆时针还是顺时针”（实际也是顺时针）。'},
 {t:'原核细胞与真核细胞的区别',lv:3,k:['拟核','核膜','核糖体','染色体'],
  core:'根据细胞内<b>有无以核膜为界限的细胞核</b>，把细胞分为真核细胞和原核细胞。由真核细胞构成的是真核生物（植物、动物、真菌等），由原核细胞构成的是原核生物（主要是各种细菌）。',
  why:`<table class="tb"><tr><th></th><th>原核细胞</th><th>真核细胞</th></tr>
<tr><td>细胞核</td><td>无核膜、核仁；DNA 集中在<b>拟核</b>区域</td><td>有核膜包被的细胞核</td></tr>
<tr><td>DNA 存在形式</td><td><b>环状</b>DNA，裸露，不与蛋白质结合，<b>无染色体</b></td><td>主要与蛋白质结合成染色质（染色体）</td></tr>
<tr><td>细胞器</td><td>只有<b>核糖体</b></td><td>核糖体、线粒体、内质网、高尔基体等多种</td></tr>
<tr><td>细胞壁</td><td>多数有，成分主要是肽聚糖（支原体没有）</td><td>植物有（纤维素和果胶），真菌有，动物无</td></tr>
<tr><td>大小</td><td>较小，多数细菌直径 0.5～5.0 μm</td><td>较大</td></tr></table>
<b>为什么叫“原”核和“真”核？</b>“原”有原始的意思，原核细胞结构简单，没有真正成形的细胞核；可以据此推测：原核生物出现得更早，真核生物可能由原始的原核生物进化而来。`,
  exam:'最常考“判断依据”：判断某生物是原核生物的主要依据是“没有以核膜包被的细胞核”。注意“没有线粒体”“有细胞壁”都不是判断依据（蛔虫细胞也无线粒体，植物细胞也有细胞壁）。'},
 {t:'常见原核生物与“易混”生物',lv:3,k:['细菌','蓝细菌','支原体','放线菌','真菌'],
  core:'原核生物：<b>细菌</b>（球菌、杆菌、螺旋菌，如大肠杆菌、乳酸菌、肺炎链球菌）、<b>蓝细菌</b>（色球蓝细菌、颤蓝细菌、念珠蓝细菌、发菜）、<b>支原体</b>、<b>放线菌</b>、衣原体等。',
  why:`<b>记忆技巧：</b>名字里有“杆、球、螺旋、弧”的菌通常是细菌；带“蓝”的是蓝细菌；“支原体、衣原体、放线菌”也是原核生物。
<b>易混的真核生物：</b>
<ul><li><b>真菌</b>：酵母菌、霉菌（青霉、曲霉、根霉）、蘑菇、木耳。它们名字里也有“菌”，但都是真核生物。</li>
<li><b>真核藻类</b>：衣藻、水绵、海带、紫菜、硅藻、绿藻。蓝细菌以前叫“蓝藻”，但它是原核生物。</li>
<li><b>原生动物</b>：草履虫、变形虫、眼虫。</li></ul>
<b>支原体为什么特殊？</b>支原体可能是<b>最小、最简单的单细胞生物</b>，<b>没有细胞壁</b>，所以作用于细胞壁的抗生素（如青霉素）对它无效。它有细胞膜、细胞质、核糖体，DNA 和 RNA 都有。`,
  exam:'选择题：“下列属于原核生物的一组是”。只要组里有酵母菌、霉菌、衣藻、水绵、草履虫中的任何一个，这个选项就错。'},
 {t:'蓝细菌：没有叶绿体也能光合作用',lv:2,k:['藻蓝素','叶绿素','自养','水华'],
  core:'蓝细菌细胞内含有<b>藻蓝素和叶绿素</b>，能进行光合作用，属于<b>自养生物</b>；但它<b>没有叶绿体</b>。',
  why:`<b>没有叶绿体怎么光合？</b>光合作用需要的是光合色素和相关的酶，而不一定需要叶绿体这个“容器”。蓝细菌的色素和酶分布在细胞内的膜结构（光合片层）上，同样能完成光合作用。
<b>它为什么会造成水华？</b>淡水水域被污染后富营养化（N、P 过多），蓝细菌和绿藻大量繁殖，形成水华，影响水质和水生动物生活。
<b>自养和异养：</b>能利用无机物合成有机物的是自养生物（蓝细菌、绿色植物、硝化细菌）；只能利用现成有机物的是异养生物。细菌中多数营腐生或寄生，是异养生物。所以“原核生物中既有自养也有异养”。
发菜也是蓝细菌，过度采挖曾严重破坏草原生态，现已列为国家一级重点保护生物。`,
  exam:'判断题：“能进行光合作用的细胞一定含有叶绿体”（错，蓝细菌）；“蓝细菌的光合作用在叶绿体中进行”（错）。'},
 {t:'细胞的统一性与多样性',lv:2,k:['细胞膜','细胞质','核糖体','DNA'],
  core:'<b>统一性</b>：原核细胞和真核细胞都有<b>细胞膜、细胞质、核糖体</b>，都以 <b>DNA</b> 作为遗传物质，都有遗传物质集中存在的区域（细胞核或拟核）。<b>多样性</b>：细胞形态、大小、结构各不相同。',
  why:`<b>为什么会有统一性？</b>可以用细胞学说中“新细胞由老细胞分裂产生”来解释：现代所有细胞都是远古细胞的后代，共同的祖先留下了共同的结构模式。这也是生物界统一性的基础。
<b>为什么会有多样性？</b>
<ul><li>不同生物的遗传物质不同，在长期进化中适应了不同环境（不同物种之间）；</li>
<li>同一个多细胞生物体内，细胞发生了<b>分化</b>，结构与功能相适应，例如神经细胞有长突起便于传导兴奋，红细胞呈两面凹圆盘状便于运输氧气（同一个体内部）。</li></ul>`,
  exam:'“草履虫、衣藻、变形虫和细菌都具有的结构”：答案是细胞膜、细胞质、储存遗传物质的场所。不能选“细胞核”（细菌没有）或“细胞壁”（草履虫、变形虫没有）。'}],
 traps:['“没有细胞核的细胞都是原核细胞”错：哺乳动物成熟红细胞、高等植物筛管细胞没有细胞核，但它们是真核细胞。','“有细胞壁的是植物细胞”错：细菌、真菌也有细胞壁。','“原核生物都是异养的”错：蓝细菌、硝化细菌是自养的。','“原核细胞没有任何细胞器”错：有核糖体。','“原核细胞的 DNA 在染色体上”错：原核细胞没有染色体。']}
]},

{id:'2',t:'组成细胞的分子',secs:[
{id:'2-1',t:'细胞中的元素和化合物',
 goal:'掌握细胞中的元素分类和含量规律，理解“统一性”和“差异性”分别指什么；会做还原糖、脂肪、蛋白质的检测实验，并能说出每种试剂的成分、用法和原理。',
 focus:[[3,'三大检测实验：试剂、颜色、操作要点、材料选择'],[3,'斐林试剂与双缩脲试剂的比较'],[2,'大量元素与微量元素的识别'],[2,'细胞中化合物含量排序'],[2,'生物界与非生物界的统一性和差异性']],
 models:['tests'],
 pts:[
 {t:'组成细胞的元素',lv:2,k:['大量元素','微量元素','C、H、O、N'],
  core:'常见元素有 20 多种。<b>大量元素</b>：C、H、O、N、P、S、K、Ca、Mg 等；<b>微量元素</b>：Fe、Mn、Zn、Cu、B、Mo 等。C、H、O、N 四种元素含量最高。',
  why:`<b>为什么 C、H、O、N 含量最高？</b>这与组成细胞的化合物有关：细胞中含量最多的是水（H、O），有机物都以碳链为骨架（C），蛋白质和核酸含 N。
<b>鲜重和干重为什么排序不同？</b>鲜重中水占 70%～90%，水里大部分质量是 O，所以鲜重 O 最多；去掉水后，干重主要是有机物，有机物以碳为骨架，所以干重 C 最多。
<ul><li>鲜重：O ＞ C ＞ H ＞ N（O 约 65%）</li>
<li>干重：C ＞ O ＞ N ＞ H（以人体细胞为例）</li></ul>
<b>微量元素记忆口诀：</b>“铁猛碰新木桶”——Fe、Mn、B、Zn、Mo、Cu。
<b>微量≠不重要：</b>微量元素含量少，但必不可少。缺 Fe 会导致缺铁性贫血；缺 B 会导致油菜“花而不实”。`,
  exam:'判断“全部属于微量元素/大量元素”的一组。最常见的干扰项是把 Mg、Ca 放进微量元素组。'},
 {t:'统一性与差异性',lv:2,k:['统一性','差异性'],
  core:'组成细胞的化学元素在无机自然界中<b>都能找到</b>，没有一种元素为细胞所特有——体现<b>统一性</b>；但细胞中各种元素的<b>相对含量</b>与无机自然界大不相同——体现<b>差异性</b>。',
  why:`<b>为什么元素种类相同？</b>生物体总是和外界环境进行物质交换，细胞生命活动所需要的物质，归根结底是从无机自然界中获取的。
<b>为什么含量不同？</b>细胞能<b>有选择地</b>从环境中吸收所需要的元素。例如地壳中 Si 含量很高（26.3%），但大多数细胞中 Si 极少；地壳中 C 只有 0.087%，细胞中 C 却高达 18%。
<b>不同生物之间：</b>元素种类大体相同（统一性），含量差异较大（多样性）。例如人体细胞干重中 N、Ca、P 比玉米细胞多得多，因为人体蛋白质多、有骨骼。`,
  exam:'“组成生物体的元素在无机自然界中都存在，这说明”——答案：生物界与无机自然界具有统一性。'},
 {t:'组成细胞的化合物及含量',lv:2,k:['水','蛋白质','无机盐','脂质'],
  core:'细胞中含量最多的化合物是<b>水</b>（70%～90%）；含量最多的有机物是<b>蛋白质</b>（7%～10%）。细胞干重中含量最多的化合物是蛋白质。',
  why:`<table class="tb"><tr><th>化合物</th><th>占细胞鲜重</th></tr><tr><td>水</td><td>70%～90%</td></tr><tr><td>蛋白质</td><td>7%～10%</td></tr><tr><td>脂质</td><td>1%～2%</td></tr><tr><td>无机盐</td><td>1%～1.5%</td></tr><tr><td>糖类和核酸</td><td>1%～1.5%</td></tr></table>
这些是大量细胞的统计平均值，<b>不同组织差别可能很大</b>。例如梨的果实细胞富含糖类，花生种子细胞富含脂肪，大豆种子富含蛋白质。这也是日常膳食需要搭配不同食物的原因。`,
  exam:'“人体细胞内含量最多的有机化合物是”——蛋白质。注意题目问的是“化合物”还是“有机化合物”，是“鲜重”还是“干重”。'},
 {t:'实验：检测还原糖',lv:3,k:['斐林试剂','砖红色沉淀','50～65 ℃水浴'],
  core:'还原糖（如葡萄糖）与<b>斐林试剂</b>在 <b>50～65 ℃ 水浴加热</b>约 2 min 后生成<b>砖红色沉淀</b>。',
  why:`<b>斐林试剂的组成：</b>甲液 = 0.1 g/mL NaOH 溶液；乙液 = 0.05 g/mL CuSO₄ 溶液。
<b>为什么甲乙液要“等量混合、现配现用”？</b>两者混合生成新制的 Cu(OH)₂，它不稳定，放久了会分解失效。真正起作用的是新制 Cu(OH)₂ 中的 Cu²⁺，被还原糖还原成砖红色的 Cu₂O 沉淀。
<b>操作：</b>2 mL 样液 → 加 1 mL 斐林试剂（先混合再加入）→ 50～65 ℃ 温水浴约 2 min → 观察。
<b>颜色变化过程：</b>浅蓝色（Cu(OH)₂ 的颜色）→ 棕色 → 砖红色。所以“没有还原糖”时看到的是<b>蓝色</b>，不是无色。
<b>材料怎么选？</b>要求<b>还原糖含量高、颜色浅或白色</b>。梨匀浆、苹果匀浆、白萝卜匀浆合适。
<ul><li>甘蔗、甜菜：主要含<b>蔗糖</b>，是非还原糖，不行；</li>
<li>西瓜汁、葡萄汁颜色深，会掩盖砖红色（教材实验中葡萄匀浆可用于预测比较，但颜色干扰需注意）；</li>
<li>马铃薯：主要含淀粉，不是还原糖。</li></ul>
<b>常见还原糖：</b>葡萄糖、果糖、麦芽糖、乳糖、半乳糖。<b>非还原糖：</b>蔗糖、淀粉、纤维素、糖原。`,
  exam:'必考材料选择（为什么不用甘蔗、西瓜）、试剂用法（等量混合现配现用）、条件（水浴加热）。“用斐林试剂检测时出现蓝色说明不含还原糖”是对的。'},
 {t:'实验：检测脂肪',lv:3,k:['苏丹Ⅲ染液','橘黄色','50%酒精','花生子叶'],
  core:'脂肪被<b>苏丹Ⅲ染液</b>染成<b>橘黄色</b>。用花生子叶切片时，要用<b>体积分数 50% 的酒精</b>洗去浮色，在显微镜下观察。',
  why:`<b>切片法步骤：</b>取浸泡过的花生种子去种皮 → 用刀片在子叶横断面平行切下薄片 → 选最薄的放到载玻片中央 → 滴 2～3 滴苏丹Ⅲ染液，染色 3 min → 吸水纸吸去染液 → 滴 1～2 滴 50% 酒精洗去浮色 → 吸去酒精，滴一滴蒸馏水，盖盖玻片 → 低倍镜找到最薄处移到中央 → 高倍镜观察橘黄色脂肪颗粒。
<b>为什么用酒精洗浮色？</b>苏丹Ⅲ易溶于酒精。切片表面多余的染料会让整个视野都是橘黄色，分不清哪里是脂肪颗粒。
<b>为什么是 50% 而不是更浓的酒精？</b>浓度太高会把脂肪颗粒里的染料也溶出来，甚至溶解脂肪。
<b>为什么要“最薄处”？</b>切片太厚，细胞重叠，光线透不过来，看不清。
<b>一定要显微镜吗？</b>不一定。如果把花生子叶制成<b>匀浆</b>，直接在试管里加苏丹Ⅲ，看溶液颜色，就不需要显微镜。只有“切片法”才需要。`,
  exam:'常考“50% 酒精的作用”（洗去浮色）；“需要用显微镜的检测实验”（脂肪切片）；“三个实验中需要加热的”（只有还原糖）。'},
 {t:'实验：检测蛋白质',lv:3,k:['双缩脲试剂','紫色','先A后B','肽键'],
  core:'蛋白质与<b>双缩脲试剂</b>发生作用，产生<b>紫色</b>反应。先加 <b>A 液 1 mL</b>摇匀，再加 <b>B 液 4 滴</b>摇匀，不需要加热。',
  why:`<b>双缩脲试剂组成：</b>A 液 = 0.1 g/mL NaOH；B 液 = <b>0.01 g/mL</b> CuSO₄。
<b>原理：</b>在碱性环境中，Cu²⁺ 与<b>肽键</b>结构形成紫色络合物。所以能和双缩脲试剂反应的，是含有<b>两个及以上肽键</b>的物质（多肽、蛋白质，包括变性的蛋白质）。单个氨基酸、二肽不显色。
<b>为什么先加 A 后加 B？</b>先加 NaOH 营造碱性环境；B 液只加 4 滴，是因为 CuSO₄ 过多会生成大量蓝色 Cu(OH)₂ 沉淀，掩盖紫色。
<b>材料：</b>豆浆、鸡蛋清稀释液、鲜肝提取液。鸡蛋清要<b>稀释</b>，否则反应后会黏附在试管壁上不易洗净。`,
  exam:'与斐林试剂的对比是超高频考点（见下一条）。另外“变性的蛋白质能否与双缩脲试剂反应”——能，因为肽键没有被破坏。'},
 {t:'斐林试剂 vs 双缩脲试剂',lv:3,k:['CuSO₄浓度','使用方法'],
  core:'两者都含 NaOH 和 CuSO₄，NaOH 浓度相同（0.1 g/mL），但 <b>CuSO₄ 浓度不同</b>，<b>使用方法不同</b>，<b>反应原理不同</b>。',
  why:`<table class="tb"><tr><th></th><th>斐林试剂</th><th>双缩脲试剂</th></tr>
<tr><td>NaOH</td><td>0.1 g/mL（甲液）</td><td>0.1 g/mL（A 液）</td></tr>
<tr><td>CuSO₄</td><td><b>0.05 g/mL</b>（乙液）</td><td><b>0.01 g/mL</b>（B 液）</td></tr>
<tr><td>用法</td><td>甲乙<b>等量混合</b>，现配现用</td><td><b>先加 A 液 1 mL，再加 B 液 4 滴</b></td></tr>
<tr><td>条件</td><td>50～65 ℃ 水浴加热</td><td>常温，不加热</td></tr>
<tr><td>实质</td><td>新制 Cu(OH)₂ 被还原糖还原</td><td>碱性条件下 Cu²⁺ 与肽键反应</td></tr>
<tr><td>现象</td><td>砖红色沉淀</td><td>紫色</td></tr></table>
<b>能不能把斐林试剂改成双缩脲试剂？</b>可以。用蒸馏水把斐林试剂乙液稀释到 0.01 g/mL 即可作为双缩脲试剂 B 液，这是常见的变式题。`,
  exam:'表格类对比必考。变式：“用斐林试剂的甲液、乙液和蒸馏水能否检测蛋白质？”——能，把乙液稀释。'}],
 traps:['“细胞中微量元素含量少，作用也小”错。','“生物与非生物在元素组成上没有区别”错：种类相同，含量差异很大。','“用斐林试剂检测蔗糖会出现砖红色”错：蔗糖是非还原糖。','“双缩脲试剂需要水浴加热”错。','“检测脂肪一定要用显微镜”错：匀浆法不需要。']},

{id:'2-2',t:'细胞中的无机物',
 goal:'理解水的特殊性质是怎样由分子结构决定的，能用自由水/结合水的比值解释代谢强弱和抗逆性；能举例说明无机盐的三大功能。',
 focus:[[3,'自由水与结合水的功能与比值变化'],[3,'无机盐的功能及缺乏症实例'],[2,'水分子的极性、氢键与比热容'],[1,'生理盐水的含义']],
 models:['water'],
 pts:[
 {t:'水为什么能支持生命：极性与氢键',lv:2,k:['极性分子','氢键','比热容'],
  core:'水分子是<b>极性分子</b>，带电的分子或离子都容易与水结合，所以水是<b>良好的溶剂</b>；水分子之间可以形成<b>氢键</b>，使水在常温下呈液态、具有流动性，并具有<b>较高的比热容</b>，温度不容易改变。',
  why:`<b>极性从哪来？</b>水分子中，O 吸引共用电子的能力比 H 强，共用电子对偏向 O。于是 O 一端稍带<b>负电</b>，H 一端稍带<b>正电</b>，加上水分子是“V”形而不是直线形，正负电荷中心不重合，就成了极性分子。
<b>氢键是什么？</b>一个水分子的 O 端（负）靠近另一个水分子的 H 端（正），产生弱的静电引力。氢键较弱，不断断裂又不断形成，所以水能流动。
<b>比热容高有什么意义？</b>吸收同样多的热量，水的温度升高得少。细胞内含水多，体温就不容易随环境剧烈变化，有利于维持生命系统的稳定。
<b>水的含量：</b>生物体含水量一般为 60%～95%，水母可达 97%。水是活细胞中含量最多的化合物。`,
  exam:'近年新教材常考“水是良好溶剂的原因”（极性分子）、“水温度不易改变的原因”（氢键使比热容较高）。'},
 {t:'自由水与结合水',lv:3,k:['自由水','结合水','4.5%'],
  core:'<b>自由水</b>：游离状态，可以自由流动，是细胞内良好的溶剂。<b>结合水</b>：与蛋白质、多糖等物质结合，失去流动性和溶解性，是<b>细胞结构的重要组成部分</b>，约占细胞内全部水分的 4.5%。',
  why:`<b>自由水的四大作用：</b>
<ol><li>细胞内良好的<b>溶剂</b>；</li><li><b>参与</b>许多生物化学反应（如光合作用、有氧呼吸第二阶段、水解反应）；</li><li>为细胞提供<b>液体环境</b>（多细胞生物的绝大多数细胞浸润在液体环境中）；</li><li><b>运送</b>营养物质和代谢废物。</li></ol>
<b>结合水为什么不能当溶剂？</b>结合水被蛋白质、多糖等分子上的亲水基团“抓住”，固定在它们表面，不能自由移动，也就无法溶解其他物质，而成为细胞结构的一部分。`,
  exam:'判断：“自由水和结合水都是良好溶剂，都能参与物质运输和化学反应”（错，只有自由水）。'},
 {t:'自由水/结合水比值与代谢、抗逆性',lv:3,k:['代谢旺盛','抗逆性','冬小麦','种子'],
  core:'自由水所占比例越大，细胞<b>代谢越旺盛</b>；结合水越多，细胞抵抗干旱和寒冷等<b>不良环境的能力越强</b>。两者可以相互转化。',
  why:`<b>为什么自由水多代谢就旺盛？</b>代谢的本质是化学反应，绝大多数反应在水溶液中进行，有的反应还需要水直接参与。自由水多，反应物溶解和运输就快，反应就旺盛。
<b>为什么结合水多就抗寒？</b>天冷时，自由水容易<b>结冰</b>，冰晶会刺破细胞结构；结合水不易结冰。北方冬小麦在冬天来临前，自由水比例逐渐降低，结合水比例逐渐上升，就是为了避免结冰损伤。
<b>实例：</b>
<ul><li>种子晒干：减少了<b>自由水</b>，代谢水平降低，便于储藏。晒干的种子仍有结合水，还能萌发。</li>
<li>种子烘烤：连结合水也失去了，细胞结构破坏，种子死亡。</li>
<li>种子萌发：吸水后自由水增多，代谢加快。</li>
<li>同一植株：幼叶比老叶代谢旺盛，自由水含量更高。</li></ul>`,
  exam:'图像题：冬小麦 9～12 月自由水快速下降、结合水上升。要会解释：气温下降，自由水转化为结合水，代谢减弱，抗寒能力增强；总含水量下降是因为蒸腾减弱、吸水减少。'},
 {t:'无机盐的存在形式与含量',lv:2,k:['离子','1%～1.5%'],
  core:'细胞中<b>大多数无机盐以离子形式存在</b>，仅占细胞鲜重的 1%～1.5%。阳离子有 Na⁺、K⁺、Ca²⁺、Mg²⁺、Fe²⁺、Fe³⁺ 等；阴离子有 Cl⁻、SO₄²⁻、PO₄³⁻、HCO₃⁻ 等。',
  why:'点燃小麦种子，烧尽后剩下的灰白色灰烬主要就是无机盐。有机物燃烧变成 CO₂ 和 H₂O 跑掉了，剩下的不能燃烧的部分就是无机盐。',
  exam:'判断：“将作物秸秆充分晒干后，剩余的物质主要是无机盐”（错，晒干只去掉了水，剩下的主要是有机物；燃烧后的灰烬才主要是无机盐）。'},
 {t:'无机盐的三大功能',lv:3,k:['Mg','Fe','P','Ca²⁺','Na⁺','酸碱平衡'],
  core:'① 是细胞内某些<b>复杂化合物的重要组成成分</b>；② 对<b>维持细胞和生物体的生命活动</b>有重要作用；③ 维持细胞的<b>酸碱平衡</b>（和渗透压）。',
  why:`<b>① 构成复杂化合物：</b>
<ul><li><b>Mg</b> 是构成<b>叶绿素</b>的元素 → 缺 Mg 叶绿素合成受阻，叶片发黄，光合作用减弱。</li>
<li><b>Fe</b> 是构成<b>血红素</b>的元素 → 缺 Fe 血红蛋白合成减少，运输氧气能力下降，导致<b>缺铁性贫血</b>。</li>
<li><b>P</b> 是组成细胞膜（磷脂）、细胞核（核酸）的重要成分，也参与构成 ATP 等。缺 P 时植株特别矮小、根系发育差、叶片小且呈暗绿偏紫色。</li>
<li><b>I</b> 是甲状腺激素的组成成分。</li></ul>
<b>② 维持生命活动：</b>
<ul><li>人体内 <b>Na⁺ 缺乏</b>会引起神经、肌肉细胞的兴奋性降低，最终引发肌肉酸痛、无力。所以大量出汗后要喝<b>淡盐水</b>。</li>
<li>哺乳动物血液中 <b>Ca²⁺ 含量太低</b>会出现<b>抽搐</b>（含量过高则肌无力）。</li></ul>
<b>③ 维持酸碱平衡：</b>如血浆中 HCO₃⁻、HPO₄²⁻ 等离子能缓冲 pH 变化。
<b>生理盐水：</b>质量分数为 <b>0.9%</b> 的 NaCl 溶液，与人体细胞所处液体环境的渗透压相当，能维持细胞正常形态。用于输液、清洗伤口等。`,
  exam:'“缺 X 会怎样”的连线题；新情境题：如“缺 Mn²⁺ 的植物无法利用硝酸盐，推测 Mn²⁺ 的作用”——答案是 Mn²⁺ 是硝酸还原酶的活化剂（维持生命活动）。中暑晕倒最合理的输液是葡萄糖生理盐水（既补能量又补水和无机盐）。'}],
 traps:['“结合水也能参与化学反应和物质运输”错。','“同一植株中，老叶细胞比幼叶细胞自由水含量高”错：幼叶代谢旺盛，自由水多。','“晒干的种子不含水”错：仍含结合水。','“无机盐主要以化合物形式存在”错：主要以离子形式存在。']},

{id:'2-3',t:'细胞中的糖类和脂质',
 goal:'能按单糖、二糖、多糖对糖进行分类并说出分布和功能；理解脂肪为什么是良好的储能物质；能区分脂肪、磷脂、固醇的结构和功能；理解糖类和脂肪的相互转化。',
 focus:[[3,'各类糖的分布与功能（动植物特有的糖）'],[3,'脂肪、磷脂、固醇的功能'],[2,'还原糖与非还原糖'],[2,'脂肪储能多的原因；糖类与脂肪转化的不对称性'],[1,'饱和与不饱和脂肪酸']],
 models:['sugars'],
 pts:[
 {t:'糖类的元素组成与分类依据',lv:2,k:['C、H、O','碳水化合物','单糖','二糖','多糖'],
  core:'糖类分子一般由 <b>C、H、O</b> 三种元素组成。多数糖类分子中 H 与 O 原子之比是 2∶1，所以又叫“碳水化合物”，简写为 (CH₂O)。糖类是主要的能源物质，大致分为<b>单糖、二糖、多糖</b>。',
  why:`<b>分类依据是“能否水解、水解后得到几个单糖”：</b>
<ul><li><b>单糖</b>：不能水解，可直接被细胞吸收。</li>
<li><b>二糖</b>（C₁₂H₂₂O₁₁）：由两分子单糖<b>脱水缩合</b>而成，一般要水解成单糖才能被吸收。</li>
<li><b>多糖</b>［(C₆H₁₀O₅)ₙ］：由许多单糖连接而成，生物体内的糖类<b>绝大多数以多糖形式存在</b>。</li></ul>
<b>“碳水化合物”这个名字不严谨：</b>有些糖（如脱氧核糖 C₅H₁₀O₄）H、O 之比不是 2∶1；有些不是糖的物质 H、O 之比也是 2∶1。
<b>淀粉不甜为什么也是糖？</b>甜不甜不是分类依据。淀粉由葡萄糖组成，水解后得到葡萄糖，属于多糖。`,
  exam:'“能直接被细胞吸收的糖”只有单糖。蔗糖、麦芽糖、乳糖都要先水解。'},
 {t:'单糖、二糖、多糖的种类与分布',lv:3,k:['葡萄糖','核糖','脱氧核糖','蔗糖','麦芽糖','乳糖','淀粉','纤维素','糖原','几丁质'],
  core:'葡萄糖是细胞生命活动所需要的<b>主要能源物质</b>，被称为“生命的燃料”；淀粉是<b>植物</b>的储能物质，糖原是<b>人和动物</b>的储能物质，纤维素是<b>植物细胞壁</b>的主要成分。',
  why:`<table class="tb"><tr><th>类别</th><th>名称</th><th>分布</th><th>功能/备注</th></tr>
<tr><td rowspan="4">单糖</td><td>葡萄糖</td><td>动植物</td><td>主要能源物质</td></tr>
<tr><td>核糖、脱氧核糖</td><td>动植物</td><td>组成 RNA、DNA 的五碳糖</td></tr>
<tr><td>果糖</td><td>植物</td><td>还原糖</td></tr>
<tr><td>半乳糖</td><td>动物</td><td>还原糖</td></tr>
<tr><td rowspan="3">二糖</td><td>蔗糖 = 葡萄糖 + 果糖</td><td>植物（甘蔗、甜菜，红糖白糖冰糖）</td><td><b>非</b>还原糖</td></tr>
<tr><td>麦芽糖 = 2 葡萄糖</td><td>植物（发芽的谷粒）</td><td>还原糖</td></tr>
<tr><td>乳糖 = 葡萄糖 + 半乳糖</td><td>动物（乳汁）</td><td>还原糖</td></tr>
<tr><td rowspan="4">多糖</td><td>淀粉</td><td>植物（种子、块茎、块根）</td><td>储能</td></tr>
<tr><td>纤维素</td><td>植物</td><td>细胞壁主要成分，不溶于水</td></tr>
<tr><td>糖原</td><td>人和动物（肝脏、肌肉）</td><td>储能</td></tr>
<tr><td>几丁质（壳多糖）</td><td>甲壳类、昆虫外骨骼</td><td>可用于废水处理、人造皮肤、食品包装</td></tr></table>
<b>淀粉、纤维素、糖原的基本单位都是葡萄糖</b>，区别在于葡萄糖的连接方式不同，所以结构和性质差别很大。
<b>肝糖原和肌糖原：</b>血糖低于正常时，<b>肝糖原</b>可分解为葡萄糖补充血糖；肌糖原主要为肌肉自身供能，不能直接分解补充血糖。
<b>纤维素为什么叫“第七类营养素”？</b>人很难消化纤维素，但它能促进胃肠蠕动、利于排便，还有助于降低胆固醇等，对健康有益。食草动物也要借助微生物才能分解纤维素。`,
  exam:'“动植物细胞共有的糖”——葡萄糖、核糖、脱氧核糖。“水稻、小麦细胞中的多糖”——淀粉和纤维素（不是糖原）。“植物细胞和动物细胞都含有纤维素”（错）。'},
 {t:'脂质的元素组成与种类',lv:2,k:['C、H、O','P和N','不溶于水'],
  core:'脂质主要由 C、H、O 组成，有些还含有 P 和 N。与糖类相比，脂质分子中<b>氧的含量远低于糖类，而氢的含量更高</b>。常见脂质有<b>脂肪、磷脂、固醇</b>，通常不溶于水，溶于丙酮、氯仿、乙醚等脂溶性有机溶剂。',
  why:'脂质的三类分子结构差异很大，它们被归为一类，是因为都具有“不溶于水、溶于有机溶剂”的共同性质，而不是因为结构相似。这也是为什么教材后面用丙酮提取红细胞膜中的脂质。',
  exam:'“脂质都只含 C、H、O”（错，磷脂含 P，有的含 N）。'},
 {t:'脂肪：良好的储能物质',lv:3,k:['甘油','脂肪酸','三酰甘油','饱和脂肪酸','不饱和脂肪酸'],
  core:'脂肪是由<b>三分子脂肪酸与一分子甘油</b>发生反应形成的酯，即三酰甘油（甘油三酯）。脂肪是细胞内<b>良好的储能物质</b>，还是很好的<b>绝热体</b>（保温），内脏周围的脂肪有<b>缓冲和减压</b>作用。',
  why:`<b>为什么脂肪储能多？</b>1 g 糖原氧化分解约释放 17 kJ 能量，1 g 脂肪约释放 <b>39 kJ</b>，是糖原的两倍多。原因是脂肪分子中 <b>H 多、O 少</b>，氧化分解时需要消耗更多 O₂，释放的能量也更多。
<b>为什么脂肪却不是主要能源物质？</b>
<ul><li>脂肪不溶于水，在体内运输和动员较慢；</li><li>脂肪氧化需要消耗更多 O₂；</li><li>糖类可以在无氧条件下分解供能，脂肪不行。</li></ul>
所以细胞优先利用糖类，脂肪作为长期储备。
<b>饱和与不饱和脂肪酸：</b>
<ul><li><b>饱和脂肪酸</b>：碳链上的碳原子之间都是单键，每个碳连 2 个 H，“吃饱了”H。熔点较高，容易凝固。大多数<b>动物脂肪</b>含饱和脂肪酸，室温下呈<b>固态</b>（猪油）。</li>
<li><b>不饱和脂肪酸</b>：碳链中有双键，H 没有达到饱和。熔点较低，不容易凝固。<b>植物脂肪</b>大多含不饱和脂肪酸，室温下呈<b>液态</b>（花生油、豆油、菜籽油）。</li></ul>
鲸、海豹皮下的厚脂肪层用于保温，南极企鹅体内脂肪可厚达 4 cm。`,
  exam:'“等量的脂肪比糖类含能量多，为什么一般情况下脂肪不是主要能源物质？”是教材拓展题，要会答上面三点。'},
 {t:'磷脂与固醇',lv:3,k:['磷脂','胆固醇','性激素','维生素D'],
  core:'<b>磷脂</b>是构成<b>细胞膜</b>和多种<b>细胞器膜</b>的重要成分。<b>固醇</b>包括：<b>胆固醇</b>（构成<b>动物细胞膜</b>的重要成分，参与<b>血液中脂质的运输</b>）、<b>性激素</b>（促进生殖器官发育和生殖细胞形成）、<b>维生素 D</b>（促进肠道对<b>钙和磷</b>的吸收）。',
  why:`<b>磷脂和脂肪有什么不同？</b>脂肪是甘油的三个羟基都连脂肪酸；磷脂是甘油的一个羟基不连脂肪酸，而是与<b>磷酸及其他衍生物</b>结合，所以磷脂除 C、H、O 外还含 <b>P 甚至 N</b>。这让磷脂一端亲水（磷酸“头”）、一端疏水（脂肪酸“尾”），正好适合构成膜。
<b>所有细胞都有磷脂</b>，因为所有细胞都有细胞膜。在人和动物的脑、卵细胞、肝脏以及大豆种子中，磷脂含量丰富。
<b>胆固醇不能“一棍子打死”：</b>它是动物细胞膜的必需成分，也参与血液中脂质运输。只是血液中胆固醇过多会在血管壁上沉积，增加心血管疾病风险。
<b>维生素 D 的应用：</b>儿童缺钙时常同时补维生素 D，多晒太阳也有助于皮肤合成维生素 D。`,
  exam:'“磷脂是所有细胞必不可少的脂质”（对）；“胆固醇对人体有害无益”（错）；“脂质具有的功能”：储能、构成膜、调节生理功能（性激素）；脂质<b>不能</b>携带遗传信息。'},
 {t:'糖类与脂肪的相互转化',lv:2,k:['转化','肥育'],
  core:'糖类和脂质可以相互转化，但转化程度有明显差异：糖类在供应充足时可以<b>大量转化为脂肪</b>；而脂肪一般只在糖类供能不足时才会分解供能，并且<b>不能大量转化为糖类</b>。',
  why:`<b>糖的去路：</b>血液中的葡萄糖除供细胞利用外，多余的可以合成<b>糖原</b>储存；还有富余，就转变成<b>脂肪</b>和某些<b>氨基酸</b>。
<b>实例：</b>
<ul><li>北京鸭用富含糖类的饲料（玉米、谷类）填喂，很快肥育，是因为糖类大量转化为脂肪。</li>
<li>培养脂肪细胞时，即使培养基中没有脂肪，细胞中也会出现油滴，说明葡萄糖能转化为脂肪。</li>
<li>“只吃米饭面食也会发胖”：淀粉 → 葡萄糖 → 多余的转化为脂肪。</li>
<li>糖尿病人不仅要限制甜食，米饭、馒头等主食也要定量摄取，因为淀粉消化后同样变成葡萄糖。</li></ul>
<b>健康提示：</b>《中国居民膳食指南（2022）》建议每天添加糖摄入不超过 50 g，最好控制在 25 g 以下。一瓶 500 mL 的含糖饮料就可能超标。`,
  exam:'解释“吃素也会发胖”“糖尿病人要控制主食”这类生活现象。'}],
 traps:['“糖类都是能源物质”错：纤维素、核糖、脱氧核糖不供能。','“糖类都能用斐林试剂检测”错：只有还原糖能。','“脂肪是主要能源物质”错：糖类是主要能源物质，脂肪是良好的储能物质。','“脂肪和糖类可以大量相互转化”错：糖可大量转化为脂肪，反之不能。','“胆固醇是植物细胞膜的成分”错：是动物细胞膜的成分。']},

{id:'2-4',t:'蛋白质是生命活动的主要承担者',
 goal:'能写出并解读氨基酸结构通式；能完整描述从氨基酸到蛋白质的结构层次；熟练完成肽键数、脱水数、相对分子质量、原子数的计算；能从结构多样性解释功能多样性；理解蛋白质变性。',
 focus:[[3,'氨基酸结构通式的识别（判断是否是组成蛋白质的氨基酸）'],[3,'脱水缩合相关计算'],[3,'蛋白质结构多样性的原因'],[2,'蛋白质的功能举例'],[2,'蛋白质变性与盐析'],[1,'必需氨基酸']],
 models:['amino','protein'],
 pts:[
 {t:'蛋白质的功能',lv:2,k:['结构蛋白','催化','运输','信息传递','免疫'],
  core:'蛋白质是细胞的基本组成成分，具有参与组成<b>细胞结构</b>、<b>催化</b>、<b>运输</b>、<b>信息传递（调节）</b>、<b>免疫</b>等重要功能。细胞的各项生命活动都离不开蛋白质，蛋白质是<b>生命活动的主要承担者</b>。',
  why:`<table class="tb"><tr><th>功能</th><th>例子</th></tr>
<tr><td>结构蛋白</td><td>肌肉、头发、羽毛、蛛丝中的蛋白质</td></tr>
<tr><td>催化</td><td>绝大多数<b>酶</b>（如胃蛋白酶）</td></tr>
<tr><td>运输</td><td><b>血红蛋白</b>运输氧；细胞膜上的<b>载体蛋白、通道蛋白</b></td></tr>
<tr><td>信息传递、调节</td><td><b>胰岛素</b>、生长激素等蛋白质类激素</td></tr>
<tr><td>免疫</td><td><b>抗体</b></td></tr></table>
<b>为什么说“主要承担者”？</b>细胞核中的遗传信息往往要<b>表达成蛋白质</b>才能起作用。DNA 是“图纸”，蛋白质才是按图纸干活的“工人”。
<p class="warn">注意不是所有激素都是蛋白质：性激素是固醇，甲状腺激素是氨基酸衍生物。也不是所有酶都是蛋白质：少数是 RNA。</p>`,
  exam:'“下列物质中不属于蛋白质的是”：胆固醇、性激素、维生素 D、纤维素、核酸。'},
 {t:'氨基酸的结构特点',lv:3,k:['结构通式','氨基','羧基','R基','21种'],
  core:'每种氨基酸分子<b>至少都含有一个氨基（—NH₂）和一个羧基（—COOH）</b>，并且都有<b>一个氨基和一个羧基连接在同一个碳原子上</b>，这个碳原子还连接一个氢原子和一个侧链基团（R 基）。各种氨基酸之间的区别在于 <b>R 基</b>的不同。在人体中，组成蛋白质的氨基酸有 <b>21 种</b>。',
  why:`<b>名字就是结构：</b>“氨基酸”= 有氨基 + 有羧基（酸）。
<b>判断“是不是组成蛋白质的氨基酸”三步法：</b>
<ol><li>有没有 —NH₂？</li><li>有没有 —COOH？</li><li><b>两者是否连在同一个碳原子上</b>？——最关键的一步，很多干扰项就是氨基和羧基连在不同的碳上。</li></ol>
<b>R 基举例：</b>甘氨酸的 R 基是 —H（最简单），丙氨酸是 —CH₃。R 基中也可能含有氨基或羧基（如赖氨酸 R 基中有 —NH₂，谷氨酸 R 基中有 —COOH），所以说“至少”含一个。
<b>元素组成：</b>一定有 C、H、O、N，有的含 S（S 在 R 基上，如甲硫氨酸）。
<b>必需氨基酸（8 种）：</b>人体细胞不能合成、必须从食物中获取。赖氨酸、色氨酸、苯丙氨酸、甲硫氨酸、苏氨酸、异亮氨酸、亮氨酸、缬氨酸（口诀：“甲携来一本亮色书”）。另外 13 种是非必需氨基酸。评价食物蛋白质营养价值时，格外注重必需氨基酸的种类和含量。`,
  exam:'给出几个结构式，选出属于组成蛋白质的氨基酸。也会让你写出某氨基酸的 R 基，或判断某氨基酸的分子式（通式为 C₂H₄O₂N + R）。'},
 {t:'从氨基酸到蛋白质：脱水缩合与结构层次',lv:3,k:['脱水缩合','肽键','二肽','多肽','肽链','二硫键'],
  core:'一个氨基酸分子的<b>羧基</b>和另一个氨基酸分子的<b>氨基</b>相连接，同时<b>脱去一分子水</b>，这种结合方式叫<b>脱水缩合</b>。连接两个氨基酸分子的化学键叫<b>肽键</b>。',
  why:`<b>脱去的水从哪来？</b>H₂O 中的 <b>O 来自羧基</b>（—COOH 中的 —OH），<b>H 一个来自羧基、一个来自氨基</b>。这是同位素标记题的考点：用 ¹⁸O 标记羧基，¹⁸O 会出现在水中；用 ³H 标记氨基，³H 也会出现在水中。
<b>肽键的写法：</b>—CO—NH— 或 —NH—CO—，书写时两端的短横不能丢。
<b>从氨基酸到蛋白质的结构层次（以血红蛋白为例）：</b>
<span class="chain">氨基酸 → 脱水缩合形成多肽（肽链）→ 肽链特定区域有规律地盘曲、折叠 → 进一步盘绕形成一定空间结构 → 多条肽链聚集形成复杂空间结构的蛋白质</span>
<ul><li>肽链能盘曲折叠，是因为不同氨基酸之间还能形成<b>氢键</b>等。</li>
<li>多条肽链之间可以通过<b>二硫键</b>（—S—S—，由两个 —SH 脱去 2 个 H 形成）等化学键连接。胰岛素有 A、B 两条链，靠二硫键相连。</li>
<li>血红蛋白由 <b>574</b> 个氨基酸组成，含 <b>4 条</b>多肽链。</li></ul>
<b>场所：</b>脱水缩合发生在<b>核糖体</b>上。
<b>食物蛋白质 ≠ 人体蛋白质：</b>食物中的蛋白质在胃蛋白酶、胰蛋白酶、肽酶作用下分解成氨基酸被吸收，再在人体细胞内重新合成人体自己的蛋白质。所以“吃什么补什么”的说法没有科学依据。`,
  exam:'“氨基酸仅通过脱水缩合就可以形成蛋白质”（错，还要盘曲折叠形成空间结构）；“蛋白质彻底水解的产物是氨基酸”（对）。'},
 {t:'脱水缩合相关计算',lv:3,k:['肽键数','脱水数','相对分子质量','游离氨基','N原子','O原子'],
  core:'设 n 个氨基酸形成 m 条肽链：<b>肽键数 = 脱去水分子数 = n − m</b>；<b>蛋白质相对分子质量 = n × 氨基酸平均相对分子质量 − 18 × (n − m)</b>（如有二硫键，每个再减 2）。',
  why:`<b>为什么是 n − m？</b>一条链上 n 个氨基酸，像 n 个人手拉手站成一排，只需要 n − 1 次“牵手”。m 条链就少牵 m 次手，共 n − m 次。如果首尾相连成<b>环状肽</b>，就多牵一次，肽键数 = 氨基酸数。
<b>游离氨基和羧基：</b>每条链的两端各有一个游离的氨基（N 端）和羧基（C 端），中间的都形成了肽键。所以：
<ul><li>至少含游离氨基数 = 至少含游离羧基数 = <b>肽链数 m</b></li>
<li>实际游离氨基数 = m + R 基中的氨基数</li></ul>
<b>原子数计算（数肽键里的原子）：</b>
<ul><li><b>N 原子数</b> = 肽键数 + 肽链数 + R 基中的 N 数（每个肽键 1 个 N，每条链 N 端 1 个 N）</li>
<li><b>O 原子数</b> = 肽键数 + 2 × 肽链数 + R 基中的 O 数（每个肽键 1 个 O，每条链 C 端羧基 2 个 O）</li>
<li>反过来，如果 R 基中没有 N，则 N 原子数 = 氨基酸数。</li></ul>
<b>例：</b>某蛋白质由 2 条肽链、51 个氨基酸组成（胰岛素），含 3 个二硫键，氨基酸平均相对分子质量为 128。
肽键数 = 51 − 2 = 49；相对分子质量 = 51 × 128 − 18 × 49 − 2 × 3 = 6 528 − 882 − 6 = <b>5 640</b>。
<b>种类数计算：</b>21 种氨基酸组成 10 个氨基酸的长链，排列方式有 21¹⁰ 种；若每种氨基酸只用一次，排列方式为 A(n) 的全排列。`,
  exam:'计算题几乎必考。最容易错的地方：忘记减二硫键的 2；把“至少”和“实际”混淆；环状肽套用了链状公式。可以用下方的计算器练习。'},
 {t:'蛋白质结构多样性与功能多样性',lv:3,k:['种类','数目','排列顺序','空间结构','镰状细胞贫血'],
  core:'蛋白质结构多样的原因：组成蛋白质的氨基酸<b>种类</b>不同、<b>数目</b>成百上千、<b>排列顺序</b>千变万化，以及肽链的<b>盘曲、折叠方式及其形成的空间结构</b>千差万别。结构多样性决定功能多样性。',
  why:`<b>四个原因要记全，前三个讲“肽链”，第四个讲“空间结构”。</b>
<b>注意：“组成肽链的化学元素不同”不是多样性的原因</b>（各种蛋白质的元素都主要是 C、H、O、N）；“肽键的结构不同”也不是（所有肽键都是 —CO—NH—）。
<b>结构决定功能的典型例子——镰状细胞贫血：</b>正常血红蛋白呈球状，红细胞呈两面凹圆盘状。如果血红蛋白某一处的<b>谷氨酸被缬氨酸取代</b>（只改了一个氨基酸！），异常血红蛋白会聚合成纤维状，红细胞扭曲成<b>镰刀状</b>，运输氧的能力大大削弱。
<b>其他例子：</b>许多疾病与肽链折叠错误有关，如囊性纤维化、阿尔茨海默病、帕金森病。
<b>红细胞和心肌细胞功能为什么不同？</b>它们的主要成分都是蛋白质，但所含蛋白质的种类不同（红细胞富含血红蛋白，心肌细胞富含肌动蛋白、肌球蛋白），而蛋白质种类不同又是因为氨基酸的种类、数目、排列顺序和空间结构不同。`,
  exam:'“下列关于蛋白质结构多样性原因的叙述，错误的是”——答案通常是“组成肽链的化学元素不同”。'},
 {t:'蛋白质变性',lv:2,k:['变性','空间结构','不可逆','消毒灭菌'],
  core:'蛋白质在某些物理和化学因素（高温、强酸、强碱、重金属盐、酒精、紫外线等）作用下，其特定的<b>空间构象被破坏</b>，从而导致理化性质改变和<b>生物活性丧失</b>，叫蛋白质变性。',
  why:`<b>变性破坏了什么、没破坏什么？</b>
<ul><li>破坏了<b>空间结构</b>（维持空间结构的氢键等弱的作用力被破坏）；</li>
<li><b>没有破坏肽键</b>，氨基酸序列不变。所以变性蛋白质仍能与<b>双缩脲试剂</b>显紫色。</li></ul>
<b>生活中的应用：</b>
<ul><li>煮熟的鸡蛋、肉类容易消化：高温使空间结构变得<b>伸展、松散</b>，蛋白酶更容易接触到肽键，容易被水解。</li>
<li>加热、加酸、酒精消毒：使细菌和病毒的蛋白质变性，达到消毒、灭菌的目的。</li>
<li>鸡蛋煮熟后不能恢复原状：变性一般<b>不可逆</b>。</li></ul>
<b>盐析不是变性：</b>在蛋白质溶液中加入食盐，蛋白质析出，加水后又能溶解，空间结构没有被破坏，是可逆的物理过程。`,
  exam:'对比“变性、盐析、水解”三个概念：变性破坏空间结构（不可逆）；盐析不破坏结构（可逆）；水解断开肽键（得到氨基酸）。'}],
 traps:['“蛋白质只分布在细胞内”错：抗体、消化酶等分布在细胞外。','“高温使蛋白质的肽键断裂”错：破坏的是空间结构。','“每种氨基酸只含一个氨基和一个羧基”错：R 基中可能还有。','“氨基酸的种类由氨基和羧基决定”错：由 R 基决定。','“人体能合成全部 21 种氨基酸”错：有 8 种必需氨基酸不能合成。']},

{id:'2-5',t:'核酸是遗传信息的携带者',
 goal:'能比较 DNA 和 RNA 的组成、分布和结构；理解为什么只有 4 种核苷酸的 DNA 能储存海量遗传信息；建立“生物大分子以碳链为骨架”“单体—多聚体”的概念。',
 focus:[[3,'DNA 与 RNA 在化学组成上的异同'],[3,'核苷酸、碱基、五碳糖种类数的计算'],[2,'核酸的分布与功能'],[2,'单体与多聚体；碳链骨架'],[1,'DNA 指纹技术的原理']],
 models:['nucleo'],
 pts:[
 {t:'核酸的种类与分布',lv:2,k:['DNA','RNA','细胞核','线粒体','叶绿体'],
  core:'核酸包括<b>脱氧核糖核酸（DNA）</b>和<b>核糖核酸（RNA）</b>两大类。真核细胞的 DNA <b>主要分布在细胞核</b>中，线粒体、叶绿体内也含有少量 DNA；RNA <b>主要分布在细胞质</b>中。',
  why:`<b>“核酸”名字的由来：</b>最初是从细胞核中提取的、具有酸性的物质。但核酸<b>不只存在于细胞核</b>，细胞质中也有（RNA、线粒体和叶绿体 DNA），原核细胞没有细胞核也有核酸。
<b>原核细胞中：</b>DNA 主要分布在拟核，RNA 分布在细胞质。`,
  exam:'“核酸是生物的遗传物质，仅存在于细胞核中”（错）。'},
 {t:'核苷酸的组成：DNA 与 RNA 的区别',lv:3,k:['核苷酸','磷酸','五碳糖','含氮碱基','脱氧核糖','核糖','T','U'],
  core:'核酸的基本组成单位是<b>核苷酸</b>。一个核苷酸由<b>一分子含氮碱基、一分子五碳糖和一分子磷酸</b>组成。根据五碳糖不同，分为<b>脱氧核糖核苷酸</b>（组成 DNA）和<b>核糖核苷酸</b>（组成 RNA）。',
  why:`<table class="tb"><tr><th></th><th>DNA</th><th>RNA</th></tr>
<tr><td>基本单位</td><td>脱氧核苷酸（4 种）</td><td>核糖核苷酸（4 种）</td></tr>
<tr><td>五碳糖</td><td><b>脱氧核糖</b></td><td><b>核糖</b></td></tr>
<tr><td>碱基</td><td>A、G、C、<b>T</b></td><td>A、G、C、<b>U</b></td></tr>
<tr><td>链数</td><td>一般为<b>两条</b>脱氧核苷酸链</td><td>一般为<b>一条</b>核糖核苷酸链</td></tr>
<tr><td>相同点</td><td colspan="2">都有磷酸；都有 A、G、C 三种碱基</td></tr></table>
<b>“脱氧”是什么意思？</b>脱氧核糖比核糖少一个氧原子（C₅H₁₀O₄ vs C₅H₁₀O₅），在五碳糖的 2 号碳上，核糖连 —OH，脱氧核糖只连 —H。
<b>连接方式：</b>相邻核苷酸之间，一个核苷酸的磷酸与另一个核苷酸的五碳糖相连，形成长链（磷酸和五碳糖交替排列构成骨架，碱基伸在侧面）。`,
  exam:'“DNA 和 RNA 在化学组成上的区别”：五碳糖不同、碱基不完全相同（T 和 U）。注意磷酸是相同的。'},
 {t:'种类数计算',lv:3,k:['8种核苷酸','5种碱基','2种五碳糖'],
  core:'细胞生物（同时含 DNA 和 RNA）：<b>核苷酸 8 种、碱基 5 种、五碳糖 2 种</b>。病毒（只含一种核酸）：<b>核苷酸 4 种、碱基 4 种、五碳糖 1 种</b>。',
  why:`<b>计算思路：先判断生物类型，再看题目问的是哪一级。</b>
<ul><li>人、豌豆、细菌等细胞生物：DNA + RNA 都有 → 碱基 A、G、C、T、U 共 5 种；核苷酸 4 + 4 = 8 种。</li>
<li>HIV、新冠病毒、SARS 病毒（RNA 病毒）：只有 RNA → 碱基 4 种（A、G、C、U），核苷酸 4 种。</li>
<li>T2 噬菌体（DNA 病毒）：只有 DNA → 碱基 A、G、C、T 4 种。</li></ul>
<b>经典变式：</b>人体细胞中，含有 A、G、C、T 的核苷酸有几种？
A、G、C 各有脱氧和核糖两种核苷酸 = 6 种；T 只在 DNA 中 = 1 种；共 <b>7 种</b>。
<b>水解产物：</b>
<ul><li>DNA <b>初步水解</b> → 4 种脱氧核苷酸；<b>彻底水解</b> → 磷酸、脱氧核糖、4 种碱基（共 6 种小分子）。</li>
<li>RNA <b>彻底水解</b> → 磷酸、核糖、A/G/C/U（共 6 种）。</li></ul>`,
  exam:'“豌豆叶肉细胞中的核酸含有的碱基种类”——5 种。“RNA 彻底水解后得到的物质”——核糖、含氮碱基、磷酸。'},
 {t:'核酸的功能与遗传信息',lv:2,k:['遗传信息','脱氧核苷酸序列','DNA指纹'],
  core:'核酸是细胞内<b>携带遗传信息</b>的物质，在生物体的<b>遗传、变异和蛋白质的生物合成</b>中具有极其重要的作用。DNA 的<b>脱氧核苷酸（碱基）排列顺序</b>储存着生物的遗传信息。',
  why:`<b>只有 4 种核苷酸，怎么储存那么多信息？</b>就像只有 0 和 1 两个数字的二进制能存下所有电脑文件一样，关键在于<b>排列顺序</b>和<b>长度</b>。一条由 n 个脱氧核苷酸组成的单链，排列方式有 4ⁿ 种。核酸分子长达几十到上亿个核苷酸，信息容量极大。
<b>DNA 指纹技术的原理：</b>每个个体 DNA 的脱氧核苷酸序列各有特点（同卵双胞胎除外），把现场样品中的 DNA 与嫌疑人的进行比对，就能为侦破案件提供证据，也可用于亲子鉴定、遇难者身份确认。
<b>遗传物质：</b>有细胞结构的生物遗传物质都是 <b>DNA</b>；部分病毒的遗传信息储存在 <b>RNA</b> 中，如 HIV、SARS 病毒。
<b>多糖为什么不能携带遗传信息？</b>多糖（如淀粉）的单体只有葡萄糖一种，排列顺序无法变化，不能编码信息；核酸的单体有 4 种，排列顺序千变万化。`,
  exam:'教材复习题：“为什么核酸是遗传信息的携带者，而多糖不是？”——从单体种类和排列顺序角度回答。核酸保健品广告题：“补充核酸能修复基因”没有科学依据，核酸会被消化成核苷酸等小分子。'},
 {t:'生物大分子以碳链为骨架',lv:2,k:['单体','多聚体','碳链','共价键'],
  core:'多糖、蛋白质、核酸都是生物大分子，分别以<b>单糖、氨基酸、核苷酸</b>为单体连接成多聚体。每一个单体都以若干个相连的碳原子构成的<b>碳链为基本骨架</b>，因此生物大分子也以碳链为骨架。“碳是生命的核心元素”。',
  why:`<b>为什么是碳？</b>碳原子最外层有 4 个电子，不易失去或得到电子形成离子，而是通过<b>共用电子对（共价键）</b>与其他原子结合。碳原子之间也能形成共价键，连成稳定的长链甚至环，为复杂分子提供“骨架”。
<table class="tb"><tr><th>多聚体（生物大分子）</th><th>单体</th></tr><tr><td>多糖（淀粉、纤维素、糖原）</td><td>单糖（葡萄糖）</td></tr><tr><td>蛋白质</td><td>氨基酸</td></tr><tr><td>核酸</td><td>核苷酸</td></tr></table>
<p class="warn">脂肪不是生物大分子：它由甘油和脂肪酸组成，相对分子质量不大，也不是由许多相同单体重复连接成的。</p>
<b>全章总结：</b>以碳链为骨架的多糖、蛋白质、核酸构成细胞生命大厦的基本框架；糖类和脂质提供生命活动的重要能源；水和无机盐与其他物质一起承担构建细胞、参与生命活动的功能。`,
  exam:'“构成生物大分子基本骨架的元素是”——C。'}],
 traps:['“DNA 只分布在细胞核中”错：线粒体、叶绿体中也有。','“DNA 和 RNA 的磷酸不同”错：磷酸相同，区别在五碳糖和碱基。','“所有生物的遗传物质都是 DNA”错：部分病毒是 RNA。','“核酸初步水解得到磷酸、五碳糖和碱基”错：那是彻底水解的产物。','“脂肪是生物大分子”错。']}
]}];
